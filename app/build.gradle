plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.replate.app'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.replate.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "PAYHERE_MERCHANT_ID",
            '"' + (localProps.getProperty("PAYHERE_MERCHANT_ID") ?: "") + '"'
        buildConfigField "String", "PAYHERE_MERCHANT_SECRET",
            '"' + (localProps.getProperty("PAYHERE_MERCHANT_SECRET") ?: "") + '"'
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID",
            '"' + (localProps.getProperty("GOOGLE_WEB_CLIENT_ID") ?: "") + '"'

        // Anything compiled into an APK can be extracted, so never add server keys here (for example
        // an FCM server key). The Maps key must be restricted to this app in Google Cloud Console.
        resValue "string", "google_maps_key",
            (localProps.getProperty("GOOGLE_MAPS_API_KEY") ?: "")
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    implementation 'androidx.viewpager2:viewpager2:1.0.0'

    implementation 'me.relex:circleindicator:2.1.6'

    implementation 'androidx.cardview:cardview:1.0.0'

    implementation platform('com.google.firebase:firebase-bom:32.3.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-messaging'
    // Crash reports and basic usage statistics (mention both in your privacy policy)
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'

    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    implementation 'com.facebook.android:facebook-login:17.0.0'

    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    implementation 'com.github.bumptech.glide:glide:4.16.0'

    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'com.github.PayHereDevs:payhere-android-sdk:v3.0.18'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.google.zxing:core:3.5.2'

    implementation 'androidx.core:core-splashscreen:1.0.1'

    implementation 'androidx.work:work-runtime:2.9.0'

    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// A release build without a Maps key would ship a blank grey map. Fail early instead.
gradle.taskGraph.whenReady { graph ->
    def building = graph.allTasks.any { it.path.startsWith(':app:') && it.name.toLowerCase().contains('release') && (it.name.startsWith('assemble') || it.name.startsWith('bundle')) }
    if (building && !(localProps.getProperty("GOOGLE_MAPS_API_KEY") ?: "").trim()) {
        throw new GradleException("GOOGLE_MAPS_API_KEY is missing from local.properties; a release build would have a blank map.")
    }
}
