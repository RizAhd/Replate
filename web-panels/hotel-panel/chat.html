<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Customer Chats - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <style>
        /* ── Chat-specific styles ─────────────────────────── */
        .chat-container {
            display: flex;
            height: calc(100vh - 160px);
            min-height: 480px;
            border-radius: var(--radius-md);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        /* ── Conversation sidebar ─────────────────────────── */
        .conversation-list {
            width: 340px;
            min-width: 280px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }
        .conv-search {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .conv-search input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 9px 16px 9px 38px;
            font-size: 13px;
            outline: none;
            background: var(--bg);
            transition: border-color var(--transition-fast);
        }
        .conv-search input:focus {
            border-color: var(--primary);
        }
        .conv-search i {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 13px;
        }
        .conv-items {
            flex: 1;
            overflow-y: auto;
        }
        .conversation-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background var(--transition-fast);
        }
        .conversation-item:hover {
            background: var(--primary-50);
        }
        .conversation-item.active {
            background: var(--primary-light);
            border-left: 3px solid var(--primary);
        }
        .conversation-item .conv-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }
        .conversation-item h6 {
            margin: 0;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }
        .conversation-item .conv-preview {
            margin: 3px 0 0;
            font-size: 12.5px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conversation-item .conv-time {
            font-size: 11px;
            color: var(--text-tertiary);
            white-space: nowrap;
        }
        .conversation-item .conv-food {
            font-size: 11px;
            color: var(--primary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ── Chat area ────────────────────────────────────── */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            min-width: 0;
        }
        .chat-header {
            padding: 14px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .ch-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 17px;
            flex-shrink: 0;
        }
        .chat-header h5 {
            margin: 0;
            font-weight: 600;
            font-size: 15px;
        }
        .chat-header .ch-sub {
            margin: 0;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .chat-header .ch-food-badge {
            font-size: 11px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 3px 12px;
            border-radius: var(--radius-pill);
            margin-left: auto;
            white-space: nowrap;
        }

        /* ── Messages ─────────────────────────────────────── */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 68%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.45;
            word-break: break-word;
        }
        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
        }
        .message .msg-time {
            font-size: 10px;
            opacity: 0.65;
            margin-top: 5px;
            text-align: right;
        }

        /* ── Input bar ────────────────────────────────────── */
        .chat-input {
            padding: 14px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        .chat-input input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 10px 18px;
            font-size: 13.5px;
            outline: none;
            font-family: var(--font-sans);
            background: var(--bg);
            transition: border-color var(--transition-fast);
        }
        .chat-input input:focus {
            border-color: var(--primary);
        }
        .chat-input button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: background var(--transition-fast), transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .chat-input button:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }
        .chat-input button:active {
            transform: scale(0.97);
        }

        /* ── Empty / placeholder states ───────────────────── */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            text-align: center;
            padding: 40px;
        }
        .empty-chat i {
            font-size: 52px;
            margin-bottom: 16px;
            opacity: 0.35;
        }
        .empty-chat h5 {
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .empty-chat p {
            font-size: 13px;
        }
        .no-conversations {
            padding: 48px 24px;
            text-align: center;
            color: var(--text-tertiary);
        }
        .no-conversations i {
            font-size: 40px;
            opacity: 0.35;
            margin-bottom: 14px;
        }

        /* ── Responsive ───────────────────────────────────── */
        @media (max-width: 768px) {
            .chat-container {
                height: calc(100vh - 130px);
                flex-direction: column;
            }
            .conversation-list {
                width: 100%;
                max-height: 220px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main>
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Customer Chats</h1>
                    <p class="panel-subtitle mb-0">Real-time messaging with your customers</p>
                </div>
                <span class="badge bg-success-subtle text-success px-3 py-2" id="chatStatus" style="display:none;">
                    <i class="fas fa-circle" style="font-size:7px;vertical-align:middle;margin-right:4px;"></i> Connected
                </span>
            </div>

            <div class="chat-container card">
                <!-- Conversation List -->
                <div class="conversation-list">
                    <div class="conv-search position-relative">
                        <i class="fas fa-search"></i>
                        <input type="text" id="convSearch" placeholder="Search conversations..." oninput="filterConversations()">
                    </div>
                    <div class="conv-items" id="conversationList">
                        <div class="no-conversations">
                            <i class="fas fa-comments d-block"></i>
                            <p class="mt-2 mb-1 fw-semibold" style="color:var(--text-secondary);">No conversations yet</p>
                            <small>Customer messages will appear here</small>
                        </div>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="chat-area" id="chatArea">
                    <div class="empty-chat">
                        <i class="fas fa-comments"></i>
                        <h5>Select a conversation</h5>
                        <p>Choose a customer from the left to start chatting</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    /* ────────────────────────────────────────────────────────
       SIDEBAR — same links as every other hotel page
       ──────────────────────────────────────────────────────── */
    const hotelShellLinks = [
        { key: 'dashboard',  href: 'dashboard.html',       icon: 'fas fa-home',         label: 'Dashboard' },
        { key: 'add-food',   href: 'add-food.html',        icon: 'fas fa-plus-circle',  label: 'Add Food' },
        { key: 'listings',   href: 'manage-listings.html',  icon: 'fas fa-list',         label: 'My Listings' },
        { key: 'orders',     href: 'orders.html',           icon: 'fas fa-receipt',      label: 'Orders' },
        { key: 'analytics',  href: 'analytics.html',        icon: 'fas fa-chart-line',   label: 'Analytics' },
        { key: 'chat',       href: 'chat.html',             icon: 'fas fa-comments',     label: 'Chat' },
        { key: 'settings',   href: 'settings.html',         icon: 'fas fa-cog',          label: 'Settings' },
        { key: 'logout',     href: '#',                     icon: 'fas fa-sign-out-alt', label: 'Logout', logout: true }
    ];

    /* ────────────────────────────────────────────────────────
       STATE
       ──────────────────────────────────────────────────────── */
    let currentHotelId = null;
    let currentHotelName = null;
    let currentConversationId = null;
    let messagesListener = null;
    let allConversations = [];   // cached for search filtering

    /* ────────────────────────────────────────────────────────
       AUTH + INIT
       ──────────────────────────────────────────────────────── */
    auth.onAuthStateChanged(async (user) => {
        // Render sidebar immediately
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">REPLATE',
            activeKey: 'chat',
            links: hotelShellLinks,
        });

        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        // Resolve hotelId properly — must match what the Android app uses
        currentHotelId = sessionStorage.getItem('hotelId');

        if (!currentHotelId) {
            try {
                const hotelRecord = await ReplateSchema.findHotelByUserId(database, user.uid);
                if (hotelRecord) {
                    currentHotelId = hotelRecord.key;
                    currentHotelName = hotelRecord.value?.name || hotelRecord.value?.hotelName || 'Hotel';
                    sessionStorage.setItem('hotelId', currentHotelId);
                } else {
                    currentHotelId = user.uid;
                }
            } catch (e) {
                console.error('Failed to resolve hotelId:', e);
                currentHotelId = user.uid;
            }
        }

        // Load hotel name if we don't have it yet
        if (!currentHotelName) {
            try {
                const snap = await database.ref('hotels/' + currentHotelId).once('value');
                if (snap.exists()) {
                    currentHotelName = snap.val().name || snap.val().hotelName || 'Hotel';
                }
            } catch (e) { /* ignore */ }
        }

        console.log('[Chat] hotelId =', currentHotelId, '| name =', currentHotelName);
        document.getElementById('chatStatus').style.display = '';
        loadConversations();
    });

    function logout() {
        auth.signOut().then(() => { window.location.href = 'login.html'; });
    }

    /* ────────────────────────────────────────────────────────
       CONVERSATION LIST (real-time via Firebase .on('value'))
       ──────────────────────────────────────────────────────── */
    function loadConversations() {
        const listEl = document.getElementById('conversationList');

        database.ref('conversations/' + currentHotelId)
            .orderByChild('lastTimestamp')
            .on('value', (snapshot) => {
                allConversations = [];

                if (!snapshot.exists()) {
                    listEl.innerHTML = `
                        <div class="no-conversations">
                            <i class="fas fa-comments d-block"></i>
                            <p class="mt-2 mb-1 fw-semibold" style="color:var(--text-secondary);">No conversations yet</p>
                            <small>Customer messages will appear here</small>
                        </div>`;
                    return;
                }

                snapshot.forEach((child) => {
                    allConversations.push({ id: child.key, ...child.val() });
                });

                // Most recent first
                allConversations.sort((a, b) => (b.lastTimestamp || 0) - (a.lastTimestamp || 0));
                renderConversations(allConversations);
            });
    }

    function renderConversations(conversations) {
        const listEl = document.getElementById('conversationList');

        if (!conversations.length) {
            listEl.innerHTML = `
                <div class="no-conversations">
                    <i class="fas fa-search d-block"></i>
                    <p class="mt-2 mb-1" style="color:var(--text-secondary);">No results</p>
                </div>`;
            return;
        }

        listEl.innerHTML = conversations.map(conv => {
            const time = conv.lastTimestamp ? formatTime(conv.lastTimestamp) : '';
            const isActive = conv.id === currentConversationId ? ' active' : '';
            const initial = (conv.customerName || 'C')[0].toUpperCase();
            const foodHtml = conv.foodName
                ? `<div class="conv-food"><i class="fas fa-utensils"></i>${esc(conv.foodName)}</div>`
                : '';

            const cName = esc(conv.customerName || 'Customer');
            const cEmail = esc(conv.customerEmail || '');
            const cFood = esc(conv.foodName || '');
            const cId = conv.customerId || '';

            return `
                <div class="conversation-item${isActive}"
                     data-conv-id="${conv.id}"
                     onclick="selectConversation('${conv.id}', '${cName}', '${cId}', '${cEmail}', '${cFood}')">
                    <div class="d-flex align-items-center gap-3">
                        <div class="conv-avatar">${initial}</div>
                        <div class="flex-grow-1" style="min-width:0;">
                            <div class="d-flex justify-content-between align-items-start">
                                <h6>${esc(conv.customerName || 'Customer')}</h6>
                                <span class="conv-time">${time}</span>
                            </div>
                            <p class="conv-preview">${esc(conv.lastMessage || 'No messages yet')}</p>
                            ${foodHtml}
                        </div>
                    </div>
                </div>`;
        }).join('');
    }

    /* ── Search filter ──────────────────────────────────── */
    function filterConversations() {
        const q = (document.getElementById('convSearch').value || '').trim().toLowerCase();
        if (!q) {
            renderConversations(allConversations);
            return;
        }
        const filtered = allConversations.filter(c =>
            (c.customerName || '').toLowerCase().includes(q) ||
            (c.foodName || '').toLowerCase().includes(q) ||
            (c.customerEmail || '').toLowerCase().includes(q)
        );
        renderConversations(filtered);
    }

    /* ────────────────────────────────────────────────────────
       SELECT CONVERSATION → open chat area
       ──────────────────────────────────────────────────────── */
    function selectConversation(conversationId, customerName, customerId, customerEmail, foodName) {
        currentConversationId = conversationId;

        // Highlight active item
        document.querySelectorAll('.conversation-item').forEach(el => {
            el.classList.toggle('active', el.dataset.convId === conversationId);
        });

        const initial = (customerName || 'C')[0].toUpperCase();
        const emailHtml = customerEmail
            ? `<p class="ch-sub"><i class="fas fa-envelope" style="margin-right:4px;font-size:10px;"></i>${esc(customerEmail)}</p>`
            : '<p class="ch-sub">Customer</p>';
        const foodHtml = foodName
            ? `<span class="ch-food-badge"><i class="fas fa-utensils" style="margin-right:4px;"></i>${esc(foodName)}</span>`
            : '';

        document.getElementById('chatArea').innerHTML = `
            <div class="chat-header">
                <div class="ch-avatar">${initial}</div>
                <div style="flex:1;min-width:0;">
                    <h5>${esc(customerName)}</h5>
                    ${emailHtml}
                </div>
                ${foodHtml}
            </div>
            <div class="messages-container" id="messagesContainer">
                <div style="text-align:center;padding:40px;color:var(--text-tertiary);">
                    <i class="fas fa-spinner fa-spin"></i> Loading messages...
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type a message..."
                       onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}">
                <button onclick="sendMessage()" title="Send message"><i class="fas fa-paper-plane"></i></button>
            </div>
        `;

        setTimeout(() => document.getElementById('messageInput')?.focus(), 100);
        loadMessages(conversationId);
    }

    /* ────────────────────────────────────────────────────────
       MESSAGES — real-time via Firebase child_added
       ──────────────────────────────────────────────────────── */
    function loadMessages(conversationId) {
        const container = document.getElementById('messagesContainer');
        if (!container) return;

        // Detach previous listener
        if (messagesListener && messagesListener.ref) {
            messagesListener.ref.off('child_added', messagesListener.callback);
            messagesListener = null;
        }

        container.innerHTML = '';

        const messagesRef = database.ref('chats/' + conversationId + '/messages');

        const callback = (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;

            const isSent = msg.senderId === auth.currentUser?.uid || msg.senderType === 'hotel';
            const time = msg.timestamp ? formatTime(msg.timestamp) : '';

            const el = document.createElement('div');
            el.className = 'message ' + (isSent ? 'sent' : 'received');
            el.innerHTML = `${esc(msg.message)}<div class="msg-time">${time}</div>`;
            container.appendChild(el);

            requestAnimationFrame(() => {
                container.scrollTop = container.scrollHeight;
            });
        };

        messagesListener = { ref: messagesRef, callback };
        messagesRef.orderByChild('timestamp').on('child_added', callback);
    }

    /* ────────────────────────────────────────────────────────
       SEND MESSAGE
       ──────────────────────────────────────────────────────── */
    function sendMessage() {
        const input = document.getElementById('messageInput');
        if (!input) return;
        const message = input.value.trim();
        if (!message || !currentConversationId) return;

        input.value = '';
        input.focus();

        const messageId = database.ref().push().key;
        const timestamp = Date.now();

        // Parse customerId from conversation ID (format: hotelId_customerId)
        const parts = currentConversationId.split('_');
        const customerId = parts.length > 1 ? parts.slice(1).join('_') : '';

        const messageData = {
            conversationId: currentConversationId,
            senderId: auth.currentUser.uid,
            senderName: currentHotelName || 'Hotel',
            senderType: 'hotel',
            receiverId: customerId,
            message: message,
            timestamp: timestamp,
            read: false,
            hotelId: currentHotelId,
            hotelName: currentHotelName
        };

        database.ref('chats/' + currentConversationId + '/messages/' + messageId).set(messageData);

        const metaUpdate = {
            lastMessage: message,
            lastTimestamp: timestamp,
            lastSenderId: auth.currentUser.uid
        };
        database.ref('conversations/' + currentHotelId + '/' + currentConversationId).update(metaUpdate);

        if (customerId) {
            database.ref('conversations/' + customerId + '/' + currentConversationId).update(metaUpdate);
        }
    }

    /* ────────────────────────────────────────────────────────
       UTILITIES
       ──────────────────────────────────────────────────────── */
    function formatTime(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diffMs = now - date;

        if (diffMs < 60 * 1000) return 'Just now';
        if (diffMs < 24 * 60 * 60 * 1000) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        if (diffMs < 7 * 24 * 60 * 60 * 1000) {
            return date.toLocaleDateString([], { weekday: 'short' });
        }
        return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function esc(text) {
        const d = document.createElement('div');
        d.textContent = text || '';
        return d.innerHTML;
    }

    const escapeHtml = esc;
</script>
</body>
</html>
