<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Customer Chats - REPLATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <style>
        /* ═══════════════════════════════════════════════════
           3-PANEL CHAT LAYOUT
           Left:   Conversation list
           Center: Live chat (messages + input)
           Right:  Customer details & context
           ═══════════════════════════════════════════════════ */

        .chat-wrapper {
            display: flex;
            height: calc(100vh - 145px);
            min-height: 500px;
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--surface);
            box-shadow: var(--shadow-sm);
        }

        /* ── LEFT: Conversation List ─────────────────────── */
        .panel-conversations {
            width: 300px;
            min-width: 260px;
            border-right: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            flex-direction: column;
        }
        .panel-conversations .panel-head {
            padding: 18px 16px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }
        .panel-conversations .panel-head h6 {
            margin: 0 0 10px;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }
        .conv-search-wrap {
            position: relative;
        }
        .conv-search-wrap input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 8px 14px 8px 36px;
            font-size: 13px;
            outline: none;
            background: var(--bg);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .conv-search-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 107, 60, 0.08);
        }
        .conv-search-wrap i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-tertiary);
            font-size: 12px;
        }
        .conv-items {
            flex: 1;
            overflow-y: auto;
        }
        .conversation-item {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border-light);
            cursor: pointer;
            transition: background var(--transition-fast);
        }
        .conversation-item:hover {
            background: var(--primary-50);
        }
        .conversation-item.active {
            background: var(--primary-light);
            border-left: 3px solid var(--primary);
            padding-left: 11px;
        }
        .conversation-item .c-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }
        .conversation-item h6 {
            margin: 0;
            font-weight: 600;
            font-size: 13.5px;
            color: var(--text-primary);
        }
        .conversation-item .c-preview {
            margin: 2px 0 0;
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 170px;
        }
        .conversation-item .c-time {
            font-size: 10px;
            color: var(--text-tertiary);
            white-space: nowrap;
        }
        .conversation-item .c-food {
            font-size: 10.5px;
            color: var(--primary);
            margin-top: 3px;
        }
        .conversation-item .c-food i {
            font-size: 9px;
            margin-right: 3px;
        }
        .no-conversations {
            padding: 50px 20px;
            text-align: center;
            color: var(--text-tertiary);
        }
        .no-conversations i {
            font-size: 36px;
            opacity: 0.3;
            display: block;
            margin-bottom: 12px;
        }

        /* ── CENTER: Live Chat ───────────────────────────── */
        .panel-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8faf9;
            min-width: 0;
            border-right: 1px solid var(--border);
        }
        .chat-topbar {
            padding: 12px 20px;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 58px;
        }
        .chat-topbar .ct-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            flex-shrink: 0;
        }
        .chat-topbar .ct-name {
            font-weight: 600;
            font-size: 14.5px;
            margin: 0;
        }
        .chat-topbar .ct-status {
            font-size: 11px;
            opacity: 0.75;
            margin: 0;
        }
        .chat-topbar .ct-live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            display: inline-block;
            margin-right: 4px;
            animation: livePulse 2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg-bubble {
            max-width: 72%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 13.5px;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
        }
        .msg-bubble.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-bubble.received {
            align-self: flex-start;
            background: white;
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .msg-bubble .m-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }
        .chat-compose {
            padding: 12px 18px;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-compose input {
            flex: 1;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-pill);
            padding: 10px 18px;
            font-size: 13.5px;
            outline: none;
            font-family: var(--font-sans);
            background: var(--bg);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .chat-compose input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 107, 60, 0.08);
        }
        .chat-compose .btn-send {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: background var(--transition-fast), transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .chat-compose .btn-send:hover {
            background: var(--primary-hover);
            transform: scale(1.06);
        }
        .chat-compose .btn-send:active {
            transform: scale(0.96);
        }

        /* ── RIGHT: Customer Details Panel ───────────────── */
        .panel-details {
            width: 280px;
            min-width: 240px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        .detail-profile {
            text-align: center;
            padding: 32px 20px 24px;
            border-bottom: 1px solid var(--border-light);
        }
        .detail-profile .dp-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 28px;
            margin: 0 auto 14px;
            box-shadow: 0 4px 14px rgba(26, 107, 60, 0.25);
        }
        .detail-profile h5 {
            margin: 0 0 2px;
            font-weight: 700;
            font-size: 16px;
            color: var(--text-primary);
        }
        .detail-profile .dp-role {
            font-size: 12px;
            color: var(--text-tertiary);
            margin: 0;
        }
        .detail-section {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-light);
        }
        .detail-section:last-child {
            border-bottom: none;
        }
        .detail-section .ds-label {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-tertiary);
            margin: 0 0 10px;
        }
        .detail-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 7px 0;
        }
        .detail-row i {
            width: 16px;
            text-align: center;
            color: var(--primary);
            font-size: 13px;
            margin-top: 2px;
            flex-shrink: 0;
        }
        .detail-row .dr-text {
            font-size: 13px;
            color: var(--text-primary);
            word-break: break-all;
            line-height: 1.4;
        }
        .detail-row .dr-text small {
            display: block;
            font-size: 11px;
            color: var(--text-tertiary);
            margin-top: 1px;
        }
        .detail-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--primary-light);
            color: var(--primary);
            padding: 5px 12px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
        }

        /* ── Empty / placeholder states ───────────────────── */
        .empty-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            text-align: center;
            padding: 40px 24px;
        }
        .empty-panel i {
            font-size: 48px;
            margin-bottom: 14px;
            opacity: 0.25;
        }
        .empty-panel h5 {
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
            font-size: 15px;
        }
        .empty-panel p {
            font-size: 12.5px;
            max-width: 200px;
        }

        /* ── Responsive ───────────────────────────────────── */
        @media (max-width: 1100px) {
            .panel-details { display: none; }
        }
        @media (max-width: 768px) {
            .chat-wrapper {
                flex-direction: column;
                height: calc(100vh - 120px);
            }
            .panel-conversations {
                width: 100%;
                min-width: unset;
                max-height: 200px;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .panel-chat {
                border-right: none;
            }
            .panel-details { display: none; }
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main>
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Customer Chats</h1>
                    <p class="panel-subtitle mb-0">Real-time messaging with your customers</p>
                </div>
                <span class="badge bg-success-subtle text-success px-3 py-2" id="chatStatus" style="display:none;">
                    <i class="fas fa-circle" style="font-size:7px;vertical-align:middle;margin-right:4px;"></i> Connected
                </span>
            </div>

            <!-- ═══ 3-PANEL CHAT ═══ -->
            <div class="chat-wrapper">

                <!-- LEFT: Conversation List -->
                <div class="panel-conversations">
                    <div class="panel-head">
                        <h6><i class="fas fa-inbox" style="margin-right:6px;"></i>Conversations</h6>
                        <div class="conv-search-wrap">
                            <i class="fas fa-search"></i>
                            <input type="text" id="convSearch" placeholder="Search..." oninput="filterConversations()" aria-label="Search conversations">
                        </div>
                    </div>
                    <div class="conv-items" id="conversationList">
                        <div class="no-conversations">
                            <i class="fas fa-comments"></i>
                            <p class="mb-1 fw-semibold" style="color:var(--text-secondary);font-size:13px;">No conversations yet</p>
                            <small style="font-size:12px;">Customer messages will appear here</small>
                        </div>
                    </div>
                </div>

                <!-- CENTER: Live Chat -->
                <div class="panel-chat" id="panelChat">
                    <div class="empty-panel">
                        <i class="fas fa-comments"></i>
                        <h5>Select a conversation</h5>
                        <p>Choose a customer from the left to start chatting</p>
                    </div>
                </div>

                <!-- RIGHT: Customer Details -->
                <div class="panel-details" id="panelDetails">
                    <div class="empty-panel">
                        <i class="fas fa-user-circle"></i>
                        <h5>Customer Details</h5>
                        <p>Select a conversation to see customer information</p>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>
<script src="../js/hotel-shell-config.js"></script>

<script>

    /* ────────────────────────────────────────────────────────
       STATE
       ──────────────────────────────────────────────────────── */
    let currentHotelId = null;
    let currentHotelName = null;
    let currentConversationId = null;
    let currentConversationMeta = null;
    let messagesListener = null;
    let messagesChangedListener = null;
    let allConversations = [];
    let renderedMessageIds = new Set();

    /* ────────────────────────────────────────────────────────
       AUTH + INIT
       ──────────────────────────────────────────────────────── */
    auth.onAuthStateChanged(async (user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">REPLATE',
            activeKey: 'chat',
            links: hotelShellLinks,
        });

        if (!user) { window.location.href = 'login.html'; return; }

        currentHotelId = sessionStorage.getItem('hotelId');
        if (!currentHotelId) {
            try {
                const rec = await ReplateSchema.findHotelByUserId(database, user.uid);
                if (rec) {
                    currentHotelId = rec.key;
                    currentHotelName = rec.value?.name || rec.value?.hotelName || 'Hotel';
                    sessionStorage.setItem('hotelId', currentHotelId);
                } else { currentHotelId = user.uid; }
            } catch (e) { currentHotelId = user.uid; }
        }
        if (!currentHotelName) {
            try {
                const s = await database.ref('hotels/' + currentHotelId).once('value');
                if (s.exists()) currentHotelName = s.val().name || s.val().hotelName || 'Hotel';
            } catch (e) {}
        }

        document.getElementById('chatStatus').style.display = '';
        updateConnectionStatus();
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        loadConversations();
    });

    function logout() { auth.signOut().then(() => { window.location.href = 'login.html'; }); }

    function updateConnectionStatus() {
        const badge = document.getElementById('chatStatus');
        if (!badge) return;

        const online = navigator.onLine;
        badge.style.display = '';
        badge.className = online
            ? 'badge bg-success-subtle text-success px-3 py-2'
            : 'badge bg-warning-subtle text-warning px-3 py-2';
        badge.innerHTML = online
            ? '<i class="fas fa-circle" style="font-size:7px;vertical-align:middle;margin-right:4px;"></i> Connected'
            : '<i class="fas fa-circle" style="font-size:7px;vertical-align:middle;margin-right:4px;"></i> Offline';
    }

    /* ────────────────────────────────────────────────────────
       CONVERSATION LIST
       Checks both hotelId and user.uid paths to catch all
       conversations regardless of how they were written.
       ──────────────────────────────────────────────────────── */
    let convListeners = [];

    function loadConversations() {
        const listEl = document.getElementById('conversationList');
        const uid = auth.currentUser?.uid;

        // Build list of unique paths to check
        const paths = new Set();
        if (currentHotelId) paths.add(currentHotelId);
        if (uid && uid !== currentHotelId) paths.add(uid);


        // Detach any previous listeners
        convListeners.forEach(l => l.ref.off('value', l.cb));
        convListeners = [];

        // Merge map keyed by conversationId to deduplicate
        const mergedMap = {};

        function refreshUI() {
            allConversations = Object.values(mergedMap);
            allConversations.sort((a, b) => (b.lastTimestamp || 0) - (a.lastTimestamp || 0));

            if (!allConversations.length) {
                listEl.innerHTML = `<div class="no-conversations"><i class="fas fa-comments"></i>
                    <p class="mb-1 fw-semibold" style="color:var(--text-secondary);font-size:13px;">No conversations yet</p>
                    <small style="font-size:12px;">Customer messages will appear here</small></div>`;
                return;
            }
            renderConversations(allConversations);
        }

        paths.forEach(path => {
            const ref = database.ref('conversations/' + path);
            const cb = (snapshot) => {
                if (snapshot.exists()) {
                    snapshot.forEach(c => {
                        mergedMap[c.key] = { id: c.key, ...c.val() };
                    });
                    // Conversations loaded from Firebase
                } else {
                    // No conversations under this path
                }
                refreshUI();
            };
            convListeners.push({ ref, cb });
            ref.orderByChild('lastTimestamp').on('value', cb);
        });

        // Also scan the chats/ node directly as a fallback
        // in case conversations meta was never written
        database.ref('chats').orderByKey().once('value', (snap) => {
            if (!snap.exists()) return;
            let found = 0;
            snap.forEach(chatChild => {
                const convId = chatChild.key;
                // Check if this conversation belongs to this hotel
                if (convId.startsWith(currentHotelId + '_') ||
                    (uid && convId.startsWith(uid + '_'))) {
                    if (!mergedMap[convId]) {
                        // Build minimal conversation data from chat messages
                        const msgs = chatChild.child('messages');
                        let lastMsg = '', lastTs = 0, custName = 'Customer', custId = '', custEmail = '', food = '';
                        msgs.forEach(m => {
                            const v = m.val();
                            if (v.timestamp > lastTs) {
                                lastTs = v.timestamp;
                                lastMsg = v.message || '';
                            }
                            if (v.customerName) custName = v.customerName;
                            if (v.customerId) custId = v.customerId;
                            if (v.customerEmail) custEmail = v.customerEmail;
                            if (v.foodName) food = v.foodName;
                            // If sender is customer, grab their info
                            if (v.senderType === 'customer') {
                                if (v.senderName) custName = v.senderName;
                                if (v.senderId) custId = v.senderId;
                            }
                        });
                        if (lastTs > 0) {
                            mergedMap[convId] = {
                                id: convId,
                                customerName: custName,
                                customerId: custId,
                                customerEmail: custEmail,
                                foodName: food,
                                lastMessage: lastMsg,
                                lastTimestamp: lastTs,
                                hotelId: currentHotelId
                            };
                            found++;
                        }
                    }
                }
            });
            if (found > 0) {
                refreshUI();
            }
        });
    }

    function renderConversations(list) {
        const el = document.getElementById('conversationList');
        if (!list.length) {
            el.innerHTML = `<div class="no-conversations"><i class="fas fa-search"></i>
                <p class="mb-0" style="color:var(--text-secondary);font-size:13px;">No results</p></div>`;
            return;
        }

        el.innerHTML = list.map(conv => {
            const time = conv.lastTimestamp ? formatTime(conv.lastTimestamp) : '';
            const active = conv.id === currentConversationId ? ' active' : '';
            const init = (conv.customerName || 'C')[0].toUpperCase();
            const food = conv.foodName ? `<div class="c-food"><i class="fas fa-utensils"></i>${esc(conv.foodName)}</div>` : '';
            return `<div class="conversation-item${active}"
                        data-conv-id="${esc(conv.id)}"
                        data-customer-name="${esc(conv.customerName || 'Customer')}"
                        data-customer-id="${esc(conv.customerId || '')}"
                        data-customer-email="${esc(conv.customerEmail || '')}"
                        data-food-name="${esc(conv.foodName || '')}">
                <div class="d-flex align-items-center gap-3">
                    <div class="c-avatar">${init}</div>
                    <div class="flex-grow-1" style="min-width:0;">
                        <div class="d-flex justify-content-between align-items-start">
                            <h6>${esc(conv.customerName || 'Customer')}</h6>
                            <span class="c-time">${time}</span>
                        </div>
                        <p class="c-preview">${esc(conv.lastMessage || 'No messages yet')}</p>
                        ${food}
                    </div>
                </div>
            </div>`;
        }).join('');

        el.querySelectorAll('.conversation-item').forEach(item => {
            item.addEventListener('click', () => {
                selectConversation(
                    item.dataset.convId || '',
                    item.dataset.customerName || 'Customer',
                    item.dataset.customerId || '',
                    item.dataset.customerEmail || '',
                    item.dataset.foodName || ''
                );
            });
        });
    }

    function filterConversations() {
        const q = (document.getElementById('convSearch').value || '').trim().toLowerCase();
        if (!q) { renderConversations(allConversations); return; }
        renderConversations(allConversations.filter(c =>
            (c.customerName||'').toLowerCase().includes(q) ||
            (c.foodName||'').toLowerCase().includes(q) ||
            (c.customerEmail||'').toLowerCase().includes(q)
        ));
    }

    /* ────────────────────────────────────────────────────────
       SELECT CONVERSATION — update CENTER + RIGHT panels
       ──────────────────────────────────────────────────────── */
    function selectConversation(conversationId, customerName, customerId, customerEmail, foodName) {
        currentConversationId = conversationId;
        currentConversationMeta = {
            customerId: customerId || '',
            customerName: customerName || 'Customer',
            customerEmail: customerEmail || '',
            foodName: foodName || ''
        };

        // Highlight
        document.querySelectorAll('.conversation-item').forEach(el =>
            el.classList.toggle('active', el.dataset.convId === conversationId));

        const init = (customerName || 'C')[0].toUpperCase();

        // ── CENTER: Live Chat Panel ──
        document.getElementById('panelChat').innerHTML = `
            <div class="chat-topbar">
                <div class="ct-avatar">${init}</div>
                <div>
                    <p class="ct-name">${esc(customerName)}</p>
                    <p class="ct-status"><span class="ct-live-dot"></span>Live Chat</p>
                </div>
            </div>
            <div class="messages-area" id="messagesContainer">
                <div style="text-align:center;padding:40px;color:var(--text-tertiary);font-size:13px;">
                    <i class="fas fa-spinner fa-spin" style="margin-right:6px;"></i>Loading messages...
                </div>
            </div>
            <div class="chat-compose">
                <input type="text" id="messageInput" placeholder="Type a message..."
                       onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}">
                <button class="btn-send" onclick="sendMessage()" title="Send"><i class="fas fa-paper-plane"></i></button>
            </div>`;

        // ── RIGHT: Customer Details Panel ──
        const emailRow = customerEmail
            ? `<div class="detail-row"><i class="fas fa-envelope"></i><div class="dr-text">${esc(customerEmail)}<small>Email address</small></div></div>`
            : '';
        const foodRow = foodName
            ? `<div class="detail-row"><i class="fas fa-utensils"></i><div class="dr-text">${esc(foodName)}<small>Related product</small></div></div>`
            : '';
        const idRow = customerId
            ? `<div class="detail-row"><i class="fas fa-fingerprint"></i><div class="dr-text" style="font-size:11px;font-family:monospace;opacity:0.7;">${esc(customerId.substring(0,20))}…<small>Customer ID</small></div></div>`
            : '';
        const convRow = `<div class="detail-row"><i class="fas fa-link"></i><div class="dr-text" style="font-size:11px;font-family:monospace;opacity:0.7;">${esc(conversationId.substring(0,24))}…<small>Conversation ID</small></div></div>`;

        document.getElementById('panelDetails').innerHTML = `
            <div class="detail-profile">
                <div class="dp-avatar">${init}</div>
                <h5>${esc(customerName)}</h5>
                <p class="dp-role">Customer</p>
            </div>
            <div class="detail-section">
                <p class="ds-label">Contact Info</p>
                ${emailRow || '<div class="detail-row"><i class="fas fa-envelope"></i><div class="dr-text" style="color:var(--text-tertiary);">No email provided</div></div>'}
            </div>
            ${foodName ? `<div class="detail-section">
                <p class="ds-label">Product Context</p>
                <div class="detail-tag"><i class="fas fa-utensils"></i>${esc(foodName)}</div>
            </div>` : ''}
            <div class="detail-section">
                <p class="ds-label">Conversation</p>
                ${idRow}
                ${convRow}
            </div>`;

        setTimeout(() => document.getElementById('messageInput')?.focus(), 100);
        loadMessages(conversationId);
    }

    /* ────────────────────────────────────────────────────────
       MESSAGES — real-time Firebase
       ──────────────────────────────────────────────────────── */
    function loadMessages(conversationId) {
        const container = document.getElementById('messagesContainer');
        if (!container) return;

        if (messagesListener && messagesListener.ref) {
            messagesListener.ref.off('child_added', messagesListener.callback);
        }
        if (messagesChangedListener && messagesChangedListener.ref) {
            messagesChangedListener.ref.off('child_changed', messagesChangedListener.callback);
        }

        messagesListener = null;
        messagesChangedListener = null;
        renderedMessageIds = new Set();
        container.innerHTML = '';

        const ref = database.ref('chats/' + conversationId + '/messages');
        const cbAdded = (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;
            const messageId = snapshot.key || '';
            const isSent = msg.senderId === auth.currentUser?.uid || msg.senderType === 'hotel';

            if (renderedMessageIds.has(messageId)) {
                updateExistingBubble(messageId, msg, isSent);
                return;
            }

            renderedMessageIds.add(messageId);
            appendMessageBubble(messageId, msg, isSent, false);
        };

        const cbChanged = (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;
            const messageId = snapshot.key || '';
            const isSent = msg.senderId === auth.currentUser?.uid || msg.senderType === 'hotel';
            updateExistingBubble(messageId, msg, isSent);
        };

        messagesListener = { ref, callback: cbAdded };
        messagesChangedListener = { ref, callback: cbChanged };
        ref.orderByChild('timestamp').on('child_added', cbAdded);
        ref.orderByChild('timestamp').on('child_changed', cbChanged);
    }

    function appendMessageBubble(messageId, msg, isSent, isPending) {
        const container = document.getElementById('messagesContainer');
        if (!container) return;

        const time = msg.timestamp ? formatTime(msg.timestamp) : (isPending ? 'Sending...' : '');
        const el = document.createElement('div');
        el.className = 'msg-bubble ' + (isSent ? 'sent' : 'received') + (isPending ? ' pending' : '');
        el.dataset.messageId = messageId;
        el.innerHTML = `${esc(msg.message || '')}<div class="m-time">${esc(time)}</div>`;
        container.appendChild(el);
        requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
    }

    function updateExistingBubble(messageId, msg, isSent) {
        const container = document.getElementById('messagesContainer');
        if (!container || !messageId) return;

        const existing = container.querySelector(`.msg-bubble[data-message-id="${cssEsc(messageId)}"]`);
        if (!existing) {
            renderedMessageIds.add(messageId);
            appendMessageBubble(messageId, msg, isSent, false);
            return;
        }

        existing.classList.remove('pending');
        existing.classList.toggle('sent', !!isSent);
        existing.classList.toggle('received', !isSent);
        const timeEl = existing.querySelector('.m-time');
        if (timeEl) {
            timeEl.textContent = msg.timestamp ? formatTime(msg.timestamp) : '';
        }
    }

    /* ────────────────────────────────────────────────────────
       SEND MESSAGE
       ──────────────────────────────────────────────────────── */
    function sendMessage() {
        const input = document.getElementById('messageInput');
        if (!input) return;
        const message = input.value.trim();
        if (!message || !currentConversationId) return;
        input.value = '';
        input.focus();

        const msgRef = database.ref('chats/' + currentConversationId + '/messages').push();
        const messageId = msgRef.key;
        const timestamp = Date.now();
        const customerId = currentConversationMeta?.customerId || '';
        const payload = {
            conversationId: currentConversationId,
            senderId: auth.currentUser.uid,
            senderName: currentHotelName || 'Hotel',
            senderType: 'hotel',
            receiverId: customerId,
            message,
            timestamp,
            read: false,
            hotelId: currentHotelId,
            hotelName: currentHotelName
        };

        if (messageId) {
            renderedMessageIds.add(messageId);
            appendMessageBubble(messageId, payload, true, true);
        }

        msgRef.set(payload).catch(() => {
            const container = document.getElementById('messagesContainer');
            if (container && messageId) {
                const bubble = container.querySelector(`.msg-bubble[data-message-id="${cssEsc(messageId)}"]`);
                if (bubble) {
                    const timeEl = bubble.querySelector('.m-time');
                    if (timeEl) timeEl.textContent = 'Failed to send';
                }
            }
        });

        const meta = {
            lastMessage: message,
            lastTimestamp: timestamp,
            lastSenderId: auth.currentUser.uid,
            customerId: customerId,
            customerName: currentConversationMeta?.customerName || 'Customer',
            customerEmail: currentConversationMeta?.customerEmail || '',
            foodName: currentConversationMeta?.foodName || ''
        };
        database.ref('conversations/' + currentHotelId + '/' + currentConversationId).update(meta);
        if (customerId) database.ref('conversations/' + customerId + '/' + currentConversationId).update(meta);
    }

    /* ────────────────────────────────────────────────────────
       UTILITIES
       ──────────────────────────────────────────────────────── */
    function formatTime(ts) {
        const d = new Date(ts), diff = Date.now() - ts;
        if (diff < 60000) return 'Just now';
        if (diff < 86400000) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (diff < 604800000) return d.toLocaleDateString([], { weekday: 'short' });
        return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    function esc(t) { const d = document.createElement('div'); d.textContent = t || ''; return d.innerHTML; }
    function cssEsc(value) {
        if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value || '');
        return String(value || '').replace(/["\\]/g, '\\$&');
    }
    const escapeHtml = esc;
</script>
