<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Customer Chats - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <style>
        .chat-container {
            display: flex;
            height: calc(100vh - 160px);
            min-height: 500px;
        }
        .conversation-list {
            width: 320px;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            background: var(--surface);
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg);
        }
        .conversation-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }
        .conversation-item:hover {
            background: var(--hover);
        }
        .conversation-item.active {
            background: var(--primary-light);
            border-left: 3px solid var(--primary);
        }
        .conversation-item h6 {
            margin: 0;
            font-weight: 600;
            color: var(--text);
        }
        .conversation-item p {
            margin: 4px 0 0;
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conversation-item .time {
            font-size: 11px;
            color: var(--text-muted);
        }
        .chat-header {
            padding: 16px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 18px;
        }
        .chat-header h5 {
            margin: 0;
            font-weight: 600;
        }
        .chat-header p {
            margin: 0;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
        }
        .message.sent {
            align-self: flex-end;
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.received {
            align-self: flex-start;
            background: var(--surface);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        .message .time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 6px;
            text-align: right;
        }
        .chat-input {
            padding: 16px 20px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        .chat-input input {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 10px 18px;
            font-size: 14px;
            outline: none;
        }
        .chat-input input:focus {
            border-color: var(--primary);
        }
        .chat-input button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            cursor: pointer;
            transition: transform 0.15s;
        }
        .chat-input button:hover {
            transform: scale(1.05);
        }
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .empty-chat i {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .no-conversations {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main>
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Customer Chats</h1>
                    <p class="panel-subtitle mb-0">Real-time messaging with your customers</p>
                </div>
            </div>

            <div class="chat-container card">
                <!-- Conversation List -->
                <div class="conversation-list" id="conversationList">
                    <div class="no-conversations">
                        <i class="fas fa-comments" style="font-size: 32px; opacity: 0.5;"></i>
                        <p class="mt-3 mb-0">No conversations yet</p>
                        <small>Customer messages will appear here</small>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="chat-area" id="chatArea">
                    <div class="empty-chat">
                        <i class="fas fa-comments"></i>
                        <h5>Select a conversation</h5>
                        <p>Choose a customer from the list to start chatting</p>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    let currentHotelId = null;
    let currentHotelName = null;
    let currentConversationId = null;
    let messagesListener = null;

    // Initialize on auth state change
    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        // Get hotel info
        currentHotelId = sessionStorage.getItem('hotelId') || user.uid;

        try {
            const hotelSnap = await database.ref('hotels/' + currentHotelId).once('value');
            if (hotelSnap.exists()) {
                currentHotelName = hotelSnap.val().name || 'Hotel';
            }
        } catch (e) {
            console.error('Failed to load hotel info:', e);
        }

        loadConversations();
    });

    function loadConversations() {
        const listEl = document.getElementById('conversationList');

        database.ref('conversations/' + currentHotelId).orderByChild('lastTimestamp').on('value', (snapshot) => {
            if (!snapshot.exists()) {
                listEl.innerHTML = `
                    <div class="no-conversations">
                        <i class="fas fa-comments" style="font-size: 32px; opacity: 0.5;"></i>
                        <p class="mt-3 mb-0">No conversations yet</p>
                        <small>Customer messages will appear here</small>
                    </div>`;
                return;
            }

            const conversations = [];
            snapshot.forEach((child) => {
                conversations.push({ id: child.key, ...child.val() });
            });

            // Sort by most recent first
            conversations.sort((a, b) => (b.lastTimestamp || 0) - (a.lastTimestamp || 0));

            listEl.innerHTML = conversations.map(conv => {
                const time = conv.lastTimestamp ? formatTime(conv.lastTimestamp) : '';
                const isActive = conv.id === currentConversationId ? 'active' : '';
                const initial = (conv.customerName || 'C')[0].toUpperCase();

                return `
                    <div class="conversation-item ${isActive}" onclick="selectConversation('${conv.id}', '${escapeHtml(conv.customerName || 'Customer')}', '${conv.customerId || ''}')">
                        <div class="d-flex align-items-center gap-3">
                            <div class="avatar" style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">
                                ${initial}
                            </div>
                            <div class="flex-grow-1" style="min-width: 0;">
                                <div class="d-flex justify-content-between">
                                    <h6>${escapeHtml(conv.customerName || 'Customer')}</h6>
                                    <span class="time">${time}</span>
                                </div>
                                <p>${escapeHtml(conv.lastMessage || 'No messages yet')}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        });
    }

    function selectConversation(conversationId, customerName, customerId) {
        currentConversationId = conversationId;

        // Update UI
        document.querySelectorAll('.conversation-item').forEach(el => el.classList.remove('active'));
        event.currentTarget?.classList.add('active');

        const initial = (customerName || 'C')[0].toUpperCase();

        document.getElementById('chatArea').innerHTML = `
            <div class="chat-header">
                <div class="avatar">${initial}</div>
                <div>
                    <h5>${escapeHtml(customerName)}</h5>
                    <p>Customer</p>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type a message..." onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        `;

        loadMessages(conversationId);
    }

    function loadMessages(conversationId) {
        const container = document.getElementById('messagesContainer');
        if (!container) return;

        // Remove old listener
        if (messagesListener) {
            database.ref('chats/' + messagesListener.path).off('child_added', messagesListener.callback);
        }

        // Clear container
        container.innerHTML = '';

        // Listen for messages
        const path = conversationId + '/messages';
        const callback = (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;

            const isSent = msg.senderId === auth.currentUser?.uid || msg.senderType === 'hotel';
            const time = msg.timestamp ? formatTime(msg.timestamp) : '';

            const msgEl = document.createElement('div');
            msgEl.className = 'message ' + (isSent ? 'sent' : 'received');
            msgEl.innerHTML = `
                ${escapeHtml(msg.message)}
                <div class="time">${time}</div>
            `;
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        };

        messagesListener = { path, callback };
        database.ref('chats/' + path).orderByChild('timestamp').on('child_added', callback);
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message || !currentConversationId) return;

        input.value = '';

        const messageId = database.ref().push().key;
        const timestamp = Date.now();

        // Parse customer ID from conversation ID (format: hotelId_customerId)
        const parts = currentConversationId.split('_');
        const customerId = parts.length > 1 ? parts[1] : '';

        const messageData = {
            conversationId: currentConversationId,
            senderId: auth.currentUser.uid,
            senderName: currentHotelName || 'Hotel',
            senderType: 'hotel',
            receiverId: customerId,
            message: message,
            timestamp: timestamp,
            read: false,
            hotelId: currentHotelId,
            hotelName: currentHotelName
        };

        // Save message
        database.ref('chats/' + currentConversationId + '/messages/' + messageId).set(messageData);

        // Update conversation meta
        database.ref('conversations/' + currentHotelId + '/' + currentConversationId).update({
            lastMessage: message,
            lastTimestamp: timestamp,
            lastSenderId: auth.currentUser.uid
        });

        // Also update under customer's conversations
        if (customerId) {
            database.ref('conversations/' + customerId + '/' + currentConversationId).update({
                lastMessage: message,
                lastTimestamp: timestamp,
                lastSenderId: auth.currentUser.uid
            });
        }
    }

    function formatTime(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;

        if (diff < 24 * 60 * 60 * 1000) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        } else if (diff < 7 * 24 * 60 * 60 * 1000) {
            return date.toLocaleDateString([], { weekday: 'short' });
        } else {
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
    }
</script>
</body>
</html>
