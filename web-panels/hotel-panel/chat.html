<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Customer Chats - REPLATE - REPLATE food rescue.">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex, nofollow">
    <title>Chat - REPLATE</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preload" href="../assets/fonts/poppins-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../assets/fonts/poppins-semibold.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="page-header">
                <div>
                    <h1 class="panel-title">Chat</h1>
                    <p class="panel-subtitle">Messages from customers about your dishes.</p>
                </div>
                <span class="live-indicator" id="chatStatus" role="status" hidden><span class="live-dot" aria-hidden="true"></span><span id="chatStatusText">Connected</span></span>
            </div>

            <!-- ═══ 3-PANEL CHAT ═══ -->
            <div class="chat-wrapper" id="chatWrapper">

                <!-- LEFT: Conversation List -->
                <div class="panel-conversations">
                    <div class="panel-head">
                        <h2>Conversations</h2>
                        <div class="conv-search-wrap">
                            <i class="fas fa-search" aria-hidden="true"></i>
                            <input type="text" id="convSearch" name="convSearch" placeholder="Search by name or dish…" oninput="filterConversations()" aria-label="Search conversations" autocomplete="off">
                        </div>
                    </div>
                    <div class="conv-items" id="conversationList">
                        <div class="skeleton-group sk-list p-3" aria-hidden="true"><div class="skeleton sk-row"></div><div class="skeleton sk-row"></div></div>
                    </div>
                </div>

                <!-- CENTER: Live Chat -->
                <div class="panel-chat" id="panelChat">
                    <div class="empty-panel">
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fas fa-comments" aria-hidden="true"></i></div>
                            <h3>Pick a conversation</h3>
                            <p>Choose a customer from the list to read and reply.</p>
                        </div>
                    </div>
                </div>

                <!-- RIGHT: Customer Details -->
                <div class="panel-details" id="panelDetails">
                    <div class="empty-panel">
                        <div class="empty-state">
                            <div class="empty-icon"><i class="fas fa-user" aria-hidden="true"></i></div>
                            <h3>Customer details</h3>
                            <p>Open a conversation to see who you are talking to.</p>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>
<script src="../js/hotel-shell-config.js"></script>

<script>

    // Hotel chat: list of customer conversations and the live messages.
    /* ────────────────────────────────────────────────────────
       STATE
       ──────────────────────────────────────────────────────── */
    let currentHotelId = null;
    let currentHotelName = null;
    let currentConversationId = null;
    let currentConversationMeta = null;
    let messagesListener = null;
    let messagesChangedListener = null;
    let allConversations = [];
    let renderedMessageIds = new Set();

    /* ────────────────────────────────────────────────────────
       AUTH + INIT
       ──────────────────────────────────────────────────────── */
    (async () => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">REPLATE',
            activeKey: 'chat',
            links: hotelShellLinks,
        });

        // Only a signed-in, approved hotel can use the chat. The hotel is always read from the
        // signed-in account (never from a value cached in the browser), so switching accounts is safe.
        const user = await ReplateUI.requireRole('hotel');
        if (!user) return;
        const hotelRecord = await ReplateUI.requireApprovedHotel(user);
        if (!hotelRecord) return;

        currentHotelId = hotelRecord.key;
        currentHotelName = hotelRecord.value.hotelName || hotelRecord.value.name || 'Hotel';

        document.getElementById('chatStatus').hidden = false;
        updateConnectionStatus();
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
        loadConversations();
    })();

    // A quiet Connected / Offline marker next to the page title.
    function updateConnectionStatus() {
        const marker = document.getElementById('chatStatus');
        if (!marker) return;
        const online = navigator.onLine;
        marker.classList.toggle('is-offline', !online);
        document.getElementById('chatStatusText').textContent = online ? 'Connected' : 'Offline: new messages wait until you are back online';
    }

    /* ────────────────────────────────────────────────────────
       CONVERSATION LIST
       Checks both hotelId and user.uid paths to catch all
       conversations regardless of how they were written.
       ──────────────────────────────────────────────────────── */
    let convListeners = [];

    function loadConversations() {
        const listEl = document.getElementById('conversationList');
        const uid = auth.currentUser?.uid;

        // Build list of unique paths to check
        const paths = new Set();
        if (currentHotelId) paths.add(currentHotelId);
        if (uid && uid !== currentHotelId) paths.add(uid);


        // Detach any previous listeners
        convListeners.forEach(l => l.ref.off('value', l.cb));
        convListeners = [];

        // Merge map keyed by conversationId to deduplicate
        const mergedMap = {};

        function refreshUI() {
            allConversations = Object.values(mergedMap);
            allConversations.sort((a, b) => (b.lastTimestamp || 0) - (a.lastTimestamp || 0));

            if (!allConversations.length) {
                listEl.innerHTML = ReplateUI.emptyState('No conversations yet', 'When a customer messages your hotel from the app, the chat appears here.', 'fa-comments');
                return;
            }
            renderConversations(allConversations);
        }

        paths.forEach(path => {
            const ref = database.ref('conversations/' + path);
            const cb = (snapshot) => {
                if (snapshot.exists()) {
                    snapshot.forEach(c => {
                        mergedMap[c.key] = { id: c.key, ...c.val() };
                    });
                    // Conversations loaded from Firebase
                } else {
                    // No conversations under this path
                }
                refreshUI();
            };
            convListeners.push({ ref, cb });
            ref.orderByChild('lastTimestamp').on('value', cb);
        });

        // Conversations are listed from conversations/{hotelKey} only. The app writes that summary
        // row for every chat, and the database rules keep each chat private to its two participants,
        // so there is no fallback that scans every chat in the database.
    }

    function renderConversations(list) {
        const el = document.getElementById('conversationList');
        if (!list.length) {
            el.innerHTML = ReplateUI.emptyState('No matching conversations', 'Try a customer name, email or dish.', 'fa-magnifying-glass');
            return;
        }

        el.innerHTML = list.map(conv => {
            const time = conv.lastTimestamp ? formatTime(conv.lastTimestamp) : '';
            const active = conv.id === currentConversationId ? ' active' : '';
            const init = (conv.customerName || 'C')[0].toUpperCase();
            const food = conv.foodName ? `<div class="c-food"><i class="fas fa-utensils" aria-hidden="true"></i>${esc(conv.foodName)}</div>` : '';
            return `<div class="conversation-item${active}" role="button" tabindex="0"
                        data-conv-id="${esc(conv.id)}"
                        data-customer-name="${esc(conv.customerName || 'Customer')}"
                        data-customer-id="${esc(conv.customerId || '')}"
                        data-customer-email="${esc(conv.customerEmail || '')}"
                        data-food-name="${esc(conv.foodName || '')}">
                <div class="c-avatar" aria-hidden="true">${init}</div>
                <div class="c-body">
                    <div class="c-top">
                        <p class="c-name">${esc(conv.customerName || 'Customer')}</p>
                        <span class="c-time">${time}</span>
                    </div>
                    <p class="c-preview">${esc(conv.lastMessage || 'No messages yet')}</p>
                    ${food}
                </div>
            </div>`;
        }).join('');

        el.querySelectorAll('.conversation-item').forEach(item => {
            item.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); item.click(); }
            });
            item.addEventListener('click', () => {
                selectConversation(
                    item.dataset.convId || '',
                    item.dataset.customerName || 'Customer',
                    item.dataset.customerId || '',
                    item.dataset.customerEmail || '',
                    item.dataset.foodName || ''
                );
            });
        });
    }

    // Shows only conversations that match the search text.
    function filterConversations() {
        const q = (document.getElementById('convSearch').value || '').trim().toLowerCase();
        if (!q) { renderConversations(allConversations); return; }
        renderConversations(allConversations.filter(c =>
            (c.customerName||'').toLowerCase().includes(q) ||
            (c.foodName||'').toLowerCase().includes(q) ||
            (c.customerEmail||'').toLowerCase().includes(q)
        ));
    }

    /* ────────────────────────────────────────────────────────
       SELECT CONVERSATION — update CENTER + RIGHT panels
       ──────────────────────────────────────────────────────── */
    function selectConversation(conversationId, customerName, customerId, customerEmail, foodName) {
        currentConversationId = conversationId;
        currentConversationMeta = {
            customerId: customerId || '',
            customerName: customerName || 'Customer',
            customerEmail: customerEmail || '',
            foodName: foodName || ''
        };

        // Highlight
        document.querySelectorAll('.conversation-item').forEach(el =>
            el.classList.toggle('active', el.dataset.convId === conversationId));

        const init = (customerName || 'C')[0].toUpperCase();

        // ── CENTER: Live Chat Panel ──
        document.getElementById('panelChat').innerHTML = `
            <div class="chat-topbar">
                <button type="button" class="chat-back" aria-label="Back to conversations"><i class="fas fa-arrow-left" aria-hidden="true"></i></button>
                <div class="ct-avatar" aria-hidden="true">${init}</div>
                <div>
                    <p class="ct-name">${esc(customerName)}</p>
                    <p class="ct-status">${foodName ? 'About ' + esc(foodName) : 'Customer'}</p>
                </div>
            </div>
            <div class="messages-area" id="messagesContainer">
                <div class="messages-loading">
                    <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Loading messages…
                </div>
            </div>
            <div class="chat-compose">
                <label for="messageInput" class="visually-hidden">Message to ${esc(customerName)}</label>
                <input type="text" id="messageInput" name="messageInput" autocomplete="off" placeholder="Type a message…"
                       onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}">
                <button type="button" class="btn-send" onclick="sendMessage()" aria-label="Send message"><i class="fas fa-paper-plane" aria-hidden="true"></i></button>
            </div>`;

        // ── RIGHT: Customer Details Panel ──
        const emailRow = customerEmail
            ? `<div class="detail-row"><i class="fas fa-envelope" aria-hidden="true"></i><span>${esc(customerEmail)}</span></div>`
            : '<div class="detail-row text-muted"><i class="fas fa-envelope" aria-hidden="true"></i><span>No email on this account</span></div>';

        document.getElementById('panelDetails').innerHTML = `
            <div class="detail-profile">
                <div class="dp-avatar" aria-hidden="true">${init}</div>
                <h2>${esc(customerName)}</h2>
                <p>Customer</p>
            </div>
            <div class="detail-section">
                <p class="ds-label">Contact</p>
                ${emailRow}
            </div>
            ${foodName ? `<div class="detail-section">
                <p class="ds-label">Asked about</p>
                <div class="detail-tag"><i class="fas fa-utensils" aria-hidden="true"></i>${esc(foodName)}</div>
            </div>` : ''}`;

        document.getElementById('chatWrapper').classList.add('thread-open');
        setTimeout(() => document.getElementById('messageInput')?.focus(), 100);
        loadMessages(conversationId);
    }

    // Phones show one pane at a time: the back arrow returns to the conversation list
    document.getElementById('chatWrapper').addEventListener('click', (e) => {
        if (!e.target.closest('.chat-back')) return;
        document.getElementById('chatWrapper').classList.remove('thread-open');
        const active = document.querySelector('.conversation-item.active');
        if (active) active.focus();
    });

    /* ────────────────────────────────────────────────────────
       MESSAGES — real-time Firebase
       ──────────────────────────────────────────────────────── */
    function loadMessages(conversationId) {
        const container = document.getElementById('messagesContainer');
        if (!container) return;

        if (messagesListener && messagesListener.ref) {
            messagesListener.ref.off('child_added', messagesListener.callback);
        }
        if (messagesChangedListener && messagesChangedListener.ref) {
            messagesChangedListener.ref.off('child_changed', messagesChangedListener.callback);
        }

        messagesListener = null;
        messagesChangedListener = null;
        renderedMessageIds = new Set();
        container.innerHTML = '';

        const ref = database.ref('chats/' + conversationId + '/messages');
        const cbAdded = (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;
            const messageId = snapshot.key || '';
            const isSent = msg.senderId === auth.currentUser?.uid || msg.senderType === 'hotel';

            if (renderedMessageIds.has(messageId)) {
                updateExistingBubble(messageId, msg, isSent);
                return;
            }

            renderedMessageIds.add(messageId);
            appendMessageBubble(messageId, msg, isSent, false);
        };

        const cbChanged = (snapshot) => {
            const msg = snapshot.val();
            if (!msg) return;
            const messageId = snapshot.key || '';
            const isSent = msg.senderId === auth.currentUser?.uid || msg.senderType === 'hotel';
            updateExistingBubble(messageId, msg, isSent);
        };

        messagesListener = { ref, callback: cbAdded };
        messagesChangedListener = { ref, callback: cbChanged };
        ref.orderByChild('timestamp').on('child_added', cbAdded);
        ref.orderByChild('timestamp').on('child_changed', cbChanged);
    }

    // Adds one message bubble to the chat and scrolls down.
    function appendMessageBubble(messageId, msg, isSent, isPending) {
        const container = document.getElementById('messagesContainer');
        if (!container) return;

        const time = msg.timestamp ? formatTime(msg.timestamp) : (isPending ? 'Sending…' : '');
        const el = document.createElement('div');
        el.className = 'msg-bubble ' + (isSent ? 'sent' : 'received') + (isPending ? ' pending' : '');
        el.dataset.messageId = messageId;
        el.innerHTML = `${esc(msg.message || '')}<div class="m-time">${esc(time)}</div>`;
        container.appendChild(el);
        requestAnimationFrame(() => { container.scrollTop = container.scrollHeight; });
    }

    // Updates a bubble that is already shown (for example after it is sent).
    function updateExistingBubble(messageId, msg, isSent) {
        const container = document.getElementById('messagesContainer');
        if (!container || !messageId) return;

        const existing = container.querySelector(`.msg-bubble[data-message-id="${cssEsc(messageId)}"]`);
        if (!existing) {
            renderedMessageIds.add(messageId);
            appendMessageBubble(messageId, msg, isSent, false);
            return;
        }

        existing.classList.remove('pending');
        existing.classList.toggle('sent', !!isSent);
        existing.classList.toggle('received', !isSent);
        const timeEl = existing.querySelector('.m-time');
        if (timeEl) {
            timeEl.textContent = msg.timestamp ? formatTime(msg.timestamp) : '';
        }
    }

    /* ────────────────────────────────────────────────────────
       SEND MESSAGE
       ──────────────────────────────────────────────────────── */
    function sendMessage() {
        const input = document.getElementById('messageInput');
        if (!input) return;
        const message = input.value.trim();
        if (!message || !currentConversationId) return;
        input.value = '';
        input.focus();

        const msgRef = database.ref('chats/' + currentConversationId + '/messages').push();
        const messageId = msgRef.key;
        const timestamp = Date.now();
        const customerId = currentConversationMeta?.customerId || '';
        const payload = {
            conversationId: currentConversationId,
            senderId: auth.currentUser.uid,
            senderName: currentHotelName || 'Hotel',
            senderType: 'hotel',
            receiverId: customerId,
            message,
            timestamp,
            read: false,
            hotelId: currentHotelId,
            hotelName: currentHotelName
        };

        if (messageId) {
            renderedMessageIds.add(messageId);
            appendMessageBubble(messageId, payload, true, true);
        }

        msgRef.set(payload).catch(() => {
            const container = document.getElementById('messagesContainer');
            if (container && messageId) {
                const bubble = container.querySelector(`.msg-bubble[data-message-id="${cssEsc(messageId)}"]`);
                if (bubble) {
                    const timeEl = bubble.querySelector('.m-time');
                    if (timeEl) timeEl.textContent = 'Failed to send';
                }
            }
        });

        const meta = {
            lastMessage: message,
            lastTimestamp: timestamp,
            lastSenderId: auth.currentUser.uid,
            customerId: customerId,
            customerName: currentConversationMeta?.customerName || 'Customer',
            customerEmail: currentConversationMeta?.customerEmail || '',
            foodName: currentConversationMeta?.foodName || ''
        };
        database.ref('conversations/' + currentHotelId + '/' + currentConversationId).update(meta);
        if (customerId) database.ref('conversations/' + customerId + '/' + currentConversationId).update(meta);
    }

    /* ────────────────────────────────────────────────────────
       UTILITIES
       ──────────────────────────────────────────────────────── */
    function formatTime(ts) {
        const d = new Date(ts), diff = Date.now() - ts;
        if (diff < 60000) return 'Just now';
        if (diff < 86400000) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        if (diff < 604800000) return d.toLocaleDateString([], { weekday: 'short' });
        return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
    }

    // Escapes quotes as well as angle brackets, so it is safe inside attributes too
    function esc(t) { return ReplateUI.esc(t); }
    // Makes a value safe to use inside a CSS selector.
    function cssEsc(value) {
        if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value || '');
        return String(value || '').replace(/["\\]/g, '\\$&');
    }
    const escapeHtml = esc;
</script>
</body>
</html>
