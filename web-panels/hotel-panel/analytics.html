<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Analytics - REPLATE Hotel - REPLATE food rescue.">
    <meta name="theme-color" content="#f3f4f6">
    <meta name="robots" content="noindex, nofollow">
    <title>Analytics - REPLATE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="page-header">
                <div>
                    <h1 class="panel-title">Analytics</h1>
                    <p class="panel-subtitle">Revenue and orders for your hotel.</p>
                </div>
                <span id="periodLabel" class="live-indicator"><span class="live-dot" aria-hidden="true"></span>Live</span>
            </div>

            <!-- Stat Cards -->
            <div class="stat-grid">
                <div class="card stat-card">
                    <p class="stat-value num" id="statRevenue">LKR 0.00</p>
                    <p class="stat-label"><i class="fas fa-coins" aria-hidden="true"></i>Completed revenue</p>
                    <p class="stat-meta"><span class="delta flat" id="deltaRevenue"></span></p>
                </div>
                <div class="card stat-card">
                    <p class="stat-value num" id="statOrders">0</p>
                    <p class="stat-label"><i class="fas fa-receipt" aria-hidden="true"></i>Orders</p>
                    <p class="stat-meta"><span class="delta flat" id="deltaOrders"></span></p>
                </div>
                <div class="card stat-card">
                    <p class="stat-value num" id="statCompletionRate">0%</p>
                    <p class="stat-label"><i class="fas fa-circle-check" aria-hidden="true"></i>Completion rate</p>
                    <p class="stat-meta"></p>
                </div>
                <div class="card stat-card">
                    <p class="stat-value num" id="statListings">0</p>
                    <p class="stat-label"><i class="fas fa-utensils" aria-hidden="true"></i>Active listings</p>
                    <p class="stat-meta"></p>
                </div>
            </div>

            <!-- Charts Row 1 -->
            <div class="row">
                <div class="col-lg-8">
                    <div class="card card-body chart-card">
                        <h2 class="section-title"><i class="fas fa-chart-area" aria-hidden="true"></i>Revenue, last 7 days</h2>
                        <div class="chart-wrap"><canvas id="revenueChart" role="img" aria-label="Bar chart: revenue"></canvas></div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card card-body chart-card">
                        <h2 class="section-title"><i class="fas fa-chart-pie" aria-hidden="true"></i>Order status</h2>
                        <div class="chart-wrap"><canvas id="statusChart" role="img" aria-label="Doughnut chart: orders by status"></canvas></div>
                    </div>
                </div>
            </div>

            <!-- Charts Row 2 -->
            <div class="row">
                <div class="col-lg-6">
                    <div class="card card-body chart-card">
                        <h2 class="section-title"><i class="fas fa-chart-line" aria-hidden="true"></i>Orders per day, last 14 days</h2>
                        <div class="chart-wrap"><canvas id="ordersLineChart" role="img" aria-label="Line chart: orders per day for the last 14 days"></canvas></div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card card-body chart-card">
                        <h2 class="section-title"><i class="fas fa-tags" aria-hidden="true"></i>Best-selling dishes</h2>
                        <div class="chart-wrap"><canvas id="topItemsChart" role="img" aria-label="Bar chart: best-selling dishes"></canvas></div>
                    </div>
                </div>
            </div>

        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>
<script src="../js/hotel-shell-config.js"></script>

<script>

    // Hotel analytics: revenue, orders and top dishes for this hotel only.
    let resolvedHotelIds = new Set();
    let revenueChartInstance = null;
    let statusChartInstance = null;
    let ordersLineInstance = null;
    let topItemsInstance = null;

    // Waits for a hotel sign-in and an approved hotel, then loads the numbers.
    (async () => {
        const user = await ReplateUI.requireRole('hotel');
        if (!user) return;

        // Only an approved hotel sees its analytics; its ids are the owner uid and the hotel key
        const hotelRecord = await ReplateUI.requireApprovedHotel(user);
        if (!hotelRecord) return;
        resolvedHotelIds.add(user.uid);
        resolvedHotelIds.add(hotelRecord.key);
        if (hotelRecord.value.userId) resolvedHotelIds.add(hotelRecord.value.userId);

        loadAnalytics(user.uid);
        loadActiveListings(user.uid);
    })();

    // ── Helpers ─────────────────────────────────────────────
    function getDayKey(ts) {
        const d = new Date(ts);
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    // Makes a short label like Oct 5 from a day text.
    function getDayLabel(key) {
        const parts = key.split('-');
        const d = new Date(parts[0], parts[1]-1, parts[2]);
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    }

    // True when the order belongs to this hotel.
    function isMyOrder(order) {
        const hid = order.hotelId || order.hotelKey || '';
        return resolvedHotelIds.has(hid);
    }

    // Shows the percent change versus the last period with an arrow.
    function setDelta(elId, current, previous) {
        const el = document.getElementById(elId);
        if (!el) return;
        if (previous === 0 && current === 0) { el.textContent = ''; el.className = 'delta flat'; return; }
        if (previous === 0) { el.innerHTML = '<i class="fas fa-arrow-up" aria-hidden="true"></i> New'; el.className = 'delta up'; return; }
        const pct = Math.round(((current - previous) / previous) * 100);
        if (pct > 0) { el.innerHTML = `<i class="fas fa-arrow-up" aria-hidden="true"></i> ${pct}%`; el.className = 'delta up'; }
        else if (pct < 0) { el.innerHTML = `<i class="fas fa-arrow-down" aria-hidden="true"></i> ${Math.abs(pct)}%`; el.className = 'delta down'; }
        else { el.innerHTML = '— flat'; el.className = 'delta flat'; }
    }

    // ── Active listings count ───────────────────────────────
    function loadActiveListings(uid) {
        ReplateSchema.hotelFoodItems(database, resolvedHotelIds).on((snap) => {
            let count = 0;
            snap.forEach(child => {
                if (ReplateSchema.listingState(child.val()).key === 'active') count++;
            });
            document.getElementById('statListings').textContent = count;
        }, (error) => console.error('Could not load listings', error));
    }

    // ── Main analytics loader (real-time) ───────────────────
    function loadAnalytics(uid) {
        ReplateSchema.hotelOrders(database, resolvedHotelIds).on((snap) => {
            const now = Date.now();
            const DAY = 86400000;
            const sevenDaysAgo = now - 7 * DAY;
            const fourteenDaysAgo = now - 14 * DAY;
            const prevWeekStart = now - 14 * DAY;
            const prevWeekEnd = now - 7 * DAY;

            let totalRevenue = 0, totalOrders = 0;
            let completed = 0, pending = 0, cancelled = 0;
            let thisWeekRevenue = 0, lastWeekRevenue = 0;
            let thisWeekOrders = 0, lastWeekOrders = 0;
            const dailyRevenue = {};
            const dailyOrders = {};
            const itemSales = {};

            // Initialize last 7 days
            for (let i = 6; i >= 0; i--) {
                const key = getDayKey(now - i * DAY);
                dailyRevenue[key] = 0;
                dailyOrders[key] = 0;
            }
            // Initialize previous 7 days for orders line chart (14 days total)
            for (let i = 13; i >= 0; i--) {
                const key = getDayKey(now - i * DAY);
                if (!dailyOrders[key]) dailyOrders[key] = 0;
            }

            snap.forEach(child => {
                const order = child.val() || {};
                if (!isMyOrder(order)) return;

                totalOrders++;
                const ts = order.createdAt || order.timestamp || now;
                const amount = ReplateSchema.orderAmount(order);
                const dayKey = getDayKey(ReplateSchema.isSuccessfulOrder(order) ? (ReplateSchema.earnedAt(order) || ts) : ts);

                // Revenue counts only orders that were really handed over (completed or delivered)
                if (ReplateSchema.isSuccessfulOrder(order)) {
                    completed++;
                    totalRevenue += amount;
                    if (ts >= sevenDaysAgo) { thisWeekRevenue += amount; }
                    else if (ts >= prevWeekStart && ts < prevWeekEnd) { lastWeekRevenue += amount; }
                    if (dailyRevenue.hasOwnProperty(dayKey)) dailyRevenue[dayKey] += amount;
                } else if (ReplateSchema.isCancelledOrder(order)) {
                    cancelled++;
                } else {
                    pending++;
                }

                if (ts >= sevenDaysAgo) thisWeekOrders++;
                else if (ts >= prevWeekStart && ts < prevWeekEnd) lastWeekOrders++;

                if (dailyOrders.hasOwnProperty(dayKey)) dailyOrders[dayKey]++;

                // Top selling items (cancelled orders do not count as sales)
                if (!ReplateSchema.isCancelledOrder(order)) {
                    ReplateSchema.extractItemsArray(order).forEach(item => {
                        const name = item.foodName || 'Item';
                        itemSales[name] = (itemSales[name] || 0) + ReplateSchema.itemQuantity(item);
                    });
                }
            });

            // ── Update stat cards ──
            document.getElementById('statRevenue').innerHTML = ReplateUI.moneyHtml(totalRevenue);
            document.getElementById('statOrders').textContent = totalOrders;
            const completionRate = totalOrders > 0 ? Math.round((completed / totalOrders) * 100) : 0;
            document.getElementById('statCompletionRate').textContent = completionRate + '%';
            setDelta('deltaRevenue', thisWeekRevenue, lastWeekRevenue);
            setDelta('deltaOrders', thisWeekOrders, lastWeekOrders);

            // ── Revenue bar chart (last 7 days, by the day each order was completed) ──
            const C = ReplateUI.chartColors;
            const revKeys = Object.keys(dailyRevenue).sort().slice(-7);
            const revLabels = revKeys.map(getDayLabel);
            const revData = revKeys.map(k => dailyRevenue[k]);
            const revTotal = revData.reduce((a, b) => a + b, 0);

            if (revenueChartInstance) revenueChartInstance.destroy();
            revenueChartInstance = new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: {
                    labels: revLabels,
                    datasets: [{ label: 'Revenue', data: revData, backgroundColor: C.brand, borderRadius: 6, maxBarThickness: 40 }]
                },
                options: {
                    maintainAspectRatio: false,
                    responsive: true,
                    plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ReplateSchema.formatMoney(ctx.parsed.y) } } },
                    scales: { y: { beginAtZero: true, ticks: { callback: ReplateUI.axisMoney }, grid: { color: C.grid } }, x: { grid: { display: false } } }
                }
            });
            ReplateUI.chartEmpty('revenueChart', revTotal === 0, 'No revenue in the last 7 days', 'Completed orders add to this chart.');
            ReplateUI.describeChart('revenueChart', 'Bar chart: revenue per day for the last 7 days, ' + ReplateSchema.formatMoney(revTotal) + ' in total.');

            // ── Order status doughnut ──
            if (statusChartInstance) statusChartInstance.destroy();
            const hasStatusData = completed + pending + cancelled > 0;
            statusChartInstance = new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Completed', 'Pending', 'Cancelled'],
                    datasets: [{
                        data: hasStatusData ? [completed, pending, cancelled] : [1],
                        backgroundColor: hasStatusData ? [C.success, C.warning, C.danger] : [C.empty],
                        borderWidth: 0,
                        hoverOffset: 6,
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    responsive: true,
                    cutout: '65%',
                    plugins: { legend: { position: 'bottom' }, tooltip: { enabled: hasStatusData } }
                }
            });
            ReplateUI.chartEmpty('statusChart', !hasStatusData, 'No orders yet', 'Order statuses show here once customers order.');
            ReplateUI.describeChart('statusChart', `Doughnut chart: ${completed} completed, ${pending} pending, ${cancelled} cancelled orders.`);

            // ── Orders per day line chart (last 14 days) ──
            const ordKeys = Object.keys(dailyOrders).sort().slice(-14);
            const ordLabels = ordKeys.map(getDayLabel);
            const ordData = ordKeys.map(k => dailyOrders[k]);
            const ordTotal = ordData.reduce((a, b) => a + b, 0);

            if (ordersLineInstance) ordersLineInstance.destroy();
            ordersLineInstance = new Chart(document.getElementById('ordersLineChart'), {
                type: 'line',
                data: {
                    labels: ordLabels,
                    datasets: [{
                        label: 'Orders',
                        data: ordData,
                        borderColor: C.brand,
                        backgroundColor: C.brandSoft,
                        fill: true,
                        tension: 0,
                        pointBackgroundColor: C.brand,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 3,
                        pointHoverRadius: 5,
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 }, grid: { color: C.grid } }, x: { grid: { display: false }, ticks: { maxRotation: 0, autoSkipPadding: 12 } } }
                }
            });
            ReplateUI.chartEmpty('ordersLineChart', ordTotal === 0, 'No orders in the last 14 days', 'Each day\'s orders show here.');
            ReplateUI.describeChart('ordersLineChart', 'Line chart: orders per day for the last 14 days, ' + ReplateSchema.plural(ordTotal, 'order') + ' in total.');

            // ── Top selling items: one colour, longest bar first ──
            const sortedItems = Object.entries(itemSales).sort((a, b) => b[1] - a[1]).slice(0, 6);
            if (topItemsInstance) topItemsInstance.destroy();
            topItemsInstance = new Chart(document.getElementById('topItemsChart'), {
                type: 'bar',
                data: {
                    labels: sortedItems.map(i => i[0]),
                    datasets: [{ label: 'Sold', data: sortedItems.map(i => i[1]), backgroundColor: C.brand, borderRadius: 6, maxBarThickness: 32 }]
                },
                options: {
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: { x: { beginAtZero: true, ticks: { stepSize: 1, precision: 0 }, grid: { color: C.grid } }, y: { grid: { display: false } } }
                }
            });
            ReplateUI.chartEmpty('topItemsChart', sortedItems.length === 0, 'No dishes sold yet', 'Your best sellers are ranked here.');
            ReplateUI.describeChart('topItemsChart', sortedItems.length
                ? 'Bar chart: best-selling dishes. ' + sortedItems.map(([name, n]) => name + ' ' + n).join(', ') + '.'
                : 'Bar chart: best-selling dishes. No sales yet.');

        });
    }
</script>
</body>
</html>
