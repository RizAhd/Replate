<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - REPLATE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
            <div class="position-sticky">
                <a class="navbar-brand d-block px-3 py-3 mb-3 text-center" href="#">
                    <i class="fas fa-utensils me-2"></i>REPLATE
                </a>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="add-food.html"><i class="fas fa-plus-circle"></i> Add Food</a></li>
                    <li class="nav-item"><a class="nav-link" href="manage-listings.html"><i class="fas fa-list"></i> My Listings</a></li>
                    <li class="nav-item"><a class="nav-link" href="orders.html"><i class="fas fa-receipt"></i> Orders</a></li>
                    <li class="nav-item"><a class="nav-link active" href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a></li>
                    <li class="nav-item"><a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4">Analytics</h2>

            <div class="row">
                <div class="col-md-8">
                    <div class="card p-3 mb-4">
                        <h5>Revenue (Last 7 Days)</h5>
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card p-3 mb-4">
                        <h5>Order Status</h5>
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
    auth.onAuthStateChanged((user) => {
        if (user) loadCharts(user.uid);
    });

    function loadCharts(uid) {
        database.ref('orders').orderByChild('hotelId').equalTo(uid).once('value', (snapshot) => {
            let completed = 0, pending = 0, cancelled = 0;

            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    const status = child.val().orderStatus;
                    if (status === 'completed') completed++;
                    else if (status === 'pending') pending++;
                    else cancelled++;
                });
            }

            // Status Chart
            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Completed', 'Pending', 'Cancelled'],
                    datasets: [{
                        data: [completed, pending, cancelled],
                        backgroundColor: ['#2E7D32', '#FFC107', '#C62828']
                    }]
                }
            });

            // Fake Revenue Data for Demo (Real implementation would aggregate by date)
            new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Revenue (LKR)',
                        data: [5000, 7500, 3000, 8200, 12000, 15000, 9500],
                        backgroundColor: '#386A20'
                    }]
                }
            });
        });
    }
</script>
</body>
</html>
