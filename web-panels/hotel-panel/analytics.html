<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - REPLATE</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main>
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Analytics</h1>
                    <p class="panel-subtitle mb-0">Revenue and order insights for your hotel.</p>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="card p-4 mb-4">
                        <h5 class="mb-3">Revenue (Last 7 Days)</h5>
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="card p-4 mb-4">
                        <h5 class="mb-3">Order Status</h5>
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    const hotelShellLinks = [
        { key: 'dashboard',  href: 'dashboard.html',       icon: 'fas fa-home',         label: 'Dashboard' },
        { key: 'add-food',   href: 'add-food.html',         icon: 'fas fa-plus-circle',  label: 'Add Food' },
        { key: 'listings',   href: 'manage-listings.html',  icon: 'fas fa-list',         label: 'My Listings' },
        { key: 'orders',     href: 'orders.html',           icon: 'fas fa-receipt',      label: 'Orders' },
        { key: 'analytics',  href: 'analytics.html',        icon: 'fas fa-chart-line',   label: 'Analytics' },
        { key: 'settings',   href: 'settings.html',         icon: 'fas fa-cog',          label: 'Settings' },
        { key: 'logout',     href: '#',                     icon: 'fas fa-sign-out-alt', label: 'Logout', logout: true }
    ];

    auth.onAuthStateChanged((user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">REPLATE',
            activeKey: 'analytics',
            links: hotelShellLinks,
        });
        if (user) loadCharts(user.uid);
    });

    function loadCharts(uid) {
        database.ref('orders').orderByChild('hotelId').equalTo(uid).once('value', (snapshot) => {
            let completed = 0, pending = 0, cancelled = 0;

            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    const status = child.val().orderStatus;
                    if (status === 'completed') completed++;
                    else if (status === 'pending') pending++;
                    else cancelled++;
                });
            }

            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Completed', 'Pending', 'Cancelled'],
                    datasets: [{
                        data: [completed, pending, cancelled],
                        backgroundColor: ['#059669', '#d97706', '#dc2626']
                    }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                    datasets: [{
                        label: 'Revenue (LKR)',
                        data: [5000, 7500, 3000, 8200, 12000, 15000, 9500],
                        backgroundColor: 'rgba(26, 107, 60, 0.6)',
                        borderColor: '#1a6b3c',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
            });
        });
    }
</script>
</body>
</html>
