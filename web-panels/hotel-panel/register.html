<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Register your hotel or restaurant on REPLATE food rescue.">
    <meta name="theme-color" content="#f3f4f6">
    <meta name="robots" content="noindex, nofollow">
    <meta name="author" content="Riflan Mohamed">
    <title>Register your hotel - REPLATE</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preload" href="../assets/fonts/poppins-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../assets/fonts/poppins-semibold.woff2" as="font" type="font/woff2" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body class="auth-page">
<a class="skip-link" href="#mainContent">Skip to content</a>

<main class="auth-card auth-card-wide" id="mainContent">
    <div class="auth-brand text-center mb-4">
        <img src="../assets/replate-icon.svg" alt="" width="64" height="64" class="brand-logo-auth">
        <div class="auth-wordmark">REPLATE</div>
        <h1 class="auth-title mb-1">Register your hotel</h1>
        <p class="auth-subtext mb-0">Join REPLATE and start rescuing surplus food. An admin reviews every registration.</p>
    </div>

    <form id="registerForm" novalidate>
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="hotelName">Hotel or restaurant name</label>
                <input type="text" class="form-control" id="hotelName" name="hotelName" maxlength="80" autocomplete="organization" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="ownerName">Owner name</label>
                <input type="text" class="form-control" id="ownerName" name="ownerName" maxlength="80" autocomplete="name" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="email">Email</label>
                <input type="email" class="form-control" id="email" spellcheck="false" name="email" autocomplete="email" inputmode="email" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="phone">Phone</label>
                <input type="tel" class="form-control" id="phone" name="phone" autocomplete="tel" inputmode="tel" placeholder="e.g. 0771234567…" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="password">Password</label>
                <div class="input-with-icon">
                    <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" minlength="8" aria-describedby="passwordHelp" required>
                    <button type="button" class="password-toggle" id="toggleRegPassword" aria-label="Show password">
                        <i class="fas fa-eye" id="toggleRegPasswordIcon" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="form-text" id="passwordHelp">At least 8 characters.</div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="confirmPassword">Confirm password</label>
                <div class="input-with-icon">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                    <button type="button" class="password-toggle" id="toggleRegConfirmPassword" aria-label="Show password">
                        <i class="fas fa-eye" id="toggleRegConfirmPasswordIcon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="address">Address</label>
            <input type="text" class="form-control" id="address" name="address" autocomplete="street-address" required>
        </div>

        <div class="row align-items-end">
            <div class="col-md-4 mb-3">
                <label class="form-label" for="latitude">Latitude</label>
                <input type="number" step="any" class="form-control" id="latitude" name="latitude" inputmode="decimal" required placeholder="e.g. 6.9271…">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label" for="longitude">Longitude</label>
                <input type="number" step="any" class="form-control" id="longitude" name="longitude" inputmode="decimal" required placeholder="e.g. 79.8612…">
            </div>
            <div class="col-md-4 mb-3">
                <button type="button" class="btn btn-outline-primary w-100" id="btnUseLocation">
                    <i class="fas fa-location-crosshairs" aria-hidden="true"></i> Use my location
                </button>
            </div>
        </div>
        <p class="form-text mt-0 mb-3">Stand at your hotel and tap &ldquo;Use my location&rdquo; so customers can find you on the map.</p>

        <div class="mb-3">
            <label class="form-label" for="license">Business licence (PDF or image, up to 10 MB)</label>
            <input type="file" class="form-control" id="license" name="license" accept="application/pdf,image/jpeg,image/png,image/webp" required>
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
            <label class="form-check-label" for="agree">
                I agree to the <a href="../terms.html" target="_blank" rel="noopener">Terms of Use</a> and
                <a href="../privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.
            </label>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">Register hotel</button>
        </div>

        <p class="text-center mt-3 mb-0">Already registered? <a href="login.html" class="fw-semibold">Sign in</a></p>
        <p class="text-center mt-2 mb-0"><a href="../index.html" class="auth-link">&larr; Back to home</a></p>
    </form>
</main>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    // Hotel registration: creates the account, the hotel record and the licence upload.
    const MAX_LICENSE_BYTES = 10 * 1024 * 1024;
    const LICENSE_TYPES = ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'];

    ReplateUI.attachPasswordToggle('password', 'toggleRegPassword', 'toggleRegPasswordIcon');
    ReplateUI.attachPasswordToggle('confirmPassword', 'toggleRegConfirmPassword', 'toggleRegConfirmPasswordIcon');

    // Short way to get a form field by id.
    function field(id) { return document.getElementById(id); }

    // Turns a sign-up error into a simple message.
    function friendlyAuthError(error) {
        switch (error && error.code) {
            case 'auth/email-already-in-use': return 'An account with this email already exists. Sign in instead.';
            case 'auth/invalid-email': return 'That email address does not look right.';
            case 'auth/weak-password': return 'Choose a stronger password (at least 8 characters).';
            case 'auth/network-request-failed': return 'No connection. Check your internet and try again.';
            default: return 'Could not create your account. Please try again.';
        }
    }

    // Fills the coordinates from the browser's location.
    field('btnUseLocation').addEventListener('click', () => {
        if (!navigator.geolocation) {
            ReplateUI.toast('Your browser cannot share its location. Type the coordinates instead.', 'warning');
            return;
        }
        const button = field('btnUseLocation');
        button.disabled = true;
        navigator.geolocation.getCurrentPosition((pos) => {
            field('latitude').value = pos.coords.latitude.toFixed(6);
            field('longitude').value = pos.coords.longitude.toFixed(6);
            ReplateUI.clearFieldError('latitude');
            ReplateUI.clearFieldError('longitude');
            button.disabled = false;
            ReplateUI.toast('Location filled in.', 'success');
        }, () => {
            button.disabled = false;
            ReplateUI.toast('Could not get your location. Allow location access or type the coordinates.', 'warning');
        }, { enableHighAccuracy: true, timeout: 15000 });
    });

    /** Everything is checked BEFORE the account is created, so a typo never leaves a half-made account behind. */
    function validate() {
        const lat = parseFloat(field('latitude').value);
        const lng = parseFloat(field('longitude').value);
        const file = field('license').files[0];

        const bad = (id, message) => ({ id, message });
        if (!field('hotelName').value.trim()) return bad('hotelName', 'Enter the hotel name and the owner name.');
        if (!field('ownerName').value.trim()) return bad('ownerName', 'Enter the hotel name and the owner name.');
        if (!/^\S+@\S+\.\S+$/.test(field('email').value.trim())) return bad('email', 'Enter a valid email address.');
        if (!/^[+0-9()\s-]{7,20}$/.test(field('phone').value.trim())) return bad('phone', 'Enter a valid phone number, for example 0771234567.');
        if (field('password').value.length < 8) return bad('password', 'The password must be at least 8 characters.');
        if (field('password').value !== field('confirmPassword').value) return bad('confirmPassword', 'The two passwords do not match.');
        if (!field('address').value.trim()) return bad('address', 'Enter the hotel address.');
        if (!Number.isFinite(lat) || lat < -90 || lat > 90) return bad('latitude', 'Enter valid map coordinates, or tap "Use my location".');
        if (!Number.isFinite(lng) || lng < -180 || lng > 180) return bad('longitude', 'Enter valid map coordinates, or tap "Use my location".');
        if (!file) return bad('license', 'Attach your business licence.');
        if (!LICENSE_TYPES.includes(file.type)) return bad('license', 'The licence must be a PDF, JPG, PNG or WebP file.');
        if (file.size > MAX_LICENSE_BYTES) return bad('license', 'The licence file is larger than 10 MB.');
        if (!field('agree').checked) return bad('agree', 'Please accept the Terms of Use and Privacy Policy.');
        return null;
    }

    // Creates the account, hotel record and licence upload.
    field('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        ReplateUI.clearFieldErrors('registerForm');
        const problem = validate();
        if (problem) {
            ReplateUI.fieldProblem(problem.id, problem.message);
            return;
        }

        const email = field('email').value.trim();
        const password = field('password').value;
        const file = field('license').files[0];
        ReplateUI.setButtonLoading('submitBtn', true, 'Creating your account…');

        let createdUser = null;
        try {
            const credential = await auth.createUserWithEmailAndPassword(email, password);
            createdUser = credential.user;
            const uid = createdUser.uid;

            const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(-60);
            const storageRef = storage.ref('licenses/' + uid + '_' + Date.now() + '_' + safeName);
            await storageRef.put(file, { contentType: file.type });
            const licenseUrl = await storageRef.getDownloadURL();

            const hotelFormData = {
                hotelName: field('hotelName').value.trim(),
                ownerName: field('ownerName').value.trim(),
                email,
                phone: field('phone').value.trim(),
                address: field('address').value.trim(),
                latitude: field('latitude').value,
                longitude: field('longitude').value
            };

            const hotelData = ReplateSchema.buildHotelPayload(hotelFormData, uid);
            const newHotelRef = database.ref('hotels').push();
            // The profile is written first: if the hotel write below fails, the owner is left with a profile
            // and no hotel (they can simply register again). The other way round would leave a pending
            // hotel with no owner for the admin to find, and the rules do not let an owner delete a hotel.
            await database.ref('users/' + uid).set({
                name: hotelFormData.ownerName,
                email,
                phone: hotelFormData.phone,
                userType: 'hotel',
                role: 'hotel',
                profileImage: '',
                fcmEnabled: true,
                createdAt: Date.now(),
                lastActive: Date.now(),
                emailVerified: !!createdUser.emailVerified,
                hotelId: newHotelRef.key
            });

            // The licence link goes to its own node that only this owner and admins can read
            await database.ref().update({
                ['hotels/' + newHotelRef.key]: hotelData,
                ['hotelLicenses/' + newHotelRef.key]: { userId: uid, licenseUrl, uploadedAt: Date.now() }
            });

            // Registration is complete but not yet approved, so do not leave the visitor signed in
            await auth.signOut();
            ReplateUI.flash('Registration received. We will email you once an admin has approved your hotel.', 'success');
            window.location.href = 'login.html';
        } catch (error) {
            console.error(error);
            // Remove a half-created account so the same email can be used again
            if (createdUser) {
                try { await createdUser.delete(); } catch (ignored) { /* best effort */ }
            }
            const fromAuth = error && String(error.code || '').startsWith('auth/');
            ReplateUI.toast(fromAuth ? friendlyAuthError(error) : 'Could not finish the registration. Check your connection and try again.', 'danger');
        } finally {
            ReplateUI.setButtonLoading('submitBtn', false);
        }
    });
</script>

</body>
</html>
