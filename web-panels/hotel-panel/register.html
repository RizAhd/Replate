<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Hotel - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

<div class="auth-card auth-card-wide">
    <h2 class="text-center auth-title mb-4"><i class="fas fa-hotel me-2"></i>Register Hotel</h2>

    <form id="registerForm">
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Hotel Name</label>
                <input type="text" class="form-control" id="hotelName" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Owner Name</label>
                <input type="text" class="form-control" id="ownerName" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" id="phone" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" class="form-control" id="address" required>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Latitude</label>
                <input type="number" step="any" class="form-control" id="latitude" required placeholder="e.g. 6.9271">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Longitude</label>
                <input type="number" step="any" class="form-control" id="longitude" required placeholder="e.g. 79.8612">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">Business License (PDF/Image)</label>
            <input type="file" class="form-control" id="license" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">REGISTER HOTEL</button>
        </div>

        <p class="text-center mt-3 mb-0">Already have an account? <a href="login.html" class="fw-semibold">Login</a></p>
    </form>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password !== confirm) return alert('Passwords do not match');

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = 'Registering...';

        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const uid = userCredential.user.uid;

            const file = document.getElementById('license').files[0];
            if (!file) throw new Error('Please select a license file');

            const storageRef = storage.ref('licenses/' + uid + '_' + Date.now() + '_' + file.name);
            await storageRef.put(file);
            const licenseUrl = await storageRef.getDownloadURL();

            const hotelFormData = {
                hotelName: document.getElementById('hotelName').value,
                ownerName: document.getElementById('ownerName').value,
                email,
                phone: document.getElementById('phone').value,
                address: document.getElementById('address').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value
            };

            const hotelData = ReplateSchema.buildHotelPayload(hotelFormData, uid, licenseUrl);

            const newHotelRef = database.ref('hotels').push();
            await newHotelRef.set(hotelData);

            await database.ref('users/' + uid).set({
                name: hotelFormData.ownerName,
                email,
                phone: hotelFormData.phone,
                userType: 'hotel',
                role: 'hotel',
                profileImage: '',
                fcmEnabled: true,
                createdAt: Date.now(),
                lastActive: Date.now(),
                emailVerified: !!auth.currentUser?.emailVerified,
                hotelId: newHotelRef.key
            });

            alert('Registration successful! Please wait for admin approval.');
            window.location.href = 'login.html';

        } catch (error) {
            console.error(error);
            alert(error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = 'REGISTER HOTEL';
        }
    });
</script>

</body>
</html>
