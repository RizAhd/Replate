<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Settings - REPLATE - REPLATE food rescue.">
    <meta name="theme-color" content="#1a6b3c">
    <meta name="robots" content="noindex, nofollow">
    <title>Settings - REPLATE</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Settings</h1>
                    <p class="panel-subtitle mb-0">Manage your hotel profile and preferences.</p>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-6">
                    <div class="card p-4">
                        <h5 class="mb-4"><i class="fas fa-building me-2"></i>Profile Information</h5>
                        <form id="profileForm">
                            <div class="mb-3">
                                <label class="form-label" for="hotelName">Hotel Name</label>
                                <input type="text" class="form-control" id="hotelName" maxlength="80" autocomplete="organization" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="ownerName">Owner Name</label>
                                <input type="text" class="form-control" id="ownerName" maxlength="80" autocomplete="name" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="phone">Phone</label>
                                <input type="tel" class="form-control" id="phone" maxlength="20" autocomplete="tel" inputmode="tel" required>
                            </div>
                            <button type="submit" class="btn btn-primary" id="btnSaveProfile">
                                <i class="fas fa-save me-2" aria-hidden="true"></i>Update Profile
                            </button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card p-4">
                        <h5 class="mb-4"><i class="fas fa-shield-alt me-2"></i>Account Security</h5>
                        <p class="tips-list">
                            To change your password or email, use the password reset option on the login page.
                            Your account is secured with Firebase Authentication.
                        </p>
                        <button class="btn btn-outline-primary" type="button" id="btnSignOut">
                            <i class="fas fa-sign-out-alt me-2" aria-hidden="true"></i>Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>
<script src="../js/hotel-shell-config.js"></script>

<script>
    let currentHotelId = null;

    document.getElementById('btnSignOut').addEventListener('click', () => logout());

    (async () => {
        const user = await ReplateUI.requireRole('hotel');
        if (!user) return;

        try {
            const hotelRecord = await ReplateSchema.findHotelByUserId(database, user.uid);
            if (!hotelRecord) {
                ReplateUI.toast('No hotel profile was found for this account.', 'warning');
                return;
            }
            currentHotelId = hotelRecord.key;
            const data = hotelRecord.value || {};
            document.getElementById('hotelName').value = data.hotelName || '';
            document.getElementById('ownerName').value = data.ownerName || '';
            document.getElementById('phone').value = data.phone || '';
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not load your profile. Refresh the page to try again.', 'danger');
        }
    })();

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentHotelId) {
            ReplateUI.toast('Your profile is still loading. Try again in a moment.', 'warning');
            return;
        }
        const hotelName = document.getElementById('hotelName').value.trim();
        const ownerName = document.getElementById('ownerName').value.trim();
        const phone = document.getElementById('phone').value.trim();
        if (!hotelName || !ownerName) {
            ReplateUI.toast('Hotel name and owner name cannot be empty.', 'warning');
            return;
        }
        if (!/^[+0-9()\s-]{7,20}$/.test(phone)) {
            ReplateUI.toast('Enter a valid phone number, for example 0771234567.', 'warning');
            return;
        }

        ReplateUI.setButtonLoading('btnSaveProfile', true, 'Saving...');
        try {
            await database.ref('hotels/' + currentHotelId).update({ hotelName, ownerName, phone });
            ReplateUI.toast('Profile updated.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not save your changes. Please try again.', 'danger');
        } finally {
            ReplateUI.setButtonLoading('btnSaveProfile', false);
        }
    });
</script>
</body>
</html>
