<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
            <div class="position-sticky">
                <a class="navbar-brand d-block px-3 py-3 mb-3 text-center" href="#">
                    <i class="fas fa-utensils me-2"></i>REPLATE
                </a>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="add-food.html"><i class="fas fa-plus-circle"></i> Add Food</a></li>
                    <li class="nav-item"><a class="nav-link" href="manage-listings.html"><i class="fas fa-list"></i> My Listings</a></li>
                    <li class="nav-item"><a class="nav-link" href="orders.html"><i class="fas fa-receipt"></i> Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="analytics.html"><i class="fas fa-chart-line"></i> Analytics</a></li>
                    <li class="nav-item"><a class="nav-link active" href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4">Settings</h2>

            <div class="row">
                <div class="col-md-6">
                    <div class="card p-4">
                        <h5>Profile Information</h5>
                        <form id="profileForm">
                            <div class="mb-3">
                                <label>Hotel Name</label>
                                <input type="text" class="form-control" id="hotelName">
                            </div>
                            <div class="mb-3">
                                <label>Owner Name</label>
                                <input type="text" class="form-control" id="ownerName">
                            </div>
                            <div class="mb-3">
                                <label>Phone</label>
                                <input type="text" class="form-control" id="phone">
                            </div>
                            <button type="submit" class="btn btn-primary">Update Profile</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
    auth.onAuthStateChanged((user) => {
        if (user) {
            database.ref('hotels/' + user.uid).once('value', (snapshot) => {
                const data = snapshot.val();
                document.getElementById('hotelName').value = data.hotelName;
                document.getElementById('ownerName').value = data.ownerName;
                document.getElementById('phone').value = data.phone;
            });
        }
    });

    document.getElementById('profileForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const user = auth.currentUser;
        if(user) {
            database.ref('hotels/' + user.uid).update({
                hotelName: document.getElementById('hotelName').value,
                ownerName: document.getElementById('ownerName').value,
                phone: document.getElementById('phone').value
            }).then(() => alert("Profile Updated!"));
        }
    });
</script>
</body>
</html>
