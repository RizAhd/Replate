<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main>
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Settings</h1>
                    <p class="panel-subtitle mb-0">Manage your hotel profile and preferences.</p>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-6">
                    <div class="card p-4">
                        <h5 class="mb-4"><i class="fas fa-building me-2"></i>Profile Information</h5>
                        <form id="profileForm">
                            <div class="mb-3">
                                <label class="form-label" for="hotelName">Hotel Name</label>
                                <input type="text" class="form-control" id="hotelName">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="ownerName">Owner Name</label>
                                <input type="text" class="form-control" id="ownerName">
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="phone">Phone</label>
                                <input type="text" class="form-control" id="phone">
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save me-2"></i>Update Profile
                            </button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="card p-4">
                        <h5 class="mb-4"><i class="fas fa-shield-alt me-2"></i>Account Security</h5>
                        <p style="color: var(--text-secondary); font-size: 0.9rem;">
                            To change your password or email, use the password reset option on the login page.
                            Your account is secured with Firebase Authentication.
                        </p>
                        <button class="btn btn-outline-primary" onclick="logout()">
                            <i class="fas fa-sign-out-alt me-2"></i>Sign Out
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    const hotelShellLinks = [
        { key: 'dashboard',  href: 'dashboard.html',       icon: 'fas fa-home',         label: 'Dashboard' },
        { key: 'add-food',   href: 'add-food.html',         icon: 'fas fa-plus-circle',  label: 'Add Food' },
        { key: 'listings',   href: 'manage-listings.html',  icon: 'fas fa-list',         label: 'My Listings' },
        { key: 'orders',     href: 'orders.html',           icon: 'fas fa-receipt',      label: 'Orders' },
        { key: 'analytics',  href: 'analytics.html',        icon: 'fas fa-chart-line',   label: 'Analytics' },
        { key: 'settings',   href: 'settings.html',         icon: 'fas fa-cog',          label: 'Settings' },
        { key: 'logout',     href: '#',                     icon: 'fas fa-sign-out-alt', label: 'Logout', logout: true }
    ];

    let currentHotelId = null;

    auth.onAuthStateChanged(async (user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">REPLATE',
            activeKey: 'settings',
            links: hotelShellLinks,
        });

        if (!user) return;

        const hotelRecord = await ReplateSchema.findHotelByUserId(database, user.uid);
        if (!hotelRecord) {
            alert('Hotel profile not found for this account.');
            return;
        }

        currentHotelId = hotelRecord.key;
        const data = hotelRecord.value;

        document.getElementById('hotelName').value = data.hotelName || '';
        document.getElementById('ownerName').value = data.ownerName || '';
        document.getElementById('phone').value = data.phone || '';
    });

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentHotelId) return;

        await database.ref('hotels/' + currentHotelId).update({
            hotelName: document.getElementById('hotelName').value,
            ownerName: document.getElementById('ownerName').value,
            phone: document.getElementById('phone').value
        });

        ReplateUI.showAlert('Profile updated successfully!', 'success');
    });
</script>
</body>
</html>
