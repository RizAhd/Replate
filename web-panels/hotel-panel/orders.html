<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" type="text/javascript"></script>
    <style>
        .badge-success  { background:#198754; color:#fff; padding:4px 10px; border-radius:6px; font-size:.8rem; }
        .badge-warning  { background:#ffc107; color:#000; padding:4px 10px; border-radius:6px; font-size:.8rem; }
        .badge-danger   { background:#dc3545; color:#fff; padding:4px 10px; border-radius:6px; font-size:.8rem; }
        #reader { border-radius:8px; overflow:hidden; }
        .order-new { background:#fffbe6 !important; }
        .otp-digits { letter-spacing:12px; font-size:2rem; font-family:monospace; text-align:center; }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav id="appShellSidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Manage Orders</h1>
            </div>

            <!-- Action Tabs -->
            <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="pills-all-tab" data-bs-toggle="pill" data-bs-target="#pills-all" type="button" role="tab">📋 All Orders</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-scan-tab" data-bs-toggle="pill" data-bs-target="#pills-scan" type="button" role="tab">📷 Scan QR</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="pills-otp-tab" data-bs-toggle="pill" data-bs-target="#pills-otp" type="button" role="tab">🔢 Enter OTP</button>
                </li>
            </ul>

            <div class="tab-content" id="pills-tabContent">

                <!-- ALL ORDERS TAB -->
                <div class="tab-pane fade show active" id="pills-all" role="tabpanel">
                    <div class="card p-3">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Order ID</th>
                                        <th>Customer</th>
                                        <th>Items</th>
                                        <th>Total</th>
                                        <th>Review</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="ordersTable">
                                    <!-- Loaded via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- SCAN QR TAB -->
                <div class="tab-pane fade" id="pills-scan" role="tabpanel">
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <div class="card p-4 text-center">
                                <h5>Scan Customer QR Code</h5>
                                <div id="reader" style="width: 100%; min-height: 300px;"></div>
                                <p class="text-muted mt-3">Point camera at the QR code on customer's phone.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="pills-otp" role="tabpanel">
                    <div class="row justify-content-center">
                        <div class="col-md-5">
                            <div class="card p-5 text-center">
                                <h5 class="mb-4">Enter 6-Digit OTP</h5>
                                <label for="otpInput" class="visually-hidden">Order OTP</label>
                                <input type="number" id="otpInput" class="form-control form-control-lg otp-digits text-center mb-4"
                                       placeholder="0 0 0 0 0 0" min="0" max="999999">
                                <button class="btn btn-primary w-100" onclick="verifyOTP()">
                                    <i class="fas fa-check-circle me-2"></i>Verify OTP &amp; Confirm Pickup
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Verification Modal -->
<div class="modal fade" id="verificationModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Confirm Pickup</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><strong>Order ID:</strong> <span id="modalOrderId"></span></p>
                <p><strong>Customer:</strong> <span id="modalCustomer"></span></p>
                <p><strong>Items:</strong></p>
                <ul id="modalItems"></ul>
                <p class="text-end fw-bold">Total: <span id="modalTotal"></span></p>
                <p><strong>Review:</strong> <span id="modalReview"></span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success" onclick="confirmPickup()">✅ Confirm & Complete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    let currentHotelUserId = null;
    let hotelIds = new Set();
    let html5QrcodeScanner = null;
    let currentOrderKey = null;
    let verificationModalInstance = null;

    const hotelShellLinks = [
        { key: 'dashboard',  href: 'dashboard.html',       icon: 'fas fa-home',         label: 'Dashboard' },
        { key: 'add-food',   href: 'add-food.html',         icon: 'fas fa-plus-circle',  label: 'Add Food' },
        { key: 'listings',   href: 'manage-listings.html',  icon: 'fas fa-list',         label: 'My Listings' },
        { key: 'orders',     href: 'orders.html',           icon: 'fas fa-receipt',      label: 'Orders' },
        { key: 'analytics',  href: 'analytics.html',        icon: 'fas fa-chart-line',   label: 'Analytics' },
        { key: 'settings',   href: 'settings.html',         icon: 'fas fa-cog',          label: 'Settings' },
        { key: 'logout',     href: '#',                     icon: 'fas fa-sign-out-alt', label: 'Logout', logout: true }
    ];

    function orderBelongsToHotel(order) {
        const id = String(order.hotelId || order.hotelKey || order.hotelUserId || '').trim();
        return hotelIds.has(id);
    }

    auth.onAuthStateChanged(async (user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<i class="fas fa-utensils me-2"></i>REPLATE',
            activeKey: 'orders',
            links: hotelShellLinks,
        });

        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        currentHotelUserId = user.uid;
        hotelIds = new Set([user.uid]);
        try {
            const hotelRecord = await ReplateSchema.findHotelByUserId(database, user.uid);
            if (hotelRecord && hotelRecord.key) hotelIds.add(hotelRecord.key);
        } catch (e) {
            console.error('Failed to resolve hotel identity:', e);
        }
        loadOrders();
    });

    function loadOrders() {
        const tableBody = document.getElementById('ordersTable');
        tableBody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">Loading orders...</td></tr>';

        database.ref('orders').on('value', (snapshot) => {
            tableBody.innerHTML = '';

            const rows = [];
            snapshot.forEach((child) => {
                const order = child.val() || {};
                if (orderBelongsToHotel(order)) {
                    rows.push({ key: child.key, order });
                }
            });

            if (rows.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No orders yet 🍽️</td></tr>';
                return;
            }

            rows.sort((a, b) => (b.order.createdAt || 0) - (a.order.createdAt || 0));

            const htmlRows = rows.map(({ key, order }) => {
                const itemNames  = ReplateSchema.extractItemNames(order);
                const status     = ReplateSchema.normalizeOrderStatus(order.orderStatus);
                const badgeClass = ReplateSchema.statusBadgeClass(status);
                const label      = ReplateSchema.statusLabel(status);
                const amount     = ReplateSchema.formatAmount(order.totalAmount || order.totalPrice);
                const displayId  = ReplateSchema.shortOrderId(order, key);
                const isNew      = status === 'pending_pickup';
                const review = Number(order.reviewRating || 0);
                const reviewText = review > 0 ? `⭐ ${review.toFixed(1)}` : '<span class="text-muted">No review</span>';

                return `
                    <tr class="${isNew ? 'order-new' : ''}">
                        <td><code>#${displayId}</code></td>
                        <td>${order.customerName || 'Customer'}<br>
                            <small class="text-muted">${order.customerPhone || ''}</small></td>
                        <td>${itemNames}</td>
                        <td>LKR ${amount}</td>
                        <td>${reviewText}</td>
                        <td><span class="${badgeClass}">${label}</span></td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary" onclick="viewOrderByKey('${key}')">
                                <i class="fas fa-eye"></i> View
                            </button>
                            ${isNew ? `<button class="btn btn-sm btn-success ms-1" onclick="quickComplete('${key}')">
                                <i class="fas fa-check"></i> Done
                            </button>` : ''}
                        </td>
                    </tr>`;
            }).join('');

            tableBody.innerHTML = htmlRows;
        });
    }

    document.getElementById('pills-scan-tab').addEventListener('shown.bs.tab', () => {
        if (html5QrcodeScanner) return;
        html5QrcodeScanner = new Html5Qrcode('reader');
        html5QrcodeScanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            (decodedText) => {
                stopScanner();
                document.getElementById('pills-all-tab').click();
                checkOrderByCode(decodedText.trim());
            },
            () => {}
        ).catch(err => {
            document.getElementById('reader').innerHTML =
                `<div class="alert alert-warning">Camera not available: ${err}</div>`;
        });
    });

    document.getElementById('pills-all-tab').addEventListener('shown.bs.tab', stopScanner);
    document.getElementById('pills-otp-tab').addEventListener('shown.bs.tab', stopScanner);

    function stopScanner() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop()
                .then(() => { html5QrcodeScanner.clear(); html5QrcodeScanner = null; })
                .catch(() => { html5QrcodeScanner = null; });
        }
    }

    function verifyOTP() {
        const raw = (document.getElementById('otpInput').value || '').trim().replace(/\D/g, '');
        if (raw.length < 4) {
            alert('Please enter the OTP code.');
            return;
        }
        const otp = raw.padStart(6, '0');

        database.ref('orders').once('value').then(snapshot => {
            let foundKey = null;
            let foundOrder = null;

            snapshot.forEach(child => {
                if (foundKey) return;
                const o = child.val() || {};
                if (!orderBelongsToHotel(o)) return;

                const saved = String(o.otpCode || '').trim().padStart(6, '0');
                if (saved === otp) {
                    foundKey = child.key;
                    foundOrder = o;
                }
            });

            if (!foundKey) {
                alert('❌ Invalid OTP. Please check the code and try again.');
                return;
            }
            showVerificationModal(foundKey, foundOrder);
        });
    }

    function checkOrderByCode(code) {
        if (!code) return;

        database.ref('orders/' + code).once('value').then(snapshot => {
            if (snapshot.exists()) {
                const order = snapshot.val() || {};
                if (orderBelongsToHotel(order)) {
                    showVerificationModal(code, order);
                    return;
                }
            }

            database.ref('orders').once('value').then(snap => {
                let foundKey = null;
                let foundOrder = null;

                snap.forEach(child => {
                    if (foundKey) return;
                    const o = child.val() || {};
                    if (!orderBelongsToHotel(o)) return;

                    const candidates = [
                        child.key,
                        String(o.orderId || ''),
                        String(o.qrCode || ''),
                        String(o.pickupCode || ''),
                    ].map(v => v.trim());

                    if (candidates.includes(code)) {
                        foundKey = child.key;
                        foundOrder = o;
                    }
                });

                if (!foundKey) {
                    alert('❌ Order not found. Make sure the QR code belongs to this hotel.');
                    return;
                }
                showVerificationModal(foundKey, foundOrder);
            });
        });
    }

    function showVerificationModal(key, order) {
        if (!verificationModalInstance) {
            verificationModalInstance = new bootstrap.Modal(document.getElementById('verificationModal'));
        }
        currentOrderKey = key;

        const status = ReplateSchema.normalizeOrderStatus(order.orderStatus);
        if (status === 'completed') {
            alert('ℹ️ This order is already completed.');
            return;
        }
        if (status === 'cancelled') {
            alert('⚠️ This order has been cancelled.');
            return;
        }

        document.getElementById('modalOrderId').innerText = '#' + ReplateSchema.shortOrderId(order, key);
        document.getElementById('modalCustomer').innerText =
            (order.customerName || 'Customer') + (order.customerPhone ? ' - ' + order.customerPhone : '');
        document.getElementById('modalTotal').innerText =
            'LKR ' + ReplateSchema.formatAmount(order.totalAmount || order.totalPrice);

        const list = document.getElementById('modalItems');
        const itemsHtml = ReplateSchema.extractItemsArray(order).map(item =>
            `<li>${item.foodName || 'Item'} x ${item.quantity || 1}
                &nbsp;<small class="text-muted">LKR ${ReplateSchema.formatAmount(item.price)}</small></li>`
        ).join('');
        list.innerHTML = itemsHtml;

        document.getElementById('modalReview').innerText = order.reviewRating
            ? `⭐ ${Number(order.reviewRating).toFixed(1)}${order.reviewComment ? ' - ' + order.reviewComment : ''}`
            : 'No review yet';

        verificationModalInstance.show();
    }

    function confirmPickup() {
        if (!currentOrderKey) return;
        database.ref('orders/' + currentOrderKey).update({
            orderStatus: 'completed',
            completedAt: Date.now()
        }).then(() => {
            sendCompletionNotification(currentOrderKey);
            if (verificationModalInstance) verificationModalInstance.hide();
            ReplateUI.showAlert('✅ Order marked as completed!', 'success');
        }).catch(err => alert('Error: ' + err.message));
    }

    window.quickComplete = function(key) {
        database.ref('orders/' + key).once('value').then(snap => {
            const order = snap.val() || {};
            if (confirm('Mark this order as completed?\nCustomer: ' + (order.customerName || 'Unknown'))) {
                showVerificationModal(key, order);
            }
        });
    };

    window.viewOrderByKey = function(key) {
        database.ref('orders/' + key).once('value').then(snap => {
            if (snap.exists()) showVerificationModal(key, snap.val() || {});
        });
    };

    function sendCompletionNotification(orderKey) {
        database.ref('orders/' + orderKey).once('value').then(snapshot => {
            const order = snapshot.val();
            if (!order || !order.userId) return;

            database.ref('users/' + order.userId + '/fcmToken').once('value').then(ts => {
                const token = ts.val();
                if (!token) return;

                const serverKey = (typeof ENV !== 'undefined' && ENV.FIREBASE_FCM_SERVER_KEY)
                    ? ENV.FIREBASE_FCM_SERVER_KEY : null;
                if (!serverKey) return;

                fetch('https://fcm.googleapis.com/fcm/send', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'key=' + serverKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        to: token,
                        notification: {
                            title: '🎉 Pickup Confirmed!',
                            body: 'Your order at ' + (order.hotelName || 'the restaurant') +
                                  ' has been picked up. Enjoy your meal! 🍽️'
                        },
                        data: {
                            type: 'order_status',
                            newStatus: 'completed',
                            orderId: orderKey
                        }
                    })
                }).catch(() => {});
            });
        });
    }
</script>

</body>
</html>
