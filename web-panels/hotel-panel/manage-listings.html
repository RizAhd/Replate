<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="My Listings - REPLATE Hotel - REPLATE food rescue.">
    <meta name="theme-color" content="#1a6b3c">
    <meta name="robots" content="noindex, nofollow">
    <title>My Listings - REPLATE Hotel</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">My Food Listings</h1>
                    <p class="panel-subtitle mb-0">Manage active and sold out food items.</p>
                </div>
                <a href="add-food.html" class="btn btn-primary btn-sm"><i class="fas fa-plus me-2"></i>Add Food</a>
            </div>

            <div class="card p-3">
                <div class="table-responsive">
                    <table class="table table-hover align-middle table-stack">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Food Name</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="listingsTable">
                            <!-- Items will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>
<script src="../js/hotel-shell-config.js"></script>

<script>
    let hotelIds = new Set();


    auth.onAuthStateChanged(async (user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">REPLATE',
            activeKey: 'listings',
            links: hotelShellLinks,
        });

        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const hotelRecord = await ReplateSchema.findHotelByUserId(database, user.uid);
            hotelIds = new Set([user.uid]);
            if (hotelRecord && hotelRecord.key) hotelIds.add(hotelRecord.key);
            loadListings();
        } catch (e) {
            console.error('Failed to resolve hotel identity:', e);
            hotelIds = new Set([user.uid]);
            loadListings();
        }
    });

    function loadListings() {
        const tableBody = document.getElementById('listingsTable');
        tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4">Loading...</td></tr>';

        database.ref('foodItems').on('value', (snapshot) => {
            tableBody.innerHTML = '';
            const rows = [];

            snapshot.forEach((child) => {
                const item = child.val() || {};
                const itemHotelId = String(item.hotelId || item.hotelKey || item.hotelUserId || '').trim();
                if (hotelIds.has(itemHotelId)) {
                    rows.push({ key: child.key, item });
                }
            });

            if (rows.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4">No items found</td></tr>';
                return;
            }

            rows.sort((a, b) => (b.item.createdAt || 0) - (a.item.createdAt || 0));

            const htmlRows = rows.map(({ key, item }) => {
                const isAvailable = item.isAvailable === true || String(item.status || '').toLowerCase() === 'available';
                const pickupStart = item.pickupTimeStart || item.pickupStart || '--:--';
                const pickupEnd = item.pickupTimeEnd || item.pickupEnd || '--:--';
                const imageUrl = item.imageUrl || '';

                return `
                    <tr>
                        <td data-label="Image">${imageUrl ? `<img src="${imageUrl}" width="50" height="50" class="rounded" style="object-fit:cover;max-width:50px;height:50px;">` : '<span class="text-muted">No image</span>'}</td>
                        <td data-label="Food Name">
                            <div class="fw-bold">${item.foodName || 'Untitled'}</div>
                            <small class="text-muted">${pickupStart} - ${pickupEnd}</small>
                        </td>
                        <td data-label="Price">
                            <span class="text-decoration-line-through text-muted small">LKR ${item.originalPrice || 0}</span><br>
                            <span class="text-success fw-bold">LKR ${item.discountedPrice || 0}</span>
                        </td>
                        <td data-label="Qty">${item.quantity || 0}</td>
                        <td data-label="Status">
                            <span class="badge ${isAvailable ? 'bg-success' : 'bg-secondary'}">
                                ${isAvailable ? 'Active' : 'Sold Out'}
                            </span>
                        </td>
                        <td data-label="Actions" class="actions-cell">
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteItem('${key}')">
                                <i class="fas fa-trash"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-primary" onclick="toggleStatus('${key}', ${isAvailable})">
                                ${isAvailable ? 'Mark Sold' : 'Activate'}
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            tableBody.innerHTML = htmlRows;
        });
    }

    window.deleteItem = function(key) {
        if (confirm('Delete this item?')) {
            database.ref('foodItems/' + key).remove();
        }
    };

    window.toggleStatus = function(key, currentStatus) {
        database.ref('foodItems/' + key).update({
            isAvailable: !currentStatus,
            available: !currentStatus,
            status: !currentStatus ? 'available' : 'sold_out'
        });
    };
</script>
</body>
</html>
