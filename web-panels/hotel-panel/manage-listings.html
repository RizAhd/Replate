<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Listings - REPLATE Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar (Same as add-food) -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse">
            <div class="position-sticky">
                <a class="navbar-brand d-block px-3 py-3 mb-3 text-center" href="#">
                    <i class="fas fa-utensils me-2"></i>REPLATE
                </a>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="add-food.html"><i class="fas fa-plus-circle"></i> Add Food</a></li>
                    <li class="nav-item"><a class="nav-link active" href="manage-listings.html"><i class="fas fa-list"></i> My Listings</a></li>
                    <li class="nav-item"><a class="nav-link" href="orders.html"><i class="fas fa-receipt"></i> Orders</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4">My Food Listings</h2>

            <div class="card p-3">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Food Name</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="listingsTable">
                            <!-- Items will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>

<script>
    let hotelIds = new Set();

    auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const hotelRecord = await ReplateSchema.findHotelByUserId(database, user.uid);
            hotelIds = new Set([user.uid]);
            if (hotelRecord && hotelRecord.key) hotelIds.add(hotelRecord.key);
            loadListings();
        } catch (e) {
            console.error('Failed to resolve hotel identity:', e);
            hotelIds = new Set([user.uid]);
            loadListings();
        }
    });

    function loadListings() {
        const tableBody = document.getElementById('listingsTable');
        tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4">Loading...</td></tr>';

        database.ref('foodItems').on('value', (snapshot) => {
            tableBody.innerHTML = '';
            const rows = [];

            snapshot.forEach((child) => {
                const item = child.val() || {};
                const itemHotelId = String(item.hotelId || item.hotelKey || item.hotelUserId || '').trim();
                if (hotelIds.has(itemHotelId)) {
                    rows.push({ key: child.key, item });
                }
            });

            if (rows.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" class="text-center py-4">No items found</td></tr>';
                return;
            }

            rows.sort((a, b) => (b.item.createdAt || 0) - (a.item.createdAt || 0));

            rows.forEach(({ key, item }) => {
                const isAvailable = item.isAvailable === true || String(item.status || '').toLowerCase() === 'available';
                const pickupStart = item.pickupTimeStart || item.pickupStart || '--:--';
                const pickupEnd = item.pickupTimeEnd || item.pickupEnd || '--:--';
                const imageUrl = item.imageUrl || '';

                const row = `
                    <tr>
                        <td>${imageUrl ? `<img src="${imageUrl}" width="50" height="50" class="rounded" style="object-fit:cover">` : '<span class="text-muted">No image</span>'}</td>
                        <td>
                            <div class="fw-bold">${item.foodName || 'Untitled'}</div>
                            <small class="text-muted">${pickupStart} - ${pickupEnd}</small>
                        </td>
                        <td>
                            <span class="text-decoration-line-through text-muted small">LKR ${item.originalPrice || 0}</span><br>
                            <span class="text-success fw-bold">LKR ${item.discountedPrice || 0}</span>
                        </td>
                        <td>${item.quantity || 0}</td>
                        <td>
                            <span class="badge ${isAvailable ? 'bg-success' : 'bg-secondary'}">
                                ${isAvailable ? 'Active' : 'Sold Out'}
                            </span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteItem('${key}')">
                                <i class="fas fa-trash"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-primary" onclick="toggleStatus('${key}', ${isAvailable})">
                                ${isAvailable ? 'Mark Sold' : 'Activate'}
                            </button>
                        </td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });
        });
    }

    window.deleteItem = function(key) {
        if (confirm('Delete this item?')) {
            database.ref('foodItems/' + key).remove();
        }
    };

    window.toggleStatus = function(key, currentStatus) {
        database.ref('foodItems/' + key).update({
            isAvailable: !currentStatus,
            available: !currentStatus,
            status: !currentStatus ? 'available' : 'sold_out'
        });
    };
</script>
</body>
</html>
