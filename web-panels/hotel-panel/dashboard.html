<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Dashboard - REPLATE - REPLATE food rescue.">
    <meta name="theme-color" content="#1a6b3c">
    <meta name="robots" content="noindex, nofollow">
    <title>Dashboard - REPLATE</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Dashboard</h1>
                    <p class="panel-subtitle mb-0">Track orders, active listings, and revenue in real time.</p>
                </div>
                <div class="status-badge bg-secondary" id="approvalStatus" role="status">Checking status&hellip;</div>
            </div>

            <!-- Stats Cards -->
            <div class="row mb-4 g-3">
                <div class="col-md-3">
                    <div class="card stat-card">
                        <h6>Total Revenue</h6>
                        <h3 id="statRevenue">LKR 0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <h6>Active Items</h6>
                        <h3 id="statActive">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <h6>Pending Orders</h6>
                        <h3 id="statPending" class="text-warning">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <h6>Total Orders</h6>
                        <h3 id="statTotal">0</h3>
                    </div>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="card data-panel">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Recent Orders</span>
                    <a href="orders.html" class="btn btn-sm btn-outline-primary">View All</a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle table-stack">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Items</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recentOrdersTable">
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>
<script src="../js/hotel-shell-config.js"></script>

<script>
    const esc = ReplateUI.esc;
    let hotelIds = new Set();

    function setApprovalBadge(status) {
        const badge = document.getElementById('approvalStatus');
        const s = ReplateSchema.normalizeHotelStatus(status);
        const label = { approved: 'Approved', pending: 'Pending approval', rejected: 'Not approved' }[s] || 'Status unknown';
        badge.className = 'status-badge ' + ({ approved: 'badge-approved', pending: 'badge-pending', rejected: 'badge-rejected' }[s] || 'bg-secondary');
        badge.textContent = label;
    }

    (async () => {
        const user = await ReplateUI.requireRole('hotel');
        if (!user) return;

        hotelIds = new Set([user.uid]);
        try {
            const hotelRecord = await ReplateSchema.findHotelByUserId(database, user.uid);
            if (hotelRecord && hotelRecord.key) hotelIds.add(hotelRecord.key);
            setApprovalBadge(hotelRecord && hotelRecord.value && hotelRecord.value.status);
        } catch (e) {
            console.error('Failed to resolve hotel identity:', e);
            const badge = document.getElementById('approvalStatus');
            badge.className = 'status-badge bg-secondary';
            badge.textContent = 'Status unavailable';
        }
        document.getElementById('recentOrdersTable').innerHTML =
            '<tr><td colspan="5">' + ReplateUI.skeleton('rows', 3) + '</td></tr>';
        loadDashboard();
    })();

    function loadDashboard() {
        ReplateSchema.hotelOrders(database, hotelIds).on((snapshot) => {
            let revenue = 0;
            let pending = 0;
            let total = 0;
            const recentOrders = [];

            snapshot.forEach((child) => {
                const order = child.val() || {};
                total++;
                const status = ReplateSchema.normalizeOrderStatus(order.orderStatus);
                if (status === 'completed') {
                    revenue += parseFloat(order.totalAmount || order.totalPrice) || 0;
                } else if (status === 'pending_pickup') {
                    pending++;
                }
                recentOrders.push({ key: child.key, ...order });
            });

            document.getElementById('statRevenue').textContent = 'LKR ' + revenue.toLocaleString('en-LK', { minimumFractionDigits: 2 });
            document.getElementById('statPending').textContent = pending;
            document.getElementById('statTotal').textContent = total;

            recentOrders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            const tableBody = document.getElementById('recentOrdersTable');

            if (recentOrders.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5">' +
                    ReplateUI.emptyState('No orders yet', 'New reservations will show up here the moment customers place them.', 'fa-receipt') + '</td></tr>';
                return;
            }

            tableBody.innerHTML = recentOrders.slice(0, 5).map((order) => {
                const status = ReplateSchema.normalizeOrderStatus(order.orderStatus);
                return `
                    <tr>
                        <td data-label="Order ID"><code>#${esc(ReplateSchema.shortOrderId(order, order.key))}</code></td>
                        <td data-label="Customer">${esc(order.customerName || '—')}</td>
                        <td data-label="Items">${esc(ReplateSchema.extractItemNames(order))}</td>
                        <td data-label="Total" class="num">LKR ${esc(ReplateSchema.formatAmount(order.totalAmount || order.totalPrice))}</td>
                        <td data-label="Status"><span class="badge ${esc(ReplateSchema.statusBadgeClass(status))}">${esc(ReplateSchema.statusLabel(status))}</span></td>
                    </tr>`;
            }).join('');
        }, (error) => {
            console.error('Could not load orders', error);
            document.getElementById('recentOrdersTable').innerHTML = '<tr><td colspan="5">' +
                ReplateUI.errorState('Orders could not be loaded. Check your connection and try again.') + '</td></tr>';
        });

        ReplateSchema.hotelFoodItems(database, hotelIds).on((snapshot) => {
            let active = 0;
            snapshot.forEach((child) => {
                const item = child.val() || {};
                const available = item.isAvailable === true || String(item.status || '').toLowerCase() === 'available';
                if (available) active++;
            });
            document.getElementById('statActive').textContent = active;
        }, (error) => console.error('Could not load listings', error));
    }
</script>

</body>
</html>
