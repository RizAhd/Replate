<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main>
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Dashboard</h1>
                    <p class="panel-subtitle mb-0">Track orders, active listings, and revenue in real time.</p>
                </div>
                <div class="status-badge badge-approved" id="approvalStatus">Approved ✅</div>
            </div>

            <!-- Stats Cards -->
            <div class="row mb-4 g-3">
                <div class="col-md-3">
                    <div class="card stat-card">
                        <h6>Total Revenue</h6>
                        <h3 id="statRevenue">LKR 0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <h6>Active Items</h6>
                        <h3 id="statActive">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <h6>Pending Orders</h6>
                        <h3 id="statPending" class="text-warning">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card">
                        <h6>Total Orders</h6>
                        <h3 id="statTotal">0</h3>
                    </div>
                </div>
            </div>

            <!-- Recent Orders -->
            <div class="card data-panel">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>Recent Orders</span>
                    <a href="orders.html" class="btn btn-sm btn-outline-primary">View All</a>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Items</th>
                                    <th>Total</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="recentOrdersTable">
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    let hotelIds = new Set();

    const hotelShellLinks = [
        { key: 'dashboard',  href: 'dashboard.html',       icon: 'fas fa-home',         label: 'Dashboard' },
        { key: 'add-food',   href: 'add-food.html',         icon: 'fas fa-plus-circle',  label: 'Add Food' },
        { key: 'listings',   href: 'manage-listings.html',  icon: 'fas fa-list',         label: 'My Listings' },
        { key: 'orders',     href: 'orders.html',           icon: 'fas fa-receipt',      label: 'Orders' },
        { key: 'analytics',  href: 'analytics.html',        icon: 'fas fa-chart-line',   label: 'Analytics' },
        { key: 'settings',   href: 'settings.html',         icon: 'fas fa-cog',          label: 'Settings' },
        { key: 'logout',     href: '#',                     icon: 'fas fa-sign-out-alt', label: 'Logout', logout: true }
    ];

    auth.onAuthStateChanged(async (user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">REPLATE',
            activeKey: 'dashboard',
            links: hotelShellLinks,
        });
        if (!user) {
            window.location.href = 'login.html';
            return;
        }

        try {
            const hotelRecord = await ReplateSchema.findHotelByUserId(database, user.uid);
            hotelIds = new Set([user.uid]);
            if (hotelRecord && hotelRecord.key) hotelIds.add(hotelRecord.key);
            loadDashboard();
        } catch (e) {
            console.error('Failed to resolve hotel identity:', e);
            hotelIds = new Set([user.uid]);
            loadDashboard();
        }
    });

    function loadDashboard() {
        database.ref('orders').on('value', (snapshot) => {
            let revenue = 0;
            let pending = 0;
            let total = 0;
            const recentOrders = [];

            snapshot.forEach((child) => {
                const order = child.val() || {};
                const orderHotelId = String(order.hotelId || '').trim();
                if (!hotelIds.has(orderHotelId)) return;

                total++;
                const status = ReplateSchema.normalizeOrderStatus(order.orderStatus);
                if (status === 'completed') {
                    revenue += parseFloat(order.totalAmount || order.totalPrice) || 0;
                } else if (status === 'pending_pickup') {
                    pending++;
                }
                recentOrders.push({ key: child.key, ...order });
            });

            document.getElementById('statRevenue').innerText = 'LKR ' + revenue.toLocaleString('en-LK', { minimumFractionDigits: 2 });
            document.getElementById('statPending').innerText = pending;
            document.getElementById('statTotal').innerText = total;

            recentOrders.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            const tableBody = document.getElementById('recentOrdersTable');
            tableBody.innerHTML = '';

            if (recentOrders.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No orders yet</td></tr>';
                return;
            }

            const rows = recentOrders.slice(0, 5).map(order => {
                const items = ReplateSchema.extractItemNames(order);
                const status = ReplateSchema.normalizeOrderStatus(order.orderStatus);
                const bgClass = ReplateSchema.statusBgClass(status);
                const label = ReplateSchema.statusLabel(status);
                const amount = ReplateSchema.formatAmount(order.totalAmount || order.totalPrice);
                const dispId = ReplateSchema.shortOrderId(order, order.key);
                return `
                    <tr>
                        <td><code>#${dispId}</code></td>
                        <td>${order.customerName || '—'}</td>
                        <td>${items}</td>
                        <td>LKR ${amount}</td>
                        <td><span class="badge ${bgClass}">${label}</span></td>
                    </tr>`;
            });
            tableBody.innerHTML = rows.join('');
        });

        database.ref('foodItems').on('value', (snapshot) => {
            let active = 0;
            snapshot.forEach((child) => {
                const item = child.val() || {};
                const itemHotelId = String(item.hotelId || item.hotelKey || item.hotelUserId || '').trim();
                if (!hotelIds.has(itemHotelId)) return;

                const avail = item.isAvailable === true ||
                              String(item.status || '').toLowerCase() === 'available';
                if (avail) active++;
            });
            document.getElementById('statActive').innerText = active;
        });
    }
</script>

</body>
</html>
