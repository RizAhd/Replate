<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Login - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        body {
            background-color: var(--primary-color);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <div class="mb-4">
        <i class="fas fa-utensils fa-3x" style="color: var(--primary-color)"></i>
        <h2 class="mt-2 fw-bold" style="color: var(--primary-color)">REPLATE</h2>
        <p class="text-secondary">Hotel Partner Login</p>
    </div>

    <form id="loginForm">
        <div class="mb-3 text-start">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary btn-lg">LOGIN</button>
        </div>
        <p class="mb-0">New here? <a href="register.html" style="color: var(--primary-color)">Register Hotel</a></p>
    </form>
</div>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const uid = userCredential.user.uid;

            // Check if user is a hotel
            const snapshot = await database.ref('hotels/' + uid).once('value');
            if (snapshot.exists()) {
                const hotel = snapshot.val();
                if (hotel.status === 'approved') {
                    window.location.href = "dashboard.html";
                } else if (hotel.status === 'pending') {
                    alert("Your account is pending approval. Please wait for admin verification.");
                    auth.signOut();
                } else if (hotel.status === 'rejected') {
                    alert("Your account was rejected. Reason: " + (hotel.rejectionReason || "Criteria not met"));
                    auth.signOut();
                } else {
                    window.location.href = "dashboard.html";
                }
            } else {
                alert("No hotel account found with this email.");
                auth.signOut();
            }
        } catch (error) {
            alert(error.message);
        }
    });
</script>

</body>
</html>
