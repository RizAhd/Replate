<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Hotel Login - REPLATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body class="auth-page">

<div class="auth-card text-center">
    <div class="mb-4">
        <img src="../assets/replate-logo.svg" alt="REPLATE" class="brand-logo-auth">
        <h2 class="auth-title">REPLATE</h2>
        <p class="auth-subtext mb-0">Hotel Partner Login</p>
    </div>

    <form id="loginForm">
        <div class="mb-3 text-start">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="hotel@email.com" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label">Password</label>
            <div class="input-with-icon">
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
                    <i class="fas fa-eye" id="togglePasswordIcon"></i>
                </button>
            </div>
        </div>

        <div class="auth-links-row mb-3">
            <a href="#" class="auth-link" id="forgotPasswordLink">Forgot password?</a>
            <span class="text-secondary small">Need admin approval first</span>
        </div>

        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary btn-lg" id="btnLogin">LOGIN</button>
        </div>

        <!-- Divider -->
        <div class="d-flex align-items-center mb-3">
            <hr class="flex-grow-1">
            <span class="mx-2 text-secondary small">or</span>
            <hr class="flex-grow-1">
        </div>

        <!-- Google Sign-In -->
        <div class="d-grid mb-3">
            <button type="button" class="btn btn-outline-secondary" id="btnGoogleLogin" style="display:flex;align-items:center;justify-content:center;gap:10px;">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                Continue with Google
            </button>
        </div>

        <p class="mb-0">New here? <a href="register.html" class="fw-semibold">Register Hotel</a></p>
    </form>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    ReplateUI.attachPasswordToggle('password', 'togglePassword', 'togglePasswordIcon');

    document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        if (!email) {
            alert('Enter your hotel email first, then click Forgot password.');
            return;
        }

        try {
            await auth.sendPasswordResetEmail(email);
            alert('Password reset link sent. Please check your email inbox.');
        } catch (error) {
            alert(error.message || 'Could not send reset email.');
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        ReplateUI.setButtonLoading('btnLogin', true, 'Signing in...');

        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const uid = userCredential.user.uid;

            const hotelRecord = await ReplateSchema.findHotelByUserId(database, uid);
            if (!hotelRecord) {
                alert("No hotel account found with this email.");
                await auth.signOut();
                return;
            }

            sessionStorage.setItem('hotelId', hotelRecord.key);
            const status = ReplateSchema.normalizeHotelStatus(hotelRecord.value?.status);

            if (status === 'approved') {
                window.location.href = "dashboard.html";
            } else if (status === 'pending') {
                alert("Your account is pending approval. Please wait for admin verification.");
                await auth.signOut();
            } else {
                alert("Your account was rejected. Reason: " + (hotelRecord.value?.rejectionReason || "Criteria not met"));
                await auth.signOut();
            }
        } catch (error) {
            alert(error.message);
        } finally {
            ReplateUI.setButtonLoading('btnLogin', false);
        }
    });

    // Google Sign-In handler
    document.getElementById('btnGoogleLogin').addEventListener('click', async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        const btn = document.getElementById('btnGoogleLogin');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        try {
            const result = await auth.signInWithPopup(provider);
            const uid = result.user.uid;

            const hotelRecord = await ReplateSchema.findHotelByUserId(database, uid);
            if (!hotelRecord) {
                alert("No hotel account found linked to this Google account. Please register first or use your email and password.");
                await auth.signOut();
                return;
            }

            sessionStorage.setItem('hotelId', hotelRecord.key);
            const status = ReplateSchema.normalizeHotelStatus(hotelRecord.value?.status);

            if (status === 'approved') {
                window.location.href = "dashboard.html";
            } else if (status === 'pending') {
                alert("Your account is pending approval. Please wait for admin verification.");
                await auth.signOut();
            } else {
                alert("Your account was rejected. Reason: " + (hotelRecord.value?.rejectionReason || "Criteria not met"));
                await auth.signOut();
            }
        } catch (error) {
            if (error.code !== 'auth/popup-closed-by-user') {
                alert(error.message || "Google sign-in failed. Please try again.");
            }
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z"/></svg> Continue with Google`;
        }
    });
</script>

</body>
</html>
