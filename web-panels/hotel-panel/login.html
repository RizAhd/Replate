<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Login - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

<div class="auth-card text-center">
    <div class="mb-4">
        <i class="fas fa-utensils fa-3x auth-logo"></i>
        <h2 class="auth-title">REPLATE</h2>
        <p class="text-secondary mb-0">Hotel Partner Login</p>
    </div>

    <form id="loginForm">
        <div class="mb-3 text-start">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" placeholder="hotel@email.com" required>
        </div>
        <div class="mb-4 text-start">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
        <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary btn-lg">LOGIN</button>
        </div>
        <p class="mb-0">New here? <a href="register.html" class="fw-semibold">Register Hotel</a></p>
    </form>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const uid = userCredential.user.uid;

            const hotelRecord = await ReplateSchema.findHotelByUserId(database, uid);
            if (!hotelRecord) {
                alert("No hotel account found with this email.");
                await auth.signOut();
                return;
            }

            sessionStorage.setItem('hotelId', hotelRecord.key);
            const status = ReplateSchema.normalizeHotelStatus(hotelRecord.value?.status);

            if (status === 'approved') {
                window.location.href = "dashboard.html";
            } else if (status === 'pending') {
                alert("Your account is pending approval. Please wait for admin verification.");
                await auth.signOut();
            } else {
                alert("Your account was rejected. Reason: " + (hotelRecord.value?.rejectionReason || "Criteria not met"));
                await auth.signOut();
            }
        } catch (error) {
            alert(error.message);
        }
    });
</script>

</body>
</html>
