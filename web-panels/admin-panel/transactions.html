<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Transactions - REPLATE Admin - REPLATE food rescue.">
    <meta name="theme-color" content="#1a6b3c">
    <meta name="robots" content="noindex, nofollow">
    <title>Transactions - REPLATE Admin</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">All Transactions</h1>
                    <p class="panel-subtitle mb-0">Review payments, order status, and activity across all hotels.</p>
                </div>
            </div>

            <div class="card data-panel p-3">
                <div class="table-responsive">
                    <table id="transactionsTable" class="table table-striped align-middle table-stack" style="width:100%">
                        <thead>
                            <tr>
                                <th>Order ID</th>
                                <th>Date</th>
                                <th>Customer</th>
                                <th>Hotel</th>
                                <th>Amount</th>
                                <th>Review</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/admin-shell-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>

    auth.onAuthStateChanged((user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">ADMIN',
            activeKey: 'transactions',
            links: adminShellLinks,
        });
        if (user) loadTransactions();
    });

    function loadTransactions() {
        database.ref('orders').on('value', (snapshot) => {
            const tbody = document.getElementById('tableBody');

            const rows = [];
            snapshot.forEach((child) => {
                const order = child.val() || {};
                const date  = order.createdAt
                    ? new Date(order.createdAt).toLocaleString() : 'N/A';
                const status    = ReplateSchema.normalizeOrderStatus(order.orderStatus);
                const bgClass   = ReplateSchema.statusBgClass(status);
                const label     = ReplateSchema.statusLabel(status);
                const amount    = ReplateSchema.formatAmount(order.totalAmount);
                const displayId = ReplateSchema.shortOrderId(order, child.key);

                rows.push(`
                    <tr>
                        <td data-label="Order ID"><code>#${displayId}</code></td>
                        <td data-label="Date">${date}</td>
                        <td data-label="Customer">${order.customerName || '—'}</td>
                        <td data-label="Hotel">${order.hotelName || '—'}</td>
                        <td data-label="Amount">LKR ${amount}</td>
                        <td data-label="Review">${order.reviewRating ? `⭐ ${Number(order.reviewRating).toFixed(1)}` : '<span class="text-muted">—</span>'}</td>
                        <td data-label="Status"><span class="badge ${bgClass}">${label}</span></td>
                    </tr>`);
            });

            tbody.innerHTML = rows.join('') || '<tr><td colspan="7" class="text-center text-muted py-4">No transactions yet</td></tr>';

            if ($.fn.DataTable.isDataTable('#transactionsTable')) {
                $('#transactionsTable').DataTable().destroy();
            }
            $('#transactionsTable').DataTable({
                pageLength: 25,
                order: [[1, 'desc']],
                autoWidth: false,
                scrollX: true
            });
        });
    }
</script>
</body>
</html>
