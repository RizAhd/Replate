<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Transactions - REPLATE Admin - REPLATE food rescue.">
    <meta name="theme-color" content="#f3f4f6">
    <meta name="robots" content="noindex, nofollow">
    <title>Transactions - REPLATE Admin</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="page-header">
                <div>
                    <h1 class="panel-title">All Transactions</h1>
                    <p class="panel-subtitle">Review payments, order status, and activity across all hotels.</p>
                </div>
            </div>

            <div class="card card-body">
                <!-- Filters -->
                <div class="row g-2 mb-2">
                    <div class="col-6 col-md-3">
                        <label for="statusFilter" class="form-label small mb-1">Status</label>
                        <select id="statusFilter" name="statusFilter" class="form-select form-select-sm" autocomplete="off">
                            <option value="">All statuses</option>
                            <option value="open">Pending (not finished)</option>
                            <option value="completed">Completed / delivered</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3">
                        <label for="hotelFilter" class="form-label small mb-1">Hotel</label>
                        <select id="hotelFilter" name="hotelFilter" class="form-select form-select-sm" autocomplete="off">
                            <option value="">All hotels</option>
                        </select>
                    </div>
                    <div class="col-6 col-md-3">
                        <label for="fromDate" class="form-label small mb-1">From</label>
                        <input type="date" id="fromDate" name="fromDate" class="form-control form-control-sm" autocomplete="off">
                    </div>
                    <div class="col-6 col-md-3">
                        <label for="toDate" class="form-label small mb-1">To</label>
                        <input type="date" id="toDate" name="toDate" class="form-control form-control-sm" autocomplete="off">
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                    <p id="summary" class="small text-muted mb-0" role="status"></p>
                    <button type="button" class="btn btn-sm btn-outline-primary" id="exportTransactions"><i class="fas fa-download me-1" aria-hidden="true"></i>Export CSV</button>
                </div>

                <div class="table-responsive">
                    <table id="transactionsTable" class="table table-striped align-middle table-stack" style="width:100%">
                                <caption class="visually-hidden">Orders and payments</caption>
                        <thead>
                            <tr>
                                <th scope="col">Order ID</th>
                                <th scope="col">Date</th>
                                <th scope="col">Customer</th>
                                <th scope="col">Hotel</th>
                                <th scope="col">Items</th>
                                <th scope="col">Amount</th>
                                <th scope="col">Payment</th>
                                <th scope="col">Review</th>
                                <th scope="col">Status</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/admin-shell-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    // Admin page listing the latest orders and payments, with filters and CSV export.
    const esc = ReplateUI.esc;
    const MAX_ROWS = 500; // newest first; keeps the page quick as the order history grows
    const COLUMNS = 9;
    let ordersByKey = {}; // order key -> order, for the CSV export

    // Waits for an admin sign-in, then loads the orders.
    (async () => {
        const user = await ReplateUI.requireRole('admin');
        if (!user) return;
        document.getElementById('tableBody').innerHTML =
            '<tr><td colspan="' + COLUMNS + '">' + ReplateUI.skeleton('rows', 5) + '</td></tr>';
        document.getElementById('exportTransactions').addEventListener('click', exportTransactions);
        loadTransactions();
    })();

    // Exports the rows the filters and search box currently show
    function exportTransactions() {
        if (!$.fn.DataTable.isDataTable('#transactionsTable')) { ReplateUI.toast('There are no transactions to export.', 'warning'); return; }
        const rows = $('#transactionsTable').DataTable().rows({ search: 'applied' }).nodes().toArray()
            .map((tr) => Object.assign({ key: tr.dataset.key }, ordersByKey[tr.dataset.key])).filter((r) => r.key);
        if (rows.length === 0) { ReplateUI.toast('There are no transactions to export.', 'warning'); return; }
        const csv = ReplateSchema.toCsv(rows, [
            { label: 'Order ID', get: (o) => ReplateSchema.shortOrderId(o, o.key) },
            { label: 'Date', get: (o) => o.createdAt ? new Date(Number(o.createdAt)).toISOString() : '' },
            { label: 'Customer', get: (o) => o.customerName || '' },
            { label: 'Hotel', get: (o) => o.hotelName || '' },
            { label: 'Items', get: (o) => ReplateSchema.extractItemNames(o) },
            { label: 'Amount (LKR)', get: (o) => ReplateSchema.formatAmount(o.totalAmount || o.totalPrice) },
            { label: 'Payment method', get: (o) => o.paymentMethod || '' },
            { label: 'Payment status', get: (o) => o.paymentStatus || '' },
            { label: 'Review rating', get: (o) => Number(o.reviewRating) > 0 ? Number(o.reviewRating) : '' },
            { label: 'Status', get: (o) => ReplateSchema.statusLabel(o.orderStatus) }
        ]);
        ReplateUI.downloadCsv('replate-transactions.csv', csv);
    }

    // ── Filters (on top of the search box) ──────────────────
    function dayStart(value) { return value ? new Date(value + 'T00:00:00').getTime() : null; }
    // End of the chosen day as a time number.
    function dayEnd(value) { return value ? new Date(value + 'T23:59:59.999').getTime() : null; }

    $.fn.dataTable.ext.search.push((settings, data, dataIndex) => {
        if (settings.nTable.id !== 'transactionsTable') return true;
        const row = settings.aoData[dataIndex].nTr;
        if (!row) return true;

        const status = document.getElementById('statusFilter').value;
        const hotel = document.getElementById('hotelFilter').value;
        const from = dayStart(document.getElementById('fromDate').value);
        const to = dayEnd(document.getElementById('toDate').value);
        const ts = Number(row.dataset.ts) || 0;

        if (status && row.dataset.state !== status) return false;
        if (hotel && row.dataset.hotel !== hotel) return false;
        if (from !== null && ts < from) return false;
        if (to !== null && ts > to) return false;
        return true;
    });

    ['statusFilter', 'hotelFilter', 'fromDate', 'toDate'].forEach((id) => {
        document.getElementById(id).addEventListener('change', () => {
            if ($.fn.DataTable.isDataTable('#transactionsTable')) $('#transactionsTable').DataTable().draw();
        });
    });

    // Updates the totals above the table for the rows shown.
    function updateSummary(table) {
        const nodes = table.rows({ search: 'applied' }).nodes().toArray();
        let earned = 0;
        nodes.forEach((tr) => { earned += Number(tr.dataset.earned) || 0; });
        document.getElementById('summary').textContent = ReplateSchema.plural(nodes.length, 'order') +
            ' shown. Completed revenue in this view: ' + ReplateSchema.formatMoney(earned);
    }

    // Refills the hotel drop-down with the hotel names.
    function refreshHotelFilter(names) {
        const select = document.getElementById('hotelFilter');
        const current = select.value;
        select.innerHTML = '<option value="">All hotels</option>' + names.map((n) =>
            `<option value="${esc(n)}">${esc(n)}</option>`).join('');
        if (names.includes(current)) select.value = current;
    }

    // Builds the payment column text for an order (a completed cash order counts as paid).
    function paymentCell(order) {
        const method = String(order.paymentMethod || '—');
        const view = ReplateSchema.paymentView(order);
        return `<span class="nowrap">${esc(method)}</span><br><span class="badge ${view.cls}">${esc(view.label)}</span>`;
    }

    // Listens for the latest orders and redraws the table.
    function loadTransactions() {
        database.ref('orders').orderByChild('createdAt').limitToLast(MAX_ROWS).on('value', (snapshot) => {
            const tbody = document.getElementById('tableBody');
            const hotels = new Set();

            const rows = [];
            ordersByKey = {};
            snapshot.forEach((child) => {
                const order = child.val() || {};
                ordersByKey[child.key] = order;
                const date = ReplateSchema.formatDateTime(order.createdAt);
                const status = ReplateSchema.normalizeOrderStatus(order.orderStatus);
                const label = ReplateSchema.statusLabel(status);
                const amount = ReplateSchema.formatMoney(ReplateSchema.orderAmount(order));
                const displayId = ReplateSchema.shortOrderId(order, child.key);
                const rating = Number(order.reviewRating);
                const hotelName = order.hotelName || '—';
                hotels.add(hotelName);

                const state = ReplateSchema.isSuccessfulOrder(order) ? 'completed'
                    : ReplateSchema.isCancelledOrder(order) ? 'cancelled' : 'open';
                const earned = state === 'completed' ? ReplateSchema.orderAmount(order) : 0;

                rows.push(`
                    <tr data-key="${esc(child.key)}" data-ts="${esc(order.createdAt || 0)}" data-state="${state}" data-hotel="${esc(hotelName)}" data-earned="${earned}">
                        <td data-label="Order ID"><code>#${esc(displayId)}</code></td>
                        <td data-label="Date" class="num" data-order="${esc(order.createdAt || 0)}">${esc(date)}</td>
                        <td data-label="Customer">${esc(order.customerName || '—')}</td>
                        <td data-label="Hotel">${esc(hotelName)}</td>
                        <td class="cell-wide" data-label="Items">${esc(ReplateSchema.extractItemNames(order))}</td>
                        <td data-label="Amount" class="num" data-order="${esc(ReplateSchema.orderAmount(order))}">${esc(amount)}</td>
                        <td data-label="Payment">${paymentCell(order)}</td>
                        <td data-label="Review">${rating > 0 ? `<span class="rating"><i class="fas fa-star" aria-hidden="true"></i>${rating.toFixed(1)}</span>` : '<span class="text-muted" aria-label="No review">—</span>'}</td>
                        <td data-label="Status"><span class="badge ${esc(ReplateSchema.statusBadgeClass(status))}">${esc(label)}</span></td>
                    </tr>`);
            });

            // Redraw in place, keeping the search text and page the admin was on
            let previous = null;
            if ($.fn.DataTable.isDataTable('#transactionsTable')) {
                const existing = $('#transactionsTable').DataTable();
                previous = { search: existing.search(), page: existing.page() };
                existing.destroy();
            }

            refreshHotelFilter(Array.from(hotels).sort());

            if (rows.length === 0) {
                tbody.innerHTML = '<tr><td colspan="' + COLUMNS + '">' +
                    ReplateUI.emptyState('No transactions yet', 'Orders will appear here as customers place them.', 'fa-receipt') + '</td></tr>';
                document.getElementById('summary').textContent = '';
                return;
            }

            tbody.innerHTML = rows.reverse().join('');
            const table = $('#transactionsTable').DataTable({
                pageLength: 25,
                order: [[1, 'desc']],
                autoWidth: false
            });
            table.on('draw', () => updateSummary(table));
            if (previous) table.search(previous.search).page(previous.page).draw(false);
            else updateSummary(table);
        }, (error) => {
            console.error('Could not load transactions', error);
            document.getElementById('tableBody').innerHTML =
                '<tr><td colspan="' + COLUMNS + '">' + ReplateUI.errorState('Transactions could not be loaded. Check your admin access and connection.') + '</td></tr>';
        });
    }
</script>
</body>
</html>
