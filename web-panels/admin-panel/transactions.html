<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - REPLATE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar (Same as approve-hotels) -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse bg-dark text-white">
            <div class="position-sticky pt-3">
                <a class="navbar-brand d-block px-3 py-3 mb-3 text-center text-white" href="#">👑 ADMIN</a>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="approve-hotels.html">🏨 Approve Hotels</a></li>
                    <li class="nav-item"><a class="nav-link text-white active" href="transactions.html">💰 Transactions</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="categories.html">🏷️ Categories</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="analytics.html">📊 Analytics</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" onclick="logout()">🚪 Logout</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4">All Transactions</h2>

            <div class="card p-3">
                <table id="transactionsTable" class="table table-striped" style="width:100%">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Date</th>
                            <th>Customer</th>
                            <th>Hotel</th>
                            <th>Amount</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
    auth.onAuthStateChanged((user) => {
        if (user) loadTransactions();
    });

    function loadTransactions() {
        database.ref('orders').on('value', (snapshot) => {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            snapshot.forEach((child) => {
                const order = child.val();
                // Format date safely
                const date = order.createdAt ? new Date(order.createdAt).toLocaleDateString() : 'N/A';

                const row = `
                    <tr>
                        <td>${order.qrCode || child.key}</td>
                        <td>${date}</td>
                        <td>${order.customerName}</td>
                        <td>${order.hotelName}</td>
                        <td>LKR ${order.totalAmount}</td>
                        <td>
                            <span class="badge bg-${order.orderStatus === 'completed' ? 'success' : 'warning'}">
                                ${order.orderStatus}
                            </span>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

            // Initialize DataTable
            if ($.fn.DataTable.isDataTable('#transactionsTable')) {
                $('#transactionsTable').DataTable().destroy();
            }
            $('#transactionsTable').DataTable();
        });
    }
</script>
</body>
</html>
