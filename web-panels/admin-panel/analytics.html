<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - REPLATE Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse bg-dark text-white">
            <div class="position-sticky pt-3">
                <a class="navbar-brand d-block px-3 py-3 mb-3 text-center text-white" href="#">👑 ADMIN</a>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="approve-hotels.html">🏨 Approve Hotels</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="transactions.html">💰 Transactions</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="categories.html">🏷️ Categories</a></li>
                    <li class="nav-item"><a class="nav-link text-white active" href="analytics.html">📊 Analytics</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" onclick="logout()">🚪 Logout</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4">Platform Analytics</h2>

            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card p-3 bg-success text-white">
                        <h6>Total Revenue</h6>
                        <h3 id="totalRevenue">LKR 0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 bg-primary text-white">
                        <h6>Total Orders</h6>
                        <h3 id="totalOrders">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 bg-warning text-dark">
                        <h6>Food Saved (kg)</h6>
                        <h3 id="foodSaved">0 kg</h3>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card p-3 mb-4">
                        <h5>Platform Growth (Orders)</h5>
                        <canvas id="growthChart"></canvas>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 mb-4">
                        <h5>Order Status</h5>
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 mb-4">
                        <h5>Payment Methods</h5>
                        <canvas id="paymentChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
    auth.onAuthStateChanged((user) => {
        if (user) loadAdminAnalytics();
    });

    function loadAdminAnalytics() {
        database.ref('orders').on('value', (snapshot) => {
            let revenue = 0;
            let total = 0;
            let completed = 0, pending = 0, cancelled = 0;
            let cash = 0, online = 0;

            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    const order = child.val();
                    total++;

                    // Status Stats
                    if (order.orderStatus === 'completed') {
                        revenue += parseFloat(order.totalAmount || 0);
                        completed++;
                    } else if (order.orderStatus === 'pending') {
                        pending++;
                    } else {
                        cancelled++;
                    }

                    // Payment Stats
                    const method = order.paymentMethod || "Cash";
                    if (method.toLowerCase().includes("cash")) cash++;
                    else online++;
                });
            }

            document.getElementById('totalRevenue').innerText = 'LKR ' + revenue.toLocaleString();
            document.getElementById('totalOrders').innerText = total;
            document.getElementById('foodSaved').innerText = (completed * 0.5) + ' kg';

            // Status Chart (Doughnut)
            new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Completed', 'Pending', 'Cancelled'],
                    datasets: [{
                        data: [completed, pending, cancelled],
                        backgroundColor: ['#2E7D32', '#FFC107', '#C62828']
                    }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            // Payment Chart (Pie)
            new Chart(document.getElementById('paymentChart'), {
                type: 'pie',
                data: {
                    labels: ['Cash', 'Online (PayHere)'],
                    datasets: [{
                        data: [cash, online],
                        backgroundColor: ['#4CAF50', '#2196F3']
                    }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            // Growth Chart (Line)
            new Chart(document.getElementById('growthChart'), {
                type: 'line',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                    datasets: [{
                        label: 'Orders',
                        data: [120, 150, 200, total], // Using total as last point for dynamic feel
                        borderColor: '#2E7D32',
                        fill: true
                    }]
                }
            });
        });
    }
</script>
</body>
</html>
