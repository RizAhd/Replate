<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - REPLATE Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main>
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Platform Analytics</h1>
                    <p class="panel-subtitle mb-0">Real-time insights from your platform data.</p>
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="stat-card card p-3">
                        <h6><i class="fas fa-dollar-sign me-1 text-success"></i>Total Revenue</h6>
                        <h3 id="totalRevenue">LKR 0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card card p-3">
                        <h6><i class="fas fa-receipt me-1 text-primary"></i>Total Orders</h6>
                        <h3 id="totalOrders">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card card p-3">
                        <h6><i class="fas fa-users me-1 text-info"></i>Total Customers</h6>
                        <h3 id="totalCustomers">0</h3>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="stat-card card p-3">
                        <h6><i class="fas fa-leaf me-1 text-warning"></i>Food Saved (kg)</h6>
                        <h3 id="foodSaved">0 kg</h3>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card p-3 mb-4">
                        <h5>Platform Growth (Orders per Week)</h5>
                        <canvas id="growthChart"></canvas>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 mb-4">
                        <h5>Order Status</h5>
                        <canvas id="statusChart"></canvas>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card p-3 mb-4">
                        <h5>Payment Methods</h5>
                        <canvas id="paymentChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="card p-3 mb-4">
                        <h5>Revenue Trend (Weekly)</h5>
                        <canvas id="revenueChart"></canvas>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card p-3 mb-4">
                        <h5>Top Hotels by Orders</h5>
                        <canvas id="topHotelsChart"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    const adminShellLinks = [
        { key: 'approve-hotels', href: 'approve-hotels.html', icon: 'fas fa-hotel', label: 'Approve Hotels' },
        { key: 'transactions', href: 'transactions.html', icon: 'fas fa-money-bill-wave', label: 'Transactions' },
        { key: 'categories', href: 'categories.html', icon: 'fas fa-tags', label: 'Categories' },
        { key: 'analytics', href: 'analytics.html', icon: 'fas fa-chart-line', label: 'Analytics' },
        { key: 'notifications', href: 'notifications.html', icon: 'fas fa-bell', label: 'Notifications' },
        { key: 'logout', href: '#', icon: 'fas fa-sign-out-alt', label: 'Logout', logout: true }
    ];

    let growthChartInstance = null;
    let statusChartInstance = null;
    let paymentChartInstance = null;
    let revenueChartInstance = null;
    let topHotelsChartInstance = null;

    auth.onAuthStateChanged((user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">ADMIN',
            activeKey: 'analytics',
            links: adminShellLinks,
        });
        if (!user) {
            window.location.href = 'login.html';
            return;
        }
        loadAdminAnalytics();
        loadCustomerCount();
    });

    function getWeekKey(timestamp) {
        const d = new Date(timestamp);
        const oneJan = new Date(d.getFullYear(), 0, 1);
        const weekNum = Math.ceil(((d - oneJan) / 86400000 + oneJan.getDay() + 1) / 7);
        return d.getFullYear() + '-W' + String(weekNum).padStart(2, '0');
    }

    function getWeekLabel(weekKey) {
        const [year, week] = weekKey.split('-W');
        return 'W' + parseInt(week) + ' ' + year;
    }

    function loadCustomerCount() {
        database.ref('users').once('value', (snapshot) => {
            let count = 0;
            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    const u = child.val() || {};
                    const role = (u.role || u.userType || 'customer').toLowerCase();
                    if (role === 'customer') count++;
                });
            }
            document.getElementById('totalCustomers').innerText = count;
        });
    }

    function loadAdminAnalytics() {
        database.ref('orders').on('value', (snapshot) => {
            let revenue = 0, total = 0;
            let completed = 0, pending = 0, cancelled = 0, other = 0;
            let cash = 0, online = 0;
            const weeklyOrders = {};
            const weeklyRevenue = {};
            const hotelOrders = {};

            if (snapshot.exists()) {
                snapshot.forEach(child => {
                    const order = child.val();
                    total++;

                    const ts = order.createdAt || order.timestamp || Date.now();
                    const wk = getWeekKey(ts);
                    weeklyOrders[wk] = (weeklyOrders[wk] || 0) + 1;

                    const hName = order.hotelName || 'Unknown';
                    hotelOrders[hName] = (hotelOrders[hName] || 0) + 1;

                    const status = (order.orderStatus || '').toLowerCase();
                    if (status === 'completed' || status === 'delivered') {
                        revenue += parseFloat(order.totalAmount || 0);
                        completed++;
                        weeklyRevenue[wk] = (weeklyRevenue[wk] || 0) + parseFloat(order.totalAmount || 0);
                    } else if (status.includes('pending')) {
                        pending++;
                    } else if (status === 'cancelled') {
                        cancelled++;
                    } else {
                        other++;
                        if (status === 'confirmed' || status === 'ready') {
                            revenue += parseFloat(order.totalAmount || 0);
                            weeklyRevenue[wk] = (weeklyRevenue[wk] || 0) + parseFloat(order.totalAmount || 0);
                        }
                    }

                    const method = order.paymentMethod || "Cash";
                    if (method.toLowerCase().includes("cash")) cash++;
                    else online++;
                });
            }

            document.getElementById('totalRevenue').innerText = 'LKR ' + revenue.toLocaleString();
            document.getElementById('totalOrders').innerText = total;
            document.getElementById('foodSaved').innerText = (completed * 0.5).toFixed(1) + ' kg';

            const sortedWeeks = Object.keys(weeklyOrders).sort();
            const recentWeeks = sortedWeeks.slice(-8);
            const weekLabels = recentWeeks.map(getWeekLabel);
            const weekData = recentWeeks.map(w => weeklyOrders[w] || 0);
            const weekRevenueData = recentWeeks.map(w => weeklyRevenue[w] || 0);

            if (statusChartInstance) statusChartInstance.destroy();
            if (paymentChartInstance) paymentChartInstance.destroy();
            if (growthChartInstance) growthChartInstance.destroy();
            if (revenueChartInstance) revenueChartInstance.destroy();
            if (topHotelsChartInstance) topHotelsChartInstance.destroy();

            statusChartInstance = new Chart(document.getElementById('statusChart'), {
                type: 'doughnut',
                data: {
                    labels: ['Completed', 'Pending', 'Cancelled', 'Other'],
                    datasets: [{ data: [completed, pending, cancelled, other], backgroundColor: ['#1a6b3c', '#FFC107', '#C62828', '#9E9E9E'] }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            paymentChartInstance = new Chart(document.getElementById('paymentChart'), {
                type: 'pie',
                data: {
                    labels: ['Cash', 'Online (PayHere)'],
                    datasets: [{ data: [cash, online], backgroundColor: ['#1a6b3c', '#2196F3'] }]
                },
                options: { plugins: { legend: { position: 'bottom' } } }
            });

            growthChartInstance = new Chart(document.getElementById('growthChart'), {
                type: 'line',
                data: {
                    labels: weekLabels.length > 0 ? weekLabels : ['No data'],
                    datasets: [{ label: 'Orders', data: weekData.length > 0 ? weekData : [0], borderColor: '#1a6b3c', backgroundColor: 'rgba(26, 107, 60, 0.1)', fill: true, tension: 0.3 }]
                },
                options: { scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } }
            });

            revenueChartInstance = new Chart(document.getElementById('revenueChart'), {
                type: 'bar',
                data: {
                    labels: weekLabels.length > 0 ? weekLabels : ['No data'],
                    datasets: [{ label: 'Revenue (LKR)', data: weekRevenueData.length > 0 ? weekRevenueData : [0], backgroundColor: 'rgba(26, 107, 60, 0.6)', borderColor: '#1a6b3c', borderWidth: 1, borderRadius: 6 }]
                },
                options: { scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
            });

            const sortedHotels = Object.entries(hotelOrders).sort((a, b) => b[1] - a[1]).slice(0, 5);
            topHotelsChartInstance = new Chart(document.getElementById('topHotelsChart'), {
                type: 'bar',
                data: {
                    labels: sortedHotels.map(h => h[0]),
                    datasets: [{ label: 'Orders', data: sortedHotels.map(h => h[1]), backgroundColor: ['#1a6b3c', '#25a55a', '#e8521a', '#FFC107', '#2196F3'], borderRadius: 6 }]
                },
                options: { indexAxis: 'y', scales: { x: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } }
            });
        });
    }
</script>
</body>
</html>
