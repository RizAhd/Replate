<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">

<div class="auth-card text-center">
    <div class="mb-4">
        <i class="fas fa-crown fa-3x auth-logo"></i>
        <h3 class="auth-title">Admin Panel</h3>
        <p class="text-secondary mb-0">Super Admin Access Only</p>
    </div>

    <form id="loginForm">
        <label for="email" class="visually-hidden">Admin Email</label>
        <input type="email" class="form-control mb-3" id="email" placeholder="admin@replate.com" required>

        <label for="password" class="visually-hidden">Password</label>
        <div class="input-with-icon mb-4">
            <input type="password" class="form-control" id="password" placeholder="Password" required>
            <button type="button" class="password-toggle" id="toggleAdminPassword" aria-label="Show password">
                <i class="fas fa-eye" id="toggleAdminPasswordIcon"></i>
            </button>
        </div>

        <button type="submit" class="btn btn-primary w-100" id="btnAdminLogin">LOGIN</button>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    const ADMIN_EMAILS = ['admin@replate.com', 'superadmin@replate.com'];
    ReplateUI.attachPasswordToggle('password', 'toggleAdminPassword', 'toggleAdminPasswordIcon');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!ADMIN_EMAILS.includes(email)) {
            alert('Access Denied: Not an admin email');
            return;
        }

        ReplateUI.setButtonLoading('btnAdminLogin', true, 'Signing in...');
        try {
            await auth.signInWithEmailAndPassword(email, password);
            window.location.href = 'approve-hotels.html';
        } catch (error) {
            alert(error.message);
        } finally {
            ReplateUI.setButtonLoading('btnAdminLogin', false);
        }
    });
</script>

</body>
</html>
