<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - REPLATE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1B5000; /* Dark Green */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

<div class="login-card text-center">
    <h3>👑 Admin Panel</h3>
    <p class="text-secondary mb-4">Super Admin Access Only</p>

    <form id="loginForm">
        <input type="email" class="form-control mb-3" id="email" placeholder="admin@replate.com" required>
        <input type="password" class="form-control mb-4" id="password" placeholder="Password" required>
        <button type="submit" class="btn btn-dark w-100">LOGIN</button>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
    const ADMIN_EMAILS = ['admin@replate.com', 'superadmin@replate.com'];

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!ADMIN_EMAILS.includes(email)) {
            alert("Access Denied: Not an admin email");
            return;
        }

        try {
            await auth.signInWithEmailAndPassword(email, password);
            window.location.href = "approve-hotels.html";
        } catch (error) {
            alert(error.message);
        }
    });
</script>

</body>
</html>
