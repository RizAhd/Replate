<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Admin Login - REPLATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body class="auth-page">

<div class="auth-card text-center">
    <div class="mb-4">
        <img src="../assets/replate-logo.svg" alt="REPLATE" class="brand-logo-auth">
        <h3 class="auth-title">Admin Panel</h3>
        <p class="text-secondary mb-0">Super Admin Access Only</p>
    </div>

    <form id="loginForm">
        <div class="mb-3 text-start">
            <label class="form-label" for="email">Admin Email</label>
            <input type="email" class="form-control" id="email" placeholder="admin@replate.com" required>
        </div>

        <div class="mb-4 text-start">
            <label class="form-label" for="password">Password</label>
            <div class="input-with-icon">
                <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                <button type="button" class="password-toggle" id="toggleAdminPassword" aria-label="Show password">
                    <i class="fas fa-eye" id="toggleAdminPasswordIcon"></i>
                </button>
            </div>
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg" id="btnAdminLogin">LOGIN</button>
        </div>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    const ADMIN_EMAILS = ['admin@replate.com', 'superadmin@replate.com'];
    ReplateUI.attachPasswordToggle('password', 'toggleAdminPassword', 'toggleAdminPasswordIcon');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!ADMIN_EMAILS.includes(email)) {
            alert('Access Denied: Not an admin email');
            return;
        }

        ReplateUI.setButtonLoading('btnAdminLogin', true, 'Signing in...');
        try {
            await auth.signInWithEmailAndPassword(email, password);
            window.location.href = 'approve-hotels.html';
        } catch (error) {
            alert(error.message);
        } finally {
            ReplateUI.setButtonLoading('btnAdminLogin', false);
        }
    });
</script>

</body>
</html>
