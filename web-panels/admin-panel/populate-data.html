<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Populate Mock Data - REPLATE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body>

<div class="container mt-5">
    <div class="card p-5 text-center">
        <h2>🛠️ Mock Data Tool</h2>
        <p>Populate your database with test hotels and food items around Nuwara Eliya & Haggala.</p>

        <div class="d-grid gap-3 col-md-6 mx-auto mt-4">
            <button class="btn btn-success btn-lg" onclick="populateNuwaraEliya()">
                🌲 Populate Nuwara Eliya Data
            </button>
            <button class="btn btn-warning btn-lg" onclick="clearData()">
                🗑️ Clear All Test Data
            </button>
        </div>

        <div id="status" class="mt-4 text-muted"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
    // Ensure admin is logged in (or just rely on rules if open)
    auth.onAuthStateChanged((user) => {
        if (!user) {
            document.getElementById('status').innerText = "⚠️ Please login to Admin Panel first!";
        } else {
            document.getElementById('status').innerText = "✅ Ready to populate data.";
        }
    });

    const NUWARA_ELIYA_HOTELS = [
        {
            id: "hotel_haggala_1",
            name: "Haggala Botanical Resort",
            lat: 6.9360,
            lng: 80.8124,
            address: "Haggala Gardens Road, Nuwara Eliya",
            owner: "Perera Resort",
            phone: "0771234567"
        },
        {
            id: "hotel_ne_town_1",
            name: "Grand Hotel Nuwara Eliya",
            lat: 6.9697,
            lng: 80.7691,
            address: "Grand Hotel Rd, Nuwara Eliya",
            owner: "Grand Circle",
            phone: "0522222888"
        },
        {
            id: "hotel_gregory_1",
            name: "Lake View Rest",
            lat: 6.9587,
            lng: 80.7770,
            address: "Gregory Lake Side, Nuwara Eliya",
            owner: "Lake Ent.",
            phone: "0718889999"
        }
    ];

    const SAMPLE_FOODS = [
        { name: "Strawberry Pancakes", price: 1200, discount: 600, img: "https://picsum.photos/seed/pancakes/500/400" },
        { name: "Warm Kottu Rotti", price: 1500, discount: 800, img: "https://picsum.photos/seed/kottu/500/400" },
        { name: "Vegetable Soup", price: 800, discount: 400, img: "https://picsum.photos/seed/soup/500/400" },
        { name: "Cheese Sandwiches", price: 900, discount: 450, img: "https://picsum.photos/seed/sandwich/500/400" }
    ];

    async function populateNuwaraEliya() {
        const btn = document.querySelector('button.btn-success');
        btn.disabled = true;
        btn.innerText = "⏳ Adding Data...";

        try {
            for (const hotel of NUWARA_ELIYA_HOTELS) {
                // 1. Add Hotel
                await database.ref('hotels/' + hotel.id).set({
                    hotelName: hotel.name,
                    ownerName: hotel.owner,
                    email: `admin+${hotel.id}@replate.com`,
                    phone: hotel.phone,
                    address: hotel.address,
                    latitude: hotel.lat,
                    longitude: hotel.lng,
                    status: "approved", // Auto-approved for test
                    license: "https://via.placeholder.com/150",
                    registeredAt: new Date().toISOString()
                });

                // 2. Add Foods for this Hotel
                for (let i = 0; i < 3; i++) {
                    const food = SAMPLE_FOODS[Math.floor(Math.random() * SAMPLE_FOODS.length)];
                    const foodId = `food_${hotel.id}_${i}`;

                    await database.ref('foodItems/' + foodId).set({
                        foodId: foodId,
                        hotelId: hotel.id,
                        hotelName: hotel.name,
                        foodName: food.name,
                        description: "Delicious leftover food rescued from " + hotel.name,
                        category: "Meals",
                        originalPrice: food.price,
                        discountedPrice: food.discount,
                        discountPercent: Math.round(((food.price - food.discount)/food.price)*100),
                        quantity: 5 + Math.floor(Math.random() * 10),
                        imageUrl: food.img,
                        pickupTimeStart: "18:00",
                        pickupTimeEnd: "22:00",
                        createdAt: firebase.database.ServerValue.TIMESTAMP,
                        isAvailable: true,
                        // Location data for map
                        latitude: hotel.lat,
                        longitude: hotel.lng,
                        hotelAddress: hotel.address
                    });
                }
            }

            document.getElementById('status').innerText = "✅ Successfully added Nuwara Eliya hotels & food!";
        } catch (error) {
            console.error(error);
            document.getElementById('status').innerText = "❌ Error: " + error.message;
        } finally {
            btn.disabled = false;
            btn.innerText = "🌲 Populate Nuwara Eliya Data";
        }
    }

    async function clearData() {
        if(confirm("Are you sure? This will delete all test hotels.")) {
            // Only delete hotels starting with 'hotel_'
            // Implementing specific deletion is safer than deleting entire nodes used in prod
            alert("To be safe, please delete manually from Firebase Console or implement specific ID logic.");
        }
    }
</script>

</body>
</html>
