<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Approve Hotels - REPLATE Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css"> <!-- Reusing Hotel CSS for consistency -->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main>
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Manage Hotel Registrations</h1>
                    <p class="panel-subtitle mb-0">Approve trusted partners and keep listing quality high.</p>
                </div>
            </div>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#pending">Pending</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#approved">Approved</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#rejected">Rejected</a></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="pending">
                    <div id="pendingList" class="row"></div>
                </div>
                <div class="tab-pane fade" id="approved">
                    <div id="approvedList" class="row"></div>
                </div>
                <div class="tab-pane fade" id="rejected">
                    <div id="rejectedList" class="row"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    const adminShellLinks = [
        { key: 'approve-hotels', href: 'approve-hotels.html', icon: 'fas fa-hotel', label: 'Approve Hotels' },
        { key: 'transactions', href: 'transactions.html', icon: 'fas fa-money-bill-wave', label: 'Transactions' },
        { key: 'categories', href: 'categories.html', icon: 'fas fa-tags', label: 'Categories' },
        { key: 'banners', href: 'banners.html', icon: 'fas fa-images', label: 'Banners' },
        { key: 'analytics', href: 'analytics.html', icon: 'fas fa-chart-line', label: 'Analytics' },
        { key: 'notifications', href: 'notifications.html', icon: 'fas fa-bell', label: 'Notifications' },
        { key: 'logout', href: '#', icon: 'fas fa-sign-out-alt', label: 'Logout', logout: true }
    ];

    auth.onAuthStateChanged((user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-logo.svg" alt="REPLATE" class="brand-logo-sm">ADMIN',
            activeKey: 'approve-hotels',
            links: adminShellLinks,
        });
        if (user) loadHotels();
    });

    function loadHotels() {
        database.ref('hotels').on('value', (snapshot) => {
            const pendingDiv = document.getElementById('pendingList');
            const approvedDiv = document.getElementById('approvedList');
            const rejectedDiv = document.getElementById('rejectedList');

            pendingDiv.innerHTML = '';
            approvedDiv.innerHTML = '';
            rejectedDiv.innerHTML = '';

            const pendingCards = [];
            const approvedCards = [];
            const rejectedCards = [];

            snapshot.forEach((child) => {
                const hotel = child.val() || {};
                const key = child.key;
                const card = createHotelCard(hotel, key);
                const status = (hotel.status || '').toLowerCase();

                if (status === 'pending') pendingCards.push(card);
                else if (status === 'approved') approvedCards.push(card);
                else if (status === 'rejected') rejectedCards.push(card);
            });

            pendingDiv.innerHTML = pendingCards.join('') || '<p class="text-muted">No pending hotels.</p>';
            approvedDiv.innerHTML = approvedCards.join('') || '<p class="text-muted">No approved hotels yet.</p>';
            rejectedDiv.innerHTML = rejectedCards.join('') || '<p class="text-muted">No rejected hotels.</p>';
        });
    }

    function createHotelCard(hotel, key) {
        let buttons = '';
        if ((hotel.status || '').toLowerCase() === 'pending') {
            buttons = `
                <button class="btn btn-success btn-sm w-100 mb-2" onclick="updateStatus('${key}', 'approved')">✅ Approve</button>
                <button class="btn btn-danger btn-sm w-100" onclick="rejectHotel('${key}')">❌ Reject</button>
            `;
        }

        const licenseUrl = hotel.licenseUrl || hotel.license || '#';
        const gps = (hotel.latitude && hotel.longitude)
            ? `<p class="small mb-2"><i class="fas fa-location-arrow"></i> ${hotel.latitude}, ${hotel.longitude}</p>`
            : '';

        return `
            <div class="col-md-6 col-xl-4 mb-4">
                <div class="card h-100 data-panel">
                    <div class="card-body">
                        <h5 class="mb-1">${hotel.hotelName || 'Hotel'}</h5>
                        <p class="small text-muted mb-2">Owner: ${hotel.ownerName || '-'}</p>
                        <p class="small mb-1"><i class="fas fa-envelope"></i> ${hotel.email || '-'}</p>
                        <p class="small mb-1"><i class="fas fa-phone"></i> ${hotel.phone || '-'}</p>
                        <p class="small mb-2"><i class="fas fa-map-marker-alt"></i> ${hotel.address || '-'}</p>
                        ${gps}
                        <a href="${licenseUrl}" target="_blank" class="btn btn-outline-dark btn-sm w-100 mb-3">📄 View License</a>
                        ${buttons}
                    </div>
                </div>
            </div>
        `;
    }

    window.updateStatus = function(key, status) {
        if (confirm(`Mark this hotel as ${status}?`)) {
            database.ref('hotels/' + key).update({ status: status });
        }
    }

    window.rejectHotel = function(key) {
        const reason = prompt('Reason for rejection:');
        if (reason) {
            database.ref('hotels/' + key).update({
                status: 'rejected',
                rejectionReason: reason
            });
        }
    }
</script>

</body>
</html>
