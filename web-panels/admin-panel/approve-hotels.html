<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approve Hotels - REPLATE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css"> <!-- Reusing Hotel CSS for consistency -->
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse bg-dark text-white">
            <div class="position-sticky pt-3">
                <a class="navbar-brand d-block px-3 py-3 mb-3 text-center text-white" href="#">
                    👑 ADMIN
                </a>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white active" href="approve-hotels.html">🏨 Approve Hotels</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="transactions.html">💰 Transactions</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="categories.html">🏷️ Categories</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="analytics.html">📊 Analytics</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" onclick="logout()">🚪 Logout</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4">Manage Hotel Registrations</h2>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#pending">Pending</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#approved">Approved</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#rejected">Rejected</a></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="pending">
                    <div id="pendingList" class="row"></div>
                </div>
                <div class="tab-pane fade" id="approved">
                    <div id="approvedList" class="row"></div>
                </div>
                <div class="tab-pane fade" id="rejected">
                    <div id="rejectedList" class="row"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
    auth.onAuthStateChanged((user) => {
        if (user) loadHotels();
    });

    function loadHotels() {
        database.ref('hotels').on('value', (snapshot) => {
            const pendingDiv = document.getElementById('pendingList');
            const approvedDiv = document.getElementById('approvedList');
            const rejectedDiv = document.getElementById('rejectedList');

            pendingDiv.innerHTML = '';
            approvedDiv.innerHTML = '';
            rejectedDiv.innerHTML = '';

            snapshot.forEach((child) => {
                const hotel = child.val();
                const key = child.key;
                const card = createHotelCard(hotel, key);

                if (hotel.status === 'pending') pendingDiv.innerHTML += card;
                else if (hotel.status === 'approved') approvedDiv.innerHTML += card;
                else if (hotel.status === 'rejected') rejectedDiv.innerHTML += card;
            });
        });
    }

    function createHotelCard(hotel, key) {
        let buttons = '';
        if (hotel.status === 'pending') {
            buttons = `
                <button class="btn btn-success btn-sm w-100 mb-2" onclick="updateStatus('${key}', 'approved')">✅ Approve</button>
                <button class="btn btn-danger btn-sm w-100" onclick="rejectHotel('${key}')">❌ Reject</button>
            `;
        }

        return `
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <div class="card-body">
                        <h5>${hotel.hotelName}</h5>
                        <p class="small text-muted mb-2"> Owner: ${hotel.ownerName}</p>
                        <p class="small mb-1"><i class="fas fa-envelope"></i> ${hotel.email}</p>
                        <p class="small mb-1"><i class="fas fa-phone"></i> ${hotel.phone}</p>
                        <p class="small mb-3"><i class="fas fa-map-marker-alt"></i> ${hotel.address}</p>
                        <a href="${hotel.license}" target="_blank" class="btn btn-outline-dark btn-sm w-100 mb-3">📄 View License</a>
                        ${buttons}
                    </div>
                </div>
            </div>
        `;
    }

    window.updateStatus = function(key, status) {
        if(confirm(`Mark this hotel as ${status}?`)) {
            database.ref('hotels/' + key).update({ status: status });
        }
    }

    window.rejectHotel = function(key) {
        const reason = prompt("Reason for rejection:");
        if (reason) {
            database.ref('hotels/' + key).update({
                status: 'rejected',
                rejectionReason: reason
            });
        }
    }
</script>

</body>
</html>
