<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Approve Hotels - REPLATE Admin - REPLATE food rescue.">
    <meta name="theme-color" content="#1a6b3c">
    <meta name="robots" content="noindex, nofollow">
    <title>Approve Hotels - REPLATE Admin</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css"> <!-- Reusing Hotel CSS for consistency -->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Manage Hotel Registrations</h1>
                    <p class="panel-subtitle mb-0">Approve trusted partners and keep listing quality high.</p>
                </div>
            </div>

            <ul class="nav nav-tabs mb-4">
                <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#pending">Pending</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#approved">Approved</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#rejected">Rejected</a></li>
                <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#suspended">Suspended</a></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="pending">
                    <div id="pendingList" class="row"></div>
                </div>
                <div class="tab-pane fade" id="approved">
                    <div id="approvedList" class="row"></div>
                </div>
                <div class="tab-pane fade" id="rejected">
                    <div id="rejectedList" class="row"></div>
                </div>
                <div class="tab-pane fade" id="suspended">
                    <div id="suspendedList" class="row"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/admin-shell-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    // Admin page to approve, reject or revoke hotels.
    const esc = ReplateUI.esc;
    const lists = {
        pending: document.getElementById('pendingList'),
        approved: document.getElementById('approvedList'),
        rejected: document.getElementById('rejectedList'),
        suspended: document.getElementById('suspendedList')
    };
    // hotelLicenses/{hotelKey}: the licence link is kept out of the openly readable hotels node
    let licenseUrls = {};

    // Shows placeholder cards while hotels load.
    function showLoading() {
        Object.values(lists).forEach((el) => { el.innerHTML = ReplateUI.skeleton('cards', 3); });
    }

    // Waits for an admin sign-in, then loads the hotels.
    (async () => {
        const user = await ReplateUI.requireRole('admin');
        if (!user) return;
        showLoading();
        loadHotels();
    })();

    // Listens for hotels and licence links and redraws the lists.
    function loadHotels() {
        let latestHotels = null;
        const render = () => { if (latestHotels) renderHotels(latestHotels); };

        database.ref('hotelLicenses').on('value', (snap) => {
            const urls = {};
            snap.forEach((child) => { urls[child.key] = (child.val() || {}).licenseUrl || ''; });
            licenseUrls = urls;
            render();
        }, (error) => console.error('Could not load licences', error));

        database.ref('hotels').on('value', (snapshot) => {
            latestHotels = snapshot;
            render();
        }, (error) => {
            console.error('Could not load hotels', error);
            Object.values(lists).forEach((el) => { el.innerHTML = ReplateUI.errorState('Hotels could not be loaded. Check your admin access and connection.'); });
        });
    }

    // Puts each hotel into its tab by status.
    function renderHotels(snapshot) {
        {
            // Hotels with a blank or older status (active, declined) still land in the right tab
            const cards = { pending: [], approved: [], rejected: [], suspended: [] };

            snapshot.forEach((child) => {
                const hotel = child.val() || {};
                const status = ReplateSchema.normalizeHotelStatus(hotel.status);
                cards[status].push(createHotelCard(hotel, child.key, status));
            });

            lists.pending.innerHTML = cards.pending.join('') || ReplateUI.emptyState('No pending hotels', 'New registrations will appear here for review.', 'fa-hourglass-half');
            lists.approved.innerHTML = cards.approved.join('') || ReplateUI.emptyState('No approved hotels yet', 'Approved partners are listed here.', 'fa-hotel');
            lists.rejected.innerHTML = cards.rejected.join('') || ReplateUI.emptyState('No rejected hotels', 'Declined registrations are listed here.', 'fa-circle-check');
            lists.suspended.innerHTML = cards.suspended.join('') || ReplateUI.emptyState('No suspended hotels', 'Suspend an account from the Users page and its hotel is listed here.', 'fa-circle-check');
        }
    }

    // Builds the card for one hotel.
    function createHotelCard(hotel, key, status) {
        let buttons = '';
        if (status === 'pending') {
            buttons = `<button class="btn btn-success btn-sm w-100 mb-2" data-action="approve" data-key="${esc(key)}"><i class="fas fa-check" aria-hidden="true"></i> Approve</button>
               <button class="btn btn-danger btn-sm w-100" data-action="reject" data-key="${esc(key)}"><i class="fas fa-xmark" aria-hidden="true"></i> Reject</button>`;
        } else if (status === 'approved') {
            buttons = `<button class="btn btn-outline-danger btn-sm w-100" data-action="revoke" data-key="${esc(key)}"><i class="fas fa-ban" aria-hidden="true"></i> Revoke approval</button>`;
        } else if (status === 'rejected') {
            buttons = `<button class="btn btn-outline-success btn-sm w-100" data-action="approve" data-key="${esc(key)}"><i class="fas fa-check" aria-hidden="true"></i> Approve after all</button>`;
        } else if (status === 'suspended') {
            buttons = '<p class="small text-muted mb-0">Enable the owner\'s account on the Users page to bring this hotel back.</p>';
        }

        // New registrations keep the licence in hotelLicenses; older ones still carry it on the hotel
        const licenseUrl = ReplateUI.safeUrl(licenseUrls[key] || hotel.licenseUrl || hotel.license);
        const license = licenseUrl
            ? `<a href="${esc(licenseUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-dark btn-sm w-100 mb-3"><i class="fas fa-file-lines" aria-hidden="true"></i> View license</a>`
            : '<p class="small text-muted mb-3">No license uploaded.</p>';
        const gps = (hotel.latitude && hotel.longitude)
            ? `<p class="small mb-2"><i class="fas fa-location-arrow" aria-hidden="true"></i> ${esc(hotel.latitude)}, ${esc(hotel.longitude)}</p>`
            : '';
        const reason = status === 'rejected' && hotel.rejectionReason
            ? `<p class="small text-danger mb-2">Reason: ${esc(hotel.rejectionReason)}</p>`
            : '';

        return `
            <div class="col-md-6 col-xl-4 mb-4">
                <div class="card h-100 data-panel">
                    <div class="card-body">
                        <h2 class="h5 mb-1">${esc(hotel.hotelName || 'Hotel')}</h2>
                        <p class="small text-muted mb-2">Owner: ${esc(hotel.ownerName || '-')}</p>
                        <p class="small mb-1"><i class="fas fa-envelope" aria-hidden="true"></i> ${esc(hotel.email || '-')}</p>
                        <p class="small mb-1"><i class="fas fa-phone" aria-hidden="true"></i> ${esc(hotel.phone || '-')}</p>
                        <p class="small mb-2"><i class="fas fa-map-marker-alt" aria-hidden="true"></i> ${esc(hotel.address || '-')}</p>
                        ${gps}
                        ${reason}
                        ${license}
                        ${buttons}
                    </div>
                </div>
            </div>`;
    }

    // Asks to confirm, then sets the hotel status.
    async function updateStatus(key, status) {
        const ok = await ReplateUI.confirmAction(`This hotel will be marked as ${status}.`, {
            title: status === 'approved' ? 'Approve this hotel?' : 'Update hotel?',
            confirmText: status === 'approved' ? 'Approve' : 'Confirm'
        });
        if (!ok) return;
        try {
            await database.ref('hotels/' + key).update({ status });
            ReplateUI.toast('Hotel ' + status + '.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not update the hotel. Please try again.', 'danger');
        }
    }

    // Asks for a reason, then takes the approval back.
    async function revokeHotel(key) {
        const reason = await ReplateUI.askText('The hotel is hidden from the app and cannot add listings or manage orders until you approve it again.', {
            title: 'Revoke this approval?',
            placeholder: 'Reason (shown to the hotel)',
            confirmText: 'Revoke',
            danger: true,
            multiline: true
        });
        if (!reason) {
            if (reason !== null) ReplateUI.toast('A reason is required to revoke an approval.', 'warning');
            return;
        }
        try {
            await database.ref('hotels/' + key).update({ status: 'rejected', rejectionReason: reason });
            ReplateUI.toast('Approval revoked.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not revoke the approval. Please try again.', 'danger');
        }
    }

    // Asks for a reason, then rejects the hotel.
    async function rejectHotel(key) {
        const reason = await ReplateUI.askText('Tell the hotel why the registration was declined.', {
            title: 'Reject this hotel?',
            placeholder: 'Reason (shown to the hotel)',
            confirmText: 'Reject',
            danger: true,
            multiline: true
        });
        if (!reason) {
            if (reason !== null) ReplateUI.toast('A reason is required to reject a hotel.', 'warning');
            return;
        }
        try {
            await database.ref('hotels/' + key).update({ status: 'rejected', rejectionReason: reason });
            ReplateUI.toast('Hotel rejected.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not reject the hotel. Please try again.', 'danger');
        }
    }

    // One delegated listener instead of inline onclick attributes
    document.querySelector('main').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const key = button.dataset.key;
        if (button.dataset.action === 'approve') updateStatus(key, 'approved');
        else if (button.dataset.action === 'reject') rejectHotel(key);
        else if (button.dataset.action === 'revoke') revokeHotel(key);
    });
</script>

</body>
</html>
