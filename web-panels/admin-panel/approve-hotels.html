<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Approve Hotels - REPLATE Admin - REPLATE food rescue.">
    <meta name="theme-color" content="#f3f4f6">
    <meta name="robots" content="noindex, nofollow">
    <title>Approve Hotels - REPLATE Admin</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css"> <!-- Reusing Hotel CSS for consistency -->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="page-header">
                <div>
                    <h1 class="panel-title">Approve hotels</h1>
                    <p class="panel-subtitle">Review new hotels before they can list food.</p>
                </div>
            </div>

            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item" role="presentation"><a class="nav-link active" data-bs-toggle="tab" href="#pending" id="tabPending" role="tab" aria-controls="pending" aria-selected="true">Pending <span class="tab-count" data-count="pending" hidden></span></a></li>
                <li class="nav-item" role="presentation"><a class="nav-link" data-bs-toggle="tab" href="#approved" id="tabApproved" role="tab" aria-controls="approved" aria-selected="false">Approved <span class="tab-count" data-count="approved" hidden></span></a></li>
                <li class="nav-item" role="presentation"><a class="nav-link" data-bs-toggle="tab" href="#rejected" id="tabRejected" role="tab" aria-controls="rejected" aria-selected="false">Rejected <span class="tab-count" data-count="rejected" hidden></span></a></li>
                <li class="nav-item" role="presentation"><a class="nav-link" data-bs-toggle="tab" href="#suspended" id="tabSuspended" role="tab" aria-controls="suspended" aria-selected="false">Suspended <span class="tab-count" data-count="suspended" hidden></span></a></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="pending" role="tabpanel" aria-labelledby="tabPending">
                    <div id="pendingList" class="hotel-list"></div>
                </div>
                <div class="tab-pane fade" id="approved" role="tabpanel" aria-labelledby="tabApproved">
                    <div id="approvedList" class="hotel-list"></div>
                </div>
                <div class="tab-pane fade" id="rejected" role="tabpanel" aria-labelledby="tabRejected">
                    <div id="rejectedList" class="hotel-list"></div>
                </div>
                <div class="tab-pane fade" id="suspended" role="tabpanel" aria-labelledby="tabSuspended">
                    <div id="suspendedList" class="hotel-list"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/admin-shell-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    // Admin page to approve, reject or revoke hotels.
    const esc = ReplateUI.esc;
    const lists = {
        pending: document.getElementById('pendingList'),
        approved: document.getElementById('approvedList'),
        rejected: document.getElementById('rejectedList'),
        suspended: document.getElementById('suspendedList')
    };
    // hotelLicenses/{hotelKey}: the licence link is kept out of the openly readable hotels node
    let licenseUrls = {};

    // Shows placeholder cards while hotels load.
    function showLoading() {
        Object.values(lists).forEach((el) => { el.innerHTML = ReplateUI.skeleton('list', 2); });
    }

    // Waits for an admin sign-in, then loads the hotels.
    (async () => {
        const user = await ReplateUI.requireRole('admin');
        if (!user) return;
        showLoading();
        loadHotels();
    })();

    // Listens for hotels and licence links and redraws the lists.
    function loadHotels() {
        let latestHotels = null;
        const render = () => { if (latestHotels) renderHotels(latestHotels); };

        database.ref('hotelLicenses').on('value', (snap) => {
            const urls = {};
            snap.forEach((child) => { urls[child.key] = (child.val() || {}).licenseUrl || ''; });
            licenseUrls = urls;
            render();
        }, (error) => console.error('Could not load licences', error));

        database.ref('hotels').on('value', (snapshot) => {
            latestHotels = snapshot;
            render();
        }, (error) => {
            console.error('Could not load hotels', error);
            Object.values(lists).forEach((el) => { el.innerHTML = ReplateUI.errorState('Hotels could not be loaded. Check your admin access and connection.'); });
        });
    }

    // Puts each hotel into its tab by status.
    function renderHotels(snapshot) {
        {
            // Hotels with a blank or older status (active, declined) still land in the right tab
            const cards = { pending: [], approved: [], rejected: [], suspended: [] };

            snapshot.forEach((child) => {
                const hotel = child.val() || {};
                const status = ReplateSchema.normalizeHotelStatus(hotel.status);
                cards[status].push(createHotelCard(hotel, child.key, status));
            });

            document.querySelectorAll('.tab-count[data-count]').forEach((badge) => {
                const n = cards[badge.dataset.count].length;
                badge.textContent = n;
                badge.hidden = n === 0;
            });
            lists.pending.innerHTML = cards.pending.join('') || ReplateUI.emptyState('No pending hotels', 'New registrations will appear here for review.', 'fa-hourglass-half');
            lists.approved.innerHTML = cards.approved.join('') || ReplateUI.emptyState('No approved hotels yet', 'Approved partners are listed here.', 'fa-hotel');
            lists.rejected.innerHTML = cards.rejected.join('') || ReplateUI.emptyState('No rejected hotels', 'Declined registrations are listed here.', 'fa-circle-check');
            lists.suspended.innerHTML = cards.suspended.join('') || ReplateUI.emptyState('No suspended hotels', 'Suspend an account from the Users page and its hotel is listed here.', 'fa-circle-check');
        }
    }

    // Builds the card for one hotel: details on the left, actions pinned to the right (below on phones).
    function createHotelCard(hotel, key, status) {
        let buttons = '';
        if (status === 'pending') {
            buttons = `<button type="button" class="btn btn-primary" data-action="approve" data-key="${esc(key)}"><i class="fas fa-check" aria-hidden="true"></i>Approve hotel</button>
               <button type="button" class="btn btn-outline-danger" data-action="reject" data-key="${esc(key)}"><i class="fas fa-xmark" aria-hidden="true"></i>Reject</button>`;
        } else if (status === 'approved') {
            buttons = `<button type="button" class="btn btn-outline-danger" data-action="revoke" data-key="${esc(key)}"><i class="fas fa-ban" aria-hidden="true"></i>Revoke approval</button>`;
        } else if (status === 'rejected') {
            buttons = `<button type="button" class="btn btn-outline-primary" data-action="approve" data-key="${esc(key)}"><i class="fas fa-check" aria-hidden="true"></i>Approve after all</button>`;
        } else if (status === 'suspended') {
            buttons = '<p class="small text-muted mb-0">Enable the owner\'s account on the Users page to bring this hotel back.</p>';
        }

        // New registrations keep the licence in hotelLicenses; older ones still carry it on the hotel
        const licenseUrl = ReplateUI.safeUrl(licenseUrls[key] || hotel.licenseUrl || hotel.license);
        const license = licenseUrl
            ? `<a href="${esc(licenseUrl)}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-secondary"><i class="fas fa-file-lines" aria-hidden="true"></i>View licence</a>`
            : '<p class="small text-muted mb-0">No licence uploaded.</p>';
        const fact = (label, value, cls = '') => `<div><dt>${label}</dt><dd class="${cls}">${value}</dd></div>`;
        const gps = (hotel.latitude && hotel.longitude)
            ? fact('Map location', `${esc(hotel.latitude)}, ${esc(hotel.longitude)}`, 'num')
            : '';
        const reason = status === 'rejected' && hotel.rejectionReason
            ? `<p class="hotel-reason">Reason: ${esc(hotel.rejectionReason)}</p>`
            : '';
        const registered = Number(hotel.createdAt) ? fact('Registered', esc(ReplateSchema.formatDate(hotel.createdAt)), 'num') : '';

        return `
            <article class="card hotel-card">
                <div class="hotel-card-main">
                    <h2 class="section-title mb-1">${esc(hotel.hotelName || 'Hotel')}</h2>
                    <p class="hotel-owner">Owner: ${esc(hotel.ownerName || '-')}</p>
                    ${reason}
                    <dl class="hotel-facts">
                        ${fact('Email', esc(hotel.email || '-'))}
                        ${fact('Phone', esc(hotel.phone || '-'), 'num')}
                        ${fact('Address', esc(hotel.address || '-'))}
                        ${gps}
                        ${registered}
                    </dl>
                </div>
                <div class="hotel-card-actions">
                    ${license}
                    ${buttons}
                </div>
            </article>`;
    }

    // Asks to confirm, then sets the hotel status.
    async function updateStatus(key, status) {
        const ok = await ReplateUI.confirmAction(`This hotel will be marked as ${status}.`, {
            title: status === 'approved' ? 'Approve this hotel?' : 'Update hotel?',
            confirmText: status === 'approved' ? 'Approve' : 'Confirm'
        });
        if (!ok) return;
        try {
            await database.ref('hotels/' + key).update({ status });
            ReplateUI.toast('Hotel ' + status + '.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not update the hotel. Please try again.', 'danger');
        }
    }

    // Asks for a reason, then takes the approval back.
    async function revokeHotel(key) {
        const reason = await ReplateUI.askText('The hotel is hidden from the app and cannot add listings or manage orders until you approve it again.', {
            title: 'Revoke this approval?',
            label: 'Reason (shown to the hotel)',
            placeholder: 'e.g. Hygiene complaint under review…',
            confirmText: 'Revoke',
            danger: true,
            multiline: true
        });
        if (!reason) {
            if (reason !== null) ReplateUI.toast('A reason is required to revoke an approval.', 'warning');
            return;
        }
        try {
            await database.ref('hotels/' + key).update({ status: 'rejected', rejectionReason: reason });
            ReplateUI.toast('Approval revoked.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not revoke the approval. Please try again.', 'danger');
        }
    }

    // Asks for a reason, then rejects the hotel.
    async function rejectHotel(key) {
        const reason = await ReplateUI.askText('Tell the hotel why the registration was declined.', {
            title: 'Reject this hotel?',
            label: 'Reason (shown to the hotel)',
            placeholder: 'e.g. The licence photo is unreadable…',
            confirmText: 'Reject',
            danger: true,
            multiline: true
        });
        if (!reason) {
            if (reason !== null) ReplateUI.toast('A reason is required to reject a hotel.', 'warning');
            return;
        }
        try {
            await database.ref('hotels/' + key).update({ status: 'rejected', rejectionReason: reason });
            ReplateUI.toast('Hotel rejected.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not reject the hotel. Please try again.', 'danger');
        }
    }

    // One delegated listener instead of inline onclick attributes
    document.querySelector('main').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const key = button.dataset.key;
        if (button.dataset.action === 'approve') updateStatus(key, 'approved');
        else if (button.dataset.action === 'reject') rejectHotel(key);
        else if (button.dataset.action === 'revoke') revokeHotel(key);
    });
</script>

</body>
</html>
