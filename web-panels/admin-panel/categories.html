<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - REPLATE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav id="sidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse bg-dark text-white">
            <div class="position-sticky pt-3">
                <a class="navbar-brand d-block px-3 py-3 mb-3 text-center text-white" href="#">👑 ADMIN</a>
                <ul class="nav flex-column">
                    <li class="nav-item"><a class="nav-link text-white" href="approve-hotels.html">🏨 Approve Hotels</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="transactions.html">💰 Transactions</a></li>
                    <li class="nav-item"><a class="nav-link text-white active" href="categories.html">🏷️ Categories</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="analytics.html">📊 Analytics</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="#" onclick="logout()">🚪 Logout</a></li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4">Manage Food Categories</h2>

            <div class="row">
                <div class="col-md-4">
                    <div class="card p-4">
                        <h5>Add New Category</h5>
                        <form id="addCategoryForm">
                            <div class="mb-3">
                                <label>Category Name</label>
                                <input type="text" class="form-control" id="catName" required>
                            </div>
                            <div class="mb-3">
                                <label>Display Order</label>
                                <input type="number" class="form-control" id="catOrder" value="1" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Add Category</button>
                        </form>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card p-3">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Order</th>
                                    <th>Name</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="categoryTable">
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/firebase-config.js"></script>

<script>
    auth.onAuthStateChanged((user) => {
        if (user) loadCategories();
    });

    function loadCategories() {
        database.ref('categories').orderByChild('order').on('value', (snapshot) => {
            const tbody = document.getElementById('categoryTable');
            tbody.innerHTML = '';

            snapshot.forEach((child) => {
                const cat = child.val();
                const key = child.key;

                const row = `
                    <tr>
                        <td>${cat.order}</td>
                        <td>${cat.name}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory('${key}')">🗑️</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        });
    }

    document.getElementById('addCategoryForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('catName').value;
        const order = parseInt(document.getElementById('catOrder').value);

        database.ref('categories').push({
            name: name,
            order: order
        });

        document.getElementById('addCategoryForm').reset();
    });

    window.deleteCategory = function(key) {
        if(confirm("Delete this category?")) {
            database.ref('categories/' + key).remove();
        }
    }
</script>
</body>
</html>
