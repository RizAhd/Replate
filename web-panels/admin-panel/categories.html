<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Categories - REPLATE Admin - REPLATE food rescue.">
    <meta name="theme-color" content="#1a6b3c">
    <meta name="robots" content="noindex, nofollow">
    <title>Categories - REPLATE Admin</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Manage Food Categories</h1>
                    <p class="panel-subtitle mb-0">Add, edit, and organize food categories for your platform.</p>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4">
                    <div class="card p-4">
                        <h5 class="mb-3"><i class="fas fa-plus-circle me-2"></i>Add New Category</h5>
                        <form id="addCategoryForm">
                            <div class="mb-3">
                                <label class="form-label" for="catName">Category Name</label>
                                <input type="text" class="form-control" id="catName" placeholder="e.g. Rice & Curry" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="catOrder">Display Order</label>
                                <input type="number" class="form-control" id="catOrder" value="1" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-plus me-2"></i>Add Category
                            </button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card p-3">
                        <div class="table-responsive">
                            <table class="table table-hover table-stack">
                                <thead>
                                    <tr>
                                        <th>Order</th>
                                        <th>Name</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="categoryTable">
                                    <!-- Loaded via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/admin-shell-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    const esc = ReplateUI.esc;
    const tbody = document.getElementById('categoryTable');

    (async () => {
        const user = await ReplateUI.requireRole('admin');
        if (!user) return;
        tbody.innerHTML = '<tr><td colspan="3">' + ReplateUI.skeleton('rows', 3) + '</td></tr>';
        loadCategories();
    })();

    function loadCategories() {
        database.ref('categories').orderByChild('order').on('value', (snapshot) => {
            const rows = [];
            snapshot.forEach((child) => {
                const cat = child.val() || {};
                const name = cat.name || '';
                rows.push(`
                    <tr>
                        <td data-label="Order">${esc(cat.order ?? '')}</td>
                        <td data-label="Name">${esc(name)}</td>
                        <td data-label="Actions" class="actions-cell">
                            <button class="btn btn-sm btn-danger" data-action="delete" data-key="${esc(child.key)}"
                                    data-name="${esc(name)}" aria-label="Delete category ${esc(name)}">
                                <i class="fas fa-trash" aria-hidden="true"></i>
                            </button>
                        </td>
                    </tr>`);
            });
            tbody.innerHTML = rows.join('') || '<tr><td colspan="3">' +
                ReplateUI.emptyState('No categories yet', 'Add the first category using the form.', 'fa-tags') + '</td></tr>';
        }, (error) => {
            console.error('Could not load categories', error);
            tbody.innerHTML = '<tr><td colspan="3">' + ReplateUI.errorState('Categories could not be loaded. Check your admin access and connection.') + '</td></tr>';
        });
    }

    document.getElementById('addCategoryForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('catName').value.trim();
        const order = parseInt(document.getElementById('catOrder').value, 10);

        if (!name) {
            ReplateUI.toast('Enter a category name.', 'warning');
            return;
        }
        if (name.length > 40) {
            ReplateUI.toast('Keep the category name under 40 characters.', 'warning');
            return;
        }
        if (!Number.isFinite(order) || order < 0) {
            ReplateUI.toast('Display order must be a number, 0 or higher.', 'warning');
            return;
        }

        try {
            await database.ref('categories').push({ name, order });
            document.getElementById('addCategoryForm').reset();
            document.getElementById('catOrder').value = order + 1;
            ReplateUI.toast('Category added.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not add the category. Please try again.', 'danger');
        }
    });

    tbody.addEventListener('click', async (event) => {
        const button = event.target.closest('button[data-action="delete"]');
        if (!button) return;
        const ok = await ReplateUI.confirmAction(
            `"${button.dataset.name}" will be removed from the app's category list.`,
            { title: 'Delete this category?', confirmText: 'Delete', danger: true });
        if (!ok) return;
        try {
            await database.ref('categories/' + button.dataset.key).remove();
            ReplateUI.toast('Category deleted.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast('Could not delete the category. Please try again.', 'danger');
        }
    });
</script>
</body>
</html>
