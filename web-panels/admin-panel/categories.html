<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Categories - REPLATE Admin - REPLATE food rescue.">
    <meta name="theme-color" content="#1a6b3c">
    <meta name="robots" content="noindex, nofollow">
    <title>Categories - REPLATE Admin</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <div>
                    <h1 class="panel-title">Manage Food Categories</h1>
                    <p class="panel-subtitle mb-0">Add, edit, and organize food categories for your platform.</p>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-4">
                    <div class="card p-4">
                        <h5 class="mb-3"><i class="fas fa-plus-circle me-2"></i>Add New Category</h5>
                        <form id="addCategoryForm">
                            <div class="mb-3">
                                <label class="form-label" for="catName">Category Name</label>
                                <input type="text" class="form-control" id="catName" placeholder="e.g. Rice & Curry" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="catOrder">Display Order</label>
                                <input type="number" class="form-control" id="catOrder" value="1" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-plus me-2"></i>Add Category
                            </button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="card p-3">
                        <div class="table-responsive">
                            <table class="table table-hover table-stack">
                                <thead>
                                    <tr>
                                        <th>Order</th>
                                        <th>Name</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="categoryTable">
                                    <!-- Loaded via JS -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/admin-shell-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>

    auth.onAuthStateChanged((user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">ADMIN',
            activeKey: 'categories',
            links: adminShellLinks,
        });
        if (user) loadCategories();
        else window.location.href = 'login.html';
    });

    function loadCategories() {
        database.ref('categories').orderByChild('order').on('value', (snapshot) => {
            const tbody = document.getElementById('categoryTable');
            tbody.innerHTML = '';

            const rows = [];
            snapshot.forEach((child) => {
                const cat = child.val() || {};
                const key = child.key;
                rows.push(`
                    <tr>
                        <td data-label="Order">${cat.order ?? ''}</td>
                        <td data-label="Name">${cat.name || ''}</td>
                        <td data-label="Actions" class="actions-cell">
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory('${key}')">🗑️</button>
                        </td>
                    </tr>
                `);
            });

            tbody.innerHTML = rows.join('');
        });
    }

    document.getElementById('addCategoryForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('catName').value;
        const order = parseInt(document.getElementById('catOrder').value);

        database.ref('categories').push({
            name: name,
            order: order
        });

        document.getElementById('addCategoryForm').reset();
    });

    window.deleteCategory = function(key) {
        if(confirm("Delete this category?")) {
            database.ref('categories/' + key).remove();
        }
    }
</script>
</body>
</html>
