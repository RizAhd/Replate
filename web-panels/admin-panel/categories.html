<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - REPLATE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar rendered by ui-shell.js -->
        <nav id="appShellSidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h2 class="mb-4">Manage Food Categories</h2>

            <div class="row">
                <div class="col-md-4">
                    <div class="card p-4">
                        <h5>Add New Category</h5>
                        <form id="addCategoryForm">
                            <div class="mb-3">
                                <label for="catName">Category Name</label>
                                <input type="text" class="form-control" id="catName" required>
                            </div>
                            <div class="mb-3">
                                <label for="catOrder">Display Order</label>
                                <input type="number" class="form-control" id="catOrder" value="1" required>
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Add Category</button>
                        </form>
                    </div>
                </div>

                <div class="col-md-8">
                    <div class="card p-3">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th>Order</th>
                                    <th>Name</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="categoryTable">
                                <!-- Loaded via JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    const adminShellLinks = [
        { key: 'approve-hotels', href: 'approve-hotels.html', icon: 'fas fa-hotel', label: 'Approve Hotels' },
        { key: 'transactions', href: 'transactions.html', icon: 'fas fa-money-bill-wave', label: 'Transactions' },
        { key: 'categories', href: 'categories.html', icon: 'fas fa-tags', label: 'Categories' },
        { key: 'analytics', href: 'analytics.html', icon: 'fas fa-chart-line', label: 'Analytics' },
        { key: 'notifications', href: 'notifications.html', icon: 'fas fa-bell', label: 'Notifications' },
        { key: 'logout', href: '#', icon: 'fas fa-sign-out-alt', label: 'Logout', logout: true }
    ];

    auth.onAuthStateChanged((user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">ADMIN',
            activeKey: 'categories',
            links: adminShellLinks,
        });
        if (user) loadCategories();
        else window.location.href = 'login.html';
    });

    function loadCategories() {
        database.ref('categories').orderByChild('order').on('value', (snapshot) => {
            const tbody = document.getElementById('categoryTable');
            tbody.innerHTML = '';

            const rows = [];
            snapshot.forEach((child) => {
                const cat = child.val() || {};
                const key = child.key;
                rows.push(`
                    <tr>
                        <td>${cat.order ?? ''}</td>
                        <td>${cat.name || ''}</td>
                        <td>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory('${key}')">🗑️</button>
                        </td>
                    </tr>
                `);
            });

            tbody.innerHTML = rows.join('');
        });
    }

    document.getElementById('addCategoryForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('catName').value;
        const order = parseInt(document.getElementById('catOrder').value);

        database.ref('categories').push({
            name: name,
            order: order
        });

        document.getElementById('addCategoryForm').reset();
    });

    window.deleteCategory = function(key) {
        if(confirm("Delete this category?")) {
            database.ref('categories/' + key).remove();
        }
    }
</script>
</body>
</html>
