<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - REPLATE Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav id="appShellSidebar" class="col-md-3 col-lg-2 d-md-block sidebar collapse"></nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <div class="mb-4">
                <h2 class="panel-title mb-1">Notification Center</h2>
                <p class="panel-subtitle mb-0">Send broadcast, targeted, and deal notifications to app users and hotels.</p>
            </div>

            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card data-panel p-4 h-100">
                        <h5 class="mb-3">Broadcast Notification</h5>
                        <form id="broadcastForm">
                            <div class="mb-3">
                                <label class="form-label">Audience</label>
                                <select id="broadcastTarget" class="form-select">
                                    <option value="all_users">All Users</option>
                                    <option value="customers">Customers</option>
                                    <option value="hotels">Hotels</option>
                                    <option value="admins">Admins</option>
                                    <option value="topic:deals_customers">Deals Topic (Customers)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Title</label>
                                <input id="broadcastTitle" type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Message</label>
                                <textarea id="broadcastBody" rows="3" class="form-control" required></textarea>
                            </div>
                            <div class="row g-2">
                                <div class="col-md-6">
                                    <label class="form-label">Type</label>
                                    <input id="broadcastType" type="text" class="form-control" value="announcement">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Route</label>
                                    <input id="broadcastRoute" type="text" class="form-control" value="notifications">
                                </div>
                            </div>
                            <button id="btnBroadcastSend" class="btn btn-primary mt-3 w-100" type="submit">
                                <i class="fas fa-bullhorn me-2"></i>Send Broadcast
                            </button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card data-panel p-4 h-100">
                        <h5 class="mb-3">Targeted Notification</h5>
                        <form id="targetedForm">
                            <div class="mb-3">
                                <label class="form-label">User IDs (comma separated)</label>
                                <textarea id="targetUserIds" rows="2" class="form-control" placeholder="uid1, uid2" required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Order ID (optional)</label>
                                <input id="targetOrderId" type="text" class="form-control" placeholder="-Nx123abc">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Title</label>
                                <input id="targetTitle" type="text" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Message</label>
                                <textarea id="targetBody" rows="3" class="form-control" required></textarea>
                            </div>
                            <button id="btnTargetSend" class="btn btn-success w-100" type="submit">
                                <i class="fas fa-paper-plane me-2"></i>Send Targeted
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="card data-panel p-4 mt-4">
                <h5 class="mb-3">Deal Campaign</h5>
                <form id="dealForm" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Hotel Name</label>
                        <input id="dealHotelName" type="text" class="form-control" placeholder="Grand Hotel">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Food Name</label>
                        <input id="dealFoodName" type="text" class="form-control" placeholder="Chicken Fried Rice">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Discount %</label>
                        <input id="dealDiscount" type="number" min="1" max="95" class="form-control" placeholder="50">
                    </div>
                    <div class="col-12">
                        <button id="btnDealSend" class="btn btn-warning" type="submit">
                            <i class="fas fa-fire me-2"></i>Send Deal Notification
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/ui-shell.js"></script>
<script src="../js/notifications-api.js"></script>

<script>
    const adminShellLinks = [
        { key: 'approve-hotels', href: 'approve-hotels.html', icon: 'fas fa-hotel', label: 'Approve Hotels' },
        { key: 'transactions', href: 'transactions.html', icon: 'fas fa-money-bill-wave', label: 'Transactions' },
        { key: 'categories', href: 'categories.html', icon: 'fas fa-tags', label: 'Categories' },
        { key: 'analytics', href: 'analytics.html', icon: 'fas fa-chart-line', label: 'Analytics' },
        { key: 'notifications', href: 'notifications.html', icon: 'fas fa-bell', label: 'Notifications' },
        { key: 'logout', href: '#', icon: 'fas fa-sign-out-alt', label: 'Logout', logout: true }
    ];

    auth.onAuthStateChanged((user) => {
        ReplateUI.renderSidebar('appShellSidebar', {
            title: '<img src="../assets/replate-icon.svg" alt="REPLATE" class="brand-logo-sm">ADMIN',
            activeKey: 'notifications',
            links: adminShellLinks,
        });
        if (!user) window.location.href = 'login.html';
    });

    document.getElementById('broadcastForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        ReplateUI.setButtonLoading('btnBroadcastSend', true, 'Sending...');
        try {
            const payload = {
                target: document.getElementById('broadcastTarget').value,
                title: document.getElementById('broadcastTitle').value.trim(),
                body: document.getElementById('broadcastBody').value.trim(),
                type: document.getElementById('broadcastType').value.trim() || 'announcement',
                route: document.getElementById('broadcastRoute').value.trim() || 'notifications'
            };
            await NotificationApi.sendBroadcast(payload);
            ReplateUI.showAlert('Broadcast sent successfully', 'success');
        } catch (err) {
            ReplateUI.showAlert('Failed: ' + err.message, 'danger');
        } finally {
            ReplateUI.setButtonLoading('btnBroadcastSend', false);
        }
    });

    document.getElementById('targetedForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        ReplateUI.setButtonLoading('btnTargetSend', true, 'Sending...');
        try {
            const userIds = document.getElementById('targetUserIds').value
                .split(',')
                .map(v => v.trim())
                .filter(Boolean);

            const payload = {
                userIds,
                title: document.getElementById('targetTitle').value.trim(),
                body: document.getElementById('targetBody').value.trim(),
                type: 'targeted_message',
                route: 'notifications',
                orderId: document.getElementById('targetOrderId').value.trim()
            };
            await NotificationApi.sendTargeted(payload);
            ReplateUI.showAlert('Targeted notification sent', 'success');
        } catch (err) {
            ReplateUI.showAlert('Failed: ' + err.message, 'danger');
        } finally {
            ReplateUI.setButtonLoading('btnTargetSend', false);
        }
    });

    document.getElementById('dealForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        ReplateUI.setButtonLoading('btnDealSend', true, 'Sending deal...');
        try {
            const hotelName = document.getElementById('dealHotelName').value.trim() || 'Nearby Hotel';
            const foodName = document.getElementById('dealFoodName').value.trim() || 'Fresh meal';
            const discount = document.getElementById('dealDiscount').value.trim();

            await NotificationApi.sendDeal({
                title: 'Hot Deal Nearby',
                body: `${hotelName} offers ${foodName}${discount ? ` at ${discount}% OFF` : ''}!`,
                type: 'new_deal',
                route: 'deals',
                data: { hotelName, foodName, discount }
            });
            ReplateUI.showAlert('Deal notification sent', 'success');
        } catch (err) {
            ReplateUI.showAlert('Failed: ' + err.message, 'danger');
        } finally {
            ReplateUI.setButtonLoading('btnDealSend', false);
        }
    });
</script>
</body>
</html>
