<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Users - REPLATE Admin - REPLATE food rescue.">
    <meta name="theme-color" content="#f3f4f6">
    <meta name="robots" content="noindex, nofollow">
    <title>Users - REPLATE Admin</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/dataTables.bootstrap5.min.css">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <link rel="icon" href="../assets/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
</head>
<body>
<a class="skip-link" href="#mainContent">Skip to content</a>

<div class="container-fluid">
    <div class="row">
        <!-- Admin Sidebar -->
        <nav id="appShellSidebar" class="sidebar"></nav>

        <main id="mainContent">
            <div class="page-header">
                <div>
                    <h1 class="panel-title">Users</h1>
                    <p class="panel-subtitle">Every customer and hotel account. Suspending one signs the person out until you enable it again.</p>
                </div>
            </div>

            <!-- Totals -->
            <div class="stat-grid">
                <div class="card stat-card">
                    <p class="stat-value num" id="countAll">0</p>
                    <p class="stat-label"><i class="fas fa-users" aria-hidden="true"></i>All users</p>
                </div>
                <div class="card stat-card">
                    <p class="stat-value num" id="countCustomers">0</p>
                    <p class="stat-label"><i class="fas fa-user" aria-hidden="true"></i>Customers</p>
                </div>
                <div class="card stat-card">
                    <p class="stat-value num" id="countHotels">0</p>
                    <p class="stat-label"><i class="fas fa-hotel" aria-hidden="true"></i>Hotels</p>
                </div>
                <div class="card stat-card">
                    <p class="stat-value num" id="countSuspended">0</p>
                    <p class="stat-label"><i class="fas fa-user-slash" aria-hidden="true"></i>Suspended</p>
                </div>
            </div>

            <div class="card card-body">
                <div class="d-flex justify-content-end mb-2">
                    <button type="button" class="btn btn-sm btn-outline-primary" id="exportUsers"><i class="fas fa-download me-1" aria-hidden="true"></i>Export CSV</button>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-sm-6 col-md-3">
                        <label for="roleFilter" class="form-label small mb-1">Role</label>
                        <select id="roleFilter" name="roleFilter" class="form-select form-select-sm" autocomplete="off">
                            <option value="">All roles</option>
                            <option value="customer">Customers</option>
                            <option value="hotel">Hotels</option>
                            <option value="admin">Admins</option>
                        </select>
                    </div>
                    <div class="col-sm-6 col-md-3">
                        <label for="statusFilter" class="form-label small mb-1">Status</label>
                        <select id="statusFilter" name="statusFilter" class="form-select form-select-sm" autocomplete="off">
                            <option value="">All statuses</option>
                            <option value="active">Active</option>
                            <option value="suspended">Suspended</option>
                        </select>
                    </div>
                </div>

                <div class="table-responsive">
                    <table id="usersTable" class="table table-striped align-middle table-stack w-100">
                                <caption class="visually-hidden">Every user account</caption>
                        <thead>
                            <tr>
                                <th scope="col">Name</th>
                                <th scope="col">Email</th>
                                <th scope="col">Phone</th>
                                <th scope="col">Role</th>
                                <th scope="col">Joined</th>
                                <th scope="col">Status</th>
                                <th scope="col">Action</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/dataTables.bootstrap5.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="../js/env-config.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/data-schema.js"></script>
<script src="../js/notifications-api.js"></script>
<script src="../js/admin-shell-config.js"></script>
<script src="../js/ui-shell.js"></script>

<script>
    // Admin page to list users and suspend or enable their accounts.
    const esc = ReplateUI.esc;
    let currentAdminUid = null;
    let hotelNameByUserId = {};
    let peopleByUid = {}; // uid -> person, for the CSV export

    // Waits for an admin sign-in, then loads the users.
    (async () => {
        const user = await ReplateUI.requireRole('admin');
        if (!user) return;
        currentAdminUid = user.uid;
        document.getElementById('tableBody').innerHTML =
            '<tr><td colspan="7">' + ReplateUI.skeleton('rows', 5) + '</td></tr>';
        document.getElementById('exportUsers').addEventListener('click', exportUsers);
        loadUsers();
    })();

    // Exports the rows the filters and search box currently show
    function exportUsers() {
        if (!$.fn.DataTable.isDataTable('#usersTable')) { ReplateUI.toast('There are no users to export.', 'warning'); return; }
        const rows = $('#usersTable').DataTable().rows({ search: 'applied' }).nodes().toArray()
            .map((tr) => peopleByUid[tr.dataset.uid]).filter(Boolean);
        if (rows.length === 0) { ReplateUI.toast('There are no users to export.', 'warning'); return; }
        const csv = ReplateSchema.toCsv(rows, [
            { label: 'Name', get: (p) => p.name || hotelNameByUserId[p.uid] || '' },
            { label: 'Email', key: 'email' },
            { label: 'Phone', key: 'phone' },
            { label: 'Role', key: 'role' },
            { label: 'Joined', get: (p) => p.createdAt ? new Date(p.createdAt).toISOString() : '' },
            { label: 'Status', get: (p) => p.suspended ? 'Suspended' : 'Active' },
            { label: 'Suspension reason', get: (p) => p.suspended ? p.reason : '' }
        ]);
        ReplateUI.downloadCsv('replate-users.csv', csv);
    }

    // Role / status drop-downs filter the table on top of the search box
    $.fn.dataTable.ext.search.push((settings, data) => {
        if (settings.nTable.id !== 'usersTable') return true;
        const role = document.getElementById('roleFilter').value;
        const status = document.getElementById('statusFilter').value;
        if (role && data[3].trim().toLowerCase() !== role) return false;
        if (status && data[5].trim().toLowerCase() !== status) return false;
        return true;
    });
    ['roleFilter', 'statusFilter'].forEach((id) => {
        document.getElementById(id).addEventListener('change', () => {
            if ($.fn.DataTable.isDataTable('#usersTable')) $('#usersTable').DataTable().draw();
        });
    });

    // Listens for hotels and users and redraws the table.
    function loadUsers() {
        // Hotel names come from the hotels list so a hotel owner is easy to recognise
        database.ref('hotels').on('value', (snap) => {
            const map = {};
            snap.forEach((child) => {
                const hotel = child.val() || {};
                if (hotel.userId) map[hotel.userId] = hotel.hotelName || '';
            });
            hotelNameByUserId = map;
        });

        database.ref('users').on('value', (snapshot) => {
            const people = [];
            snapshot.forEach((child) => {
                const u = child.val() || {};
                people.push({
                    uid: child.key,
                    name: u.name || u.fullName || u.hotelName || '',
                    email: u.email || '',
                    phone: u.phone || '',
                    role: ReplateSchema.normalizeUserRole(u),
                    createdAt: Number(u.createdAt) || 0,
                    suspended: String(u.status || '').toLowerCase() === 'suspended',
                    reason: u.suspensionReason || ''
                });
            });
            renderUsers(people);
        }, (error) => {
            console.error('Could not load users', error);
            document.getElementById('tableBody').innerHTML =
                '<tr><td colspan="7">' + ReplateUI.errorState('Users could not be loaded. Check your admin access and connection.') + '</td></tr>';
        });
    }

    // Draws the users table.
    function renderUsers(people) {
        document.getElementById('countAll').textContent = people.length;
        document.getElementById('countCustomers').textContent = people.filter((p) => p.role === 'customer').length;
        document.getElementById('countHotels').textContent = people.filter((p) => p.role === 'hotel').length;
        document.getElementById('countSuspended').textContent = people.filter((p) => p.suspended).length;

        const tbody = document.getElementById('tableBody');
        let previous = null;
        if ($.fn.DataTable.isDataTable('#usersTable')) {
            const table = $('#usersTable').DataTable();
            previous = { search: table.search(), page: table.page() };
            table.destroy();
        }

        if (people.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7">' +
                ReplateUI.emptyState('No users yet', 'Accounts appear here as people sign up.', 'fa-users') + '</td></tr>';
            return;
        }

        people.sort((a, b) => b.createdAt - a.createdAt);
        peopleByUid = {};
        people.forEach((p) => { peopleByUid[p.uid] = p; });
        tbody.innerHTML = people.map((p) => {
            const hotelName = p.role === 'hotel' ? hotelNameByUserId[p.uid] : '';
            const displayName = p.name || hotelName || '—';
            const joined = ReplateSchema.formatDate(p.createdAt);
            const status = p.suspended
                ? `<span class="badge badge-danger" title="${esc(p.reason)}">Suspended</span>`
                : '<span class="badge badge-success">Active</span>';

            let action = '<span class="text-muted">—</span>';
            if (p.role !== 'admin' && p.uid !== currentAdminUid) {
                action = p.suspended
                    ? `<button type="button" class="btn btn-sm btn-outline-primary" data-action="enable" data-uid="${esc(p.uid)}" data-name="${esc(displayName)}"><i class="fas fa-user-check" aria-hidden="true"></i>Enable</button>`
                    : `<button type="button" class="btn btn-sm btn-outline-secondary" data-action="suspend" data-uid="${esc(p.uid)}" data-name="${esc(displayName)}"><i class="fas fa-user-slash" aria-hidden="true"></i>Suspend</button>`;
            }

            return `
                <tr data-uid="${esc(p.uid)}">
                    <td data-label="Name">${esc(displayName)}${hotelName && p.name && hotelName !== p.name ? `<br><small class="text-muted">${esc(hotelName)}</small>` : ''}</td>
                    <td class="cell-wide" data-label="Email">${esc(p.email || '—')}</td>
                    <td data-label="Phone" class="num">${esc(p.phone || '—')}</td>
                    <td data-label="Role" class="text-capitalize">${esc(p.role)}</td>
                    <td data-label="Joined" data-order="${esc(p.createdAt)}" class="num">${esc(joined)}</td>
                    <td data-label="Status">${status}</td>
                    <td data-label="Action" class="actions-cell">${action}</td>
                </tr>`;
        }).join('');

        const table = $('#usersTable').DataTable({
            pageLength: 25,
            order: [[4, 'desc']],
            autoWidth: false
        });
        if (previous) {
            table.search(previous.search).page(previous.page).draw(false);
        }
    }

    // Asks to confirm, then suspends or enables the account.
    async function setSuspended(uid, name, suspended) {
        let reason = '';
        if (suspended) {
            const answer = await ReplateUI.askText(
                `${name} will be signed out and cannot sign in again until you enable the account. A hotel's dishes are hidden from the app while it is suspended.`,
                { title: 'Suspend this account?', label: 'Reason (optional, only admins see it)', placeholder: 'e.g. Spam reviews…', confirmText: 'Suspend', danger: true, multiline: true });
            if (answer === null) return;
            reason = answer;
        } else {
            const ok = await ReplateUI.confirmAction(`${name} will be able to sign in again.`, {
                title: 'Enable this account?', confirmText: 'Enable' });
            if (!ok) return;
        }

        try {
            await NotificationApi.setUserSuspended(uid, suspended, reason);
            ReplateUI.toast(suspended ? 'Account suspended.' : 'Account enabled.', 'success');
        } catch (error) {
            console.error(error);
            ReplateUI.toast(ReplateUI.errorText(error, 'Could not update the account. Please try again.'), 'danger');
        }
    }

    // One delegated listener instead of inline onclick attributes
    document.getElementById('tableBody').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        setSuspended(button.dataset.uid, button.dataset.name || 'This user', button.dataset.action === 'suspend');
    });
</script>
</body>
</html>
